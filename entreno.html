/* ---- Lectura en voz alta (voz del propio dispositivo, sin conexión) ---- */
const PREFERRED_VOICE_KEY = 'preferred_voice_uri';
let preferredVoiceURI = null;
let cachedVoices = [];

function refreshVoicesCache(){
  try{ cachedVoices = window.speechSynthesis.getVoices() || []; }catch(e){}
}
if (typeof window !== 'undefined' && 'speechSynthesis' in window){
  refreshVoicesCache();
  window.speechSynthesis.onvoiceschanged = refreshVoicesCache;
}

function pickVoiceForUtterance(utt){
  refreshVoicesCache();
  let voice = null;
  if (preferredVoiceURI) voice = cachedVoices.find(v=>v.voiceURI===preferredVoiceURI);
  if (!voice){
    const esVoices = cachedVoices.filter(v=>v.lang && v.lang.toLowerCase().startsWith('es'));
    voice = esVoices.find(v=>/enhanced|premium|neural/i.test(v.name))
      || esVoices.find(v=>v.localService===false)
      || esVoices[0] || null;
  }
  if (voice) utt.voice = voice;
}

function buildSpeechText(entry, s){
  const name = entry.name || (DICT[entry.code] || ('Código ' + entry.code));
  const kgText = (s.kg!==null && s.kg!==undefined) ? (s.kg + ' kilos') : (s.kgRaw ? ('peso ' + s.kgRaw) : 'peso sin especificar');
  const repsText = s.repsParts ? s.repsParts.join(' más ') : (s.reps!=null ? String(s.reps) : (s.repsRaw || 'sin especificar'));
  let text = name + '. ' + kgText + '. ';
  text += s.series ? (s.series + (s.series===1?' serie':' series') + ' de ' + repsText + ' repeticiones.') : (repsText + ' repeticiones.');
  return text;
}
function speakText(text){
  try{
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'es-ES';
    utt.rate = 0.95;
    pickVoiceForUtterance(utt);
    window.speechSynthesis.speak(utt);
  }catch(e){}
}
function stopSpeaking(){
  try{ if ('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
}

/* ---- Cronómetro de descanso ---- */
// Estima el 1RM conocido de un código: el registro manual más reciente en
// Perfil, o si no hay, el peso más alto marcado bien/muy bien en entrenos.
function estimatedRMFor(code){
  const u = getActiveUser();
  const arr = u.rms && u.rms[code];
  if (arr && arr.length) return arr[arr.length-1].value;
  const best = trainingMaxEntryForCode(code);
  return best ? best.kg : null;
}

// Descanso sugerido en segundos, según el tipo de transición y el % del RM
// conocido (si no se conoce el RM, se usa un valor moderado por defecto).
// kind: 'sameWeight' (entre series del mismo peso), 'betweenWeights' (entre
// pesos distintos del mismo movimiento), 'betweenExercises' (al cambiar de
// movimiento).
function suggestRestSeconds(kind, pct){
  if (kind === 'betweenExercises'){
    return (pct!==null && pct>=0.85) ? 180 : 150;
  }
  if (kind === 'sameWeight'){
    if (pct===null) return 100;
    if (pct < 0.70) return 75;
    if (pct < 0.85) return 130;
    return 180;
  }
  // betweenWeights
  if (pct===null) return 100;
  if (pct < 0.85) return 100;
  if (pct < 0.92) return 140;
  return 180;
}

let restTimerInterval = null;

/* -- sonidos del cronómetro, generados con el propio dispositivo (sin archivos) -- */
let restAudioCtx = null;
function playBeep(freq, duration){
  if (restTimerMuted) return;
  try{
    if (!restAudioCtx) restAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (restAudioCtx.state === 'suspended') restAudioCtx.resume();
    const osc = restAudioCtx.createOscillator();
    const gain = restAudioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const now = restAudioCtx.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.35, now+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+duration);
    osc.connect(gain); gain.connect(restAudioCtx.destination);
    osc.start(now);
    osc.stop(now+duration+0.02);
  }catch(e){}
}
// Bocina tipo reloj de box (dos pulsos secos, más grave y áspero que un pitido).
function playHorn(){
  if (restTimerMuted) return;
  try{
    if (!restAudioCtx) restAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (restAudioCtx.state === 'suspended') restAudioCtx.resume();
    const now = restAudioCtx.currentTime;
    [0, 0.2].forEach(offset=>{
      const osc = restAudioCtx.createOscillator();
      const gain = restAudioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = 420;
      gain.gain.setValueAtTime(0.0001, now+offset);
      gain.gain.exponentialRampToValueAtTime(0.32, now+offset+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+offset+0.18);
      osc.connect(gain); gain.connect(restAudioCtx.destination);
      osc.start(now+offset);
      osc.stop(now+offset+0.2);
    });
  }catch(e){}
}

/* -- silenciar sonido/voz del cronómetro, guardado en este dispositivo -- */
const REST_TIMER_MUTED_KEY = 'rest_timer_muted';
let restTimerMuted = false;

/* -- Wake Lock: evita que la pantalla se bloquee sola por inactividad
   mientras hay un descanso en marcha (si se bloquea a mano con el botón
   físico, eso sí lo puede pausar el sistema; esto cubre el caso normal). -- */
let restWakeLock = null;
async function acquireRestWakeLock(){
  try{
    if ('wakeLock' in navigator){
      restWakeLock = await navigator.wakeLock.request('screen');
      restWakeLock.addEventListener('release', ()=>{ restWakeLock = null; });
    }
  }catch(e){ restWakeLock = null; }
}
function releaseRestWakeLock(){
  try{ if (restWakeLock) restWakeLock.release(); }catch(e){}
  restWakeLock = null;
}
if (typeof document !== 'undefined'){
  document.addEventListener('visibilitychange', ()=>{
    if (document.visibilityState === 'visible' && state.restTimer && !restWakeLock){
      acquireRestWakeLock();
    }
  });
}

function startRestTimer(entry, kg, kind){
  const rm = entry ? estimatedRMFor(entry.code) : null;
  const pct = (rm && kg) ? (kg/rm) : null;
  const seconds = suggestRestSeconds(kind, pct);
  state.restTimer = { endsAt: Date.now() + seconds*1000, totalSeconds: seconds, notified:false, thirtyBeeped:false, tenBeeped:false, fiveBeeped:false, lastSpokenSecond:null };
  if (restTimerInterval) clearInterval(restTimerInterval);
  restTimerInterval = setInterval(restTimerTick, 1000);
  acquireRestWakeLock();
  render();
}

function restTimerTick(){
  const rt = state.restTimer;
  if (!rt){ clearInterval(restTimerInterval); restTimerInterval=null; return; }
  const remaining = Math.ceil((rt.endsAt - Date.now())/1000);

  if (remaining <= 0 && !rt.notified){
    rt.notified = true;
    if (!restTimerMuted){
      try{ if (navigator.vibrate) navigator.vibrate([250,120,250,120,250]); }catch(e){}
      playHorn();
      speakText('Descanso terminado');
    }
  } else if (remaining === 30 && !rt.thirtyBeeped){
    rt.thirtyBeeped = true;
    playHorn();
    if (!restTimerMuted) speakText('Treinta segundos');
  } else if (remaining === 10 && !rt.tenBeeped){
    rt.tenBeeped = true;
    playHorn();
    if (!restTimerMuted) speakText('Diez segundos');
  } else if (remaining === 5 && !rt.fiveBeeped){
    rt.fiveBeeped = true;
    rt.lastSpokenSecond = 5;
    playHorn();
    if (!restTimerMuted) speakText('5');
  } else if (remaining>=1 && remaining<=5 && rt.lastSpokenSecond !== remaining){
    rt.lastSpokenSecond = remaining;
    if (!restTimerMuted) speakText(String(remaining));
  }

  // Actualización quirúrgica: solo se toca el número del cronómetro, nunca
  // se vuelve a dibujar toda la pantalla (si no, cualquier campo de texto
  // abierto en ese momento -como el RPE- se borraría cada segundo).
  if (!patchRestTimerBanner()) render();
}

function patchRestTimerBanner(){
  const rt = state.restTimer;
  const bar = document.getElementById('rest-timer-bar');
  if (!rt || !bar) return false;
  const remaining = Math.max(0, Math.ceil((rt.endsAt - Date.now())/1000));
  const done = remaining <= 0;
  if (String(bar.dataset.done) !== String(done)) return false; // cambia el layout -> hace falta un render completo, una sola vez
  if (done) return true; // ya está en su estado final, nada que actualizar minuto a minuto
  const mm = Math.floor(remaining/60), ss = remaining%60;
  const timeEl = bar.querySelector('.rt-time');
  if (timeEl) timeEl.textContent = mm + ':' + String(ss).padStart(2,'0');
  return true;
}

function adjustRestTimer(deltaSeconds){
  if (!state.restTimer) return;
  state.restTimer.endsAt += deltaSeconds*1000;
  const remaining = Math.ceil((state.restTimer.endsAt-Date.now())/1000);
  if (remaining > 0){
    state.restTimer.notified = false;
    if (remaining > 30) state.restTimer.thirtyBeeped = false;
    if (remaining > 10) state.restTimer.tenBeeped = false;
    if (remaining > 5) state.restTimer.fiveBeeped = false;
    if (remaining > 5) state.restTimer.lastSpokenSecond = null;
  }
  patchRestTimerBanner() || render();
}
function toggleRestTimerMute(){
  restTimerMuted = !restTimerMuted;
  storageSet(REST_TIMER_MUTED_KEY, restTimerMuted ? '1' : '0');
  render();
}
function dismissRestTimer(){
  state.restTimer = null;
  if (restTimerInterval){ clearInterval(restTimerInterval); restTimerInterval=null; }
  releaseRestWakeLock();
  render();
}
function renderRestTimerBanner(){
  const rt = state.restTimer;
  if (!rt) return null;
  const remaining = Math.max(0, Math.ceil((rt.endsAt - Date.now())/1000));
  const done = remaining <= 0;
  const mm = Math.floor(remaining/60), ss = remaining%60;
  const timeStr = mm + ':' + String(ss).padStart(2,'0');

  const bar = el('div');
  bar.id = 'rest-timer-bar';
  bar.dataset.done = String(done);
  bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:500;background:' + (done ? 'var(--ok)' : '#20242e') + ';color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.3);flex-wrap:wrap;';

  const label = el('div');
  label.innerHTML = '<div style="font-family:Oswald,sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em;opacity:.85;">'+(done?'DESCANSO TERMINADO':'DESCANSO')+'</div>' +
    '<div class="rt-time" style="font-family:IBM Plex Mono,monospace;font-weight:700;font-size:'+(done?'20px':'32px')+';">'+(done?'¡A por la siguiente!':timeStr)+'</div>';
  bar.appendChild(label);

  const btns = el('div');
  btns.style.cssText = 'display:flex;gap:8px;align-items:center;';
  const muteBtn = el('button', null, restTimerMuted ? '🔇' : '🔊');
  muteBtn.style.cssText = 'background:rgba(255,255,255,.15);border:none;color:#fff;font-size:18px;padding:10px 12px;border-radius:8px;cursor:pointer;';
  muteBtn.onclick = ()=> toggleRestTimerMute();
  btns.appendChild(muteBtn);
  if (!done){
    const mkAdjBtn = (txt, delta)=>{
      const b = el('button', null, txt);
      b.style.cssText = 'background:rgba(255,255,255,.15);border:none;color:#fff;font-family:Oswald,sans-serif;font-weight:700;font-size:15px;padding:10px 12px;border-radius:8px;cursor:pointer;';
      b.onclick = ()=> adjustRestTimer(delta);
      return b;
    };
    btns.appendChild(mkAdjBtn('−30s', -30));
    btns.appendChild(mkAdjBtn('+30s', 30));
  }
  const skip = el('button', null, done ? '✕' : 'Saltar');
  skip.style.cssText = 'background:rgba(255,255,255,.2);border:none;color:#fff;font-family:Oswald,sans-serif;font-weight:700;font-size:15px;padding:10px 14px;border-radius:8px;cursor:pointer;';
  skip.onclick = ()=> dismissRestTimer();
  btns.appendChild(skip);
  bar.appendChild(btns);

  return bar;
}

function openFlashcards(day, exIdx, cardIdx){
  state.flashcard = { day, exIdx, cardIdx: cardIdx||0, dir:null, showMemo:false, memoDraft:undefined, confirmDeleteSetIdx:null, editingSet:false };
  render();
}

function renderFlashcardOverlay(plan){
  const { day, exIdx } = state.flashcard;
  const entry = plan.days[day][exIdx];
  const totalCards = entry.sets.length + 1; // + final "what next" card
  let cardIdx = Math.max(0, Math.min(state.flashcard.cardIdx, totalCards-1));
  state.flashcard.cardIdx = cardIdx;
  const isFinal = cardIdx === entry.sets.length;
  const dirClass = state.flashcard.dir==='next' ? ' dir-next' : state.flashcard.dir==='prev' ? ' dir-prev' : '';

  const overlay = el('div','overlay fc-overlay');
  overlay.style.cssText = 'align-items:center;';
  const closeOnBg = (e)=>{ if (e.target===overlay){ stopSpeaking(); state.flashcard=null; state.newWeightDraft=null; render(); } };
  overlay.onclick = closeOnBg;

  const wrap = el('div','fc-wrap');

  const topBar = el('div','fc-top');
  const titleWrap = el('div');
  titleWrap.appendChild(el('div','fc-name', entry.name || ('Código '+entry.code)));
  titleWrap.appendChild(el('div','fc-progress', (cardIdx+1)+' / '+totalCards));
  topBar.appendChild(titleWrap);

  const rightWrap = el('div');
  rightWrap.style.cssText = 'display:flex;flex-direction:column;align-items:flex-end;gap:8px;';
  const nextHint = el('div');
  if (cardIdx < entry.sets.length-1){
    const nextSet = entry.sets[cardIdx+1];
    nextHint.style.cssText = 'font-family:IBM Plex Mono,monospace;font-weight:700;font-size:20px;color:var(--chalk);text-align:right;max-width:170px;line-height:1.2;';
    nextHint.textContent = kgDisplayText(nextSet) + '×' + (nextSet.series||'?') + '×' + repDisplayText(nextSet) + ' →';
  } else {
    nextHint.style.cssText = 'font-family:Oswald,sans-serif;font-weight:700;font-size:20px;color:var(--red);letter-spacing:.04em;';
    nextHint.textContent = 'FIN';
  }
  rightWrap.appendChild(nextHint);
  const closeBtn = el('button','fc-close','✕');
  closeBtn.onclick = ()=>{ stopSpeaking(); state.flashcard=null; state.newWeightDraft=null; render(); };
  rightWrap.appendChild(closeBtn);
  topBar.appendChild(rightWrap);
  wrap.appendChild(topBar);

  const cardArea = el('div','fc-card-area');

  // navegación con animación de "tarjeta física" que se descarta hacia un lado
  function goToCard(newIdx, dir){
    state.flashcard.editingSet = false;
    const c = cardArea.querySelector('.fc-card');
    if (c){
      c.style.animation = 'none';
      c.style.transition = 'transform .16s cubic-bezier(.5,0,.85,.4), opacity .16s linear';
      c.style.transform = dir==='next'
        ? 'translateX(-170px) translateY(10px) rotate(-14deg) scale(.96)'
        : 'translateX(170px) translateY(10px) rotate(14deg) scale(.96)';
      c.style.opacity = '0';
      setTimeout(()=>{ state.flashcard.dir = dir; state.flashcard.cardIdx = newIdx; render(); }, 130);
    } else {
      state.flashcard.dir = dir; state.flashcard.cardIdx = newIdx; render();
    }
  }

  let touchStartX = null, touchDX = 0, dragging = false;
  cardArea.addEventListener('touchstart', e=>{
    touchStartX = e.touches[0].clientX; touchDX = 0; dragging = true;
    const c = cardArea.querySelector('.fc-card');
    if (c){ c.style.animation = 'none'; c.style.transition = 'none'; }
  }, {passive:true});
  cardArea.addEventListener('touchmove', e=>{
    if (!dragging || touchStartX===null) return;
    touchDX = e.touches[0].clientX - touchStartX;
    const c = cardArea.querySelector('.fc-card');
    if (c) c.style.transform = 'translateX('+touchDX+'px) rotate('+(touchDX/14)+'deg)';
  }, {passive:true});
  cardArea.addEventListener('touchend', ()=>{
    dragging = false;
    touchStartX = null;
    const dx = touchDX; touchDX = 0;
    if (Math.abs(dx) < 45){
      const c = cardArea.querySelector('.fc-card');
      if (c){ c.style.transition = 'transform .22s cubic-bezier(.2,.8,.3,1)'; c.style.transform = 'translateX(0) rotate(0deg)'; }
      return;
    }
    if (dx < 0 && cardIdx < totalCards-1) goToCard(cardIdx+1, 'next');
    else if (dx > 0 && cardIdx > 0) goToCard(cardIdx-1, 'prev');
    else {
      const c = cardArea.querySelector('.fc-card');
      if (c){ c.style.transition = 'transform .22s cubic-bezier(.2,.8,.3,1)'; c.style.transform = 'translateX(0) rotate(0deg)'; }
    }
  }, {passive:true});

  if (!isFinal){
    const s = entry.sets[cardIdx];
    const key = checkKey(plan, day, exIdx, cardIdx);
    const status = normalizeCheck(state.checks[key]);

    const card = el('div','fc-card'+dirClass);
    const cardChg = setChangeStyle(s);
    if (cardChg){
      card.style.background = cardChg.bg;
      card.style.border = '4px solid ' + cardChg.border;
      card.style.borderRadius = '18px';
    }

    if (state.flashcard.editingSet){
      card.appendChild(el('div','fc-final-title','Editar este peso'));
      const form = el('div','fc-newweight-form');
      const repsVal = s.repsParts ? s.repsParts.join('+') : (s.reps ?? '');
      const mkField = (label, id, width, value, inputMode)=>{
        const wrapF = el('div','fc-field');
        wrapF.appendChild(el('div','fc-field-label', label));
        const inp = document.createElement('input');
        inp.type = 'text'; inp.inputMode = inputMode || 'numeric';
        inp.value = value===null||value===undefined ? '' : value;
        inp.style.width = width+'px';
        inp.className = 'fc-field-input';
        inp.id = 'edit-set-'+id;
        wrapF.appendChild(inp);
        return wrapF;
      };
      form.appendChild(mkField('KG','kg',90, s.kg));
      form.appendChild(mkField('Series','series',78, s.series));
      form.appendChild(mkField('Repes','reps',78, repsVal, 'text'));
      card.appendChild(form);

      const editActions = el('div','fc-final-actions');
      const cancelBtn = el('button','mark-btn','Cancelar');
      cancelBtn.onclick = ()=>{ state.flashcard.editingSet = false; render(); };
      const saveEditBtn = el('button','mark-btn ok selected','Guardar cambios');
      saveEditBtn.onclick = ()=>{
        const kgVal = document.getElementById('edit-set-kg').value.trim();
        const serVal = document.getElementById('edit-set-series').value.trim();
        const repVal = document.getElementById('edit-set-reps').value.trim();
        const newKg = Number(kgVal.replace(',','.'));
        if (isNaN(newKg) || newKg<=0) return;
        if (!s.original && !s.added){
          s.original = { kg: s.kg, series: s.series ?? null, reps: s.reps ?? null, repsParts: s.repsParts || null, repsRaw: s.repsRaw || null };
        }
        const repsInfo = parseRepsCell(repVal);
        s.kg = newKg;
        s.series = serVal==='' ? null : parseInt(serVal,10);
        s.reps = repsInfo.total;
        s.repsParts = repsInfo.parts;
        s.edited = true;
        // Si se deja igual que lo programado, deja de contar como cambiado
        if (s.original && s.original.kg === s.kg && (s.original.series ?? null) === (s.series ?? null) && (s.original.reps ?? null) === (s.reps ?? null)){
          delete s.original; delete s.edited;
        }
        persistUserData();
        state.flashcard.editingSet = false;
        render();
      };
      editActions.appendChild(cancelBtn); editActions.appendChild(saveEditBtn);
      card.appendChild(editActions);
      cardArea.appendChild(card);
      wrap.appendChild(cardArea);
      overlay.appendChild(wrap);
      return overlay;
    }

    card.appendChild(el('div','fc-kg', kgDisplayText(s)));
    if (s.optional){
      const optBadge = el('div', null, '🔓 Serie opcional (según cómo vayas)');
      optBadge.style.cssText = 'font-family:Inter,sans-serif;font-size:18px;color:var(--yellow-deep);text-align:center;font-weight:700;';
      card.appendChild(optBadge);
    }
    const repDisplay = repDisplayText(s);
    card.appendChild(el('div','fc-setrep', (s.series||'?')+' serie'+((s.series===1)?'':'s')+' × '+repDisplay+(s.reps===1&&!s.repsRaw?' rep':' reps')));
    if (s.cluster){
      const c = s.cluster;
      const restLabel = c.restSeconds!=null ? (c.restSeconds+'"') : (c.raw || '');
      const clusterLine = el('div');
      clusterLine.style.cssText = 'font-family:IBM Plex Mono,monospace;font-size:32px;font-weight:700;color:var(--chalk);text-align:center;line-height:1.25;';
      const clusterReps = c.restSeconds!=null ? (c.reps ?? repDisplayText(c)) : repDisplayText(c);
      clusterLine.textContent = (restLabel ? 'Descanso '+restLabel+' → ' : '→ ') + kgDisplayText(c) + '×' + (c.series||'?') + '×' + clusterReps;
      card.appendChild(clusterLine);
    }
    if (entry.parts && entry.parts.length > 1){
      const comboHint = el('div');
      comboHint.style.cssText = 'font-family:Inter,sans-serif;font-size:18px;font-weight:600;color:var(--muted);text-align:center;';
      comboHint.textContent = entry.parts.map((p,i)=>{
        const n = s.repsParts ? s.repsParts[i] : null;
        const base = DICT[p.code] || ('Cód. '+p.code);
        return (n!==null&&n!==undefined ? n+'× ' : '') + base + (p.modifier ? ' ('+p.modifier+')' : '');
      }).join(' + ');
      card.appendChild(comboHint);
    }
    if (cardChg){
      const editedBadge = el('div', null, cardChg.label);
      editedBadge.style.cssText = 'font-family:Inter,sans-serif;font-size:18px;font-weight:700;color:#fff;background:' + cardChg.border + ';padding:8px 14px;border-radius:10px;text-align:center;';
      card.appendChild(editedBadge);
      const detail = setChangeDetail(s);
      if (detail){
        const d = el('div', null, detail);
        d.style.cssText = 'font-family:IBM Plex Mono,monospace;font-size:17px;font-weight:600;color:var(--chalk);text-align:center;margin-top:-12px;';
        card.appendChild(d);
      }
    }

    if (s.series && s.series > 1){
      const seriesLbl = el('div', null, 'MARCA CADA SERIE');
      seriesLbl.style.cssText = 'font-family:Oswald,sans-serif;font-weight:700;font-size:13px;color:var(--muted-2);letter-spacing:.04em;text-align:center;margin-top:-6px;';
      card.appendChild(seriesLbl);
      const seriesRow = el('div');
      seriesRow.style.cssText = 'display:flex;gap:8px;width:100%;justify-content:center;flex-wrap:wrap;';
      const progress = state.seriesProgress[key] || [];
      for (let i=0;i<s.series;i++){
        const done = !!progress[i];
        const sBtn = el('button', null, String(i+1));
        sBtn.style.cssText = 'width:50px;height:50px;border-radius:12px;font-family:Oswald,sans-serif;font-weight:700;font-size:22px;cursor:pointer;border:2px solid ' +
          (done ? 'var(--ok)' : 'var(--surface-3)') + ';background:' + (done ? 'var(--ok)' : 'var(--surface-2)') + ';color:' + (done ? '#fff' : 'var(--chalk)') + ';';
        sBtn.onclick = ()=>{
          const arr = state.seriesProgress[key] ? state.seriesProgress[key].slice() : [];
          const wasDone = arr[i];
          arr[i] = !arr[i];
          if (arr.some(Boolean)) state.seriesProgress[key] = arr;
          else delete state.seriesProgress[key];
          if (!wasDone) recordDayDate(plan, day);
          persistUserData();
          if (!wasDone) startRestTimer(entry, s.kg, 'sameWeight');
          render();
        };
        seriesRow.appendChild(sBtn);
      }
      card.appendChild(seriesRow);
    }

    const markRow = el('div','fc-mark-row');
    SET_RATING_LEVELS.forEach(level=>{
      const selected = status === level.value;
      const btn = el('button','fc-mark'+(selected?' selected':''), level.icon);
      if (selected){ btn.style.background = level.color; btn.style.borderColor = level.color; }
      btn.onclick = ()=>{
        const wasThis = status === level.value;
        state.checks[key] = wasThis ? null : level.value;
        if (!state.checks[key]) delete state.checks[key];
        if (!wasThis) recordDayDate(plan, day);
        persistUserData();
        if (!wasThis){
          const kind = (cardIdx < entry.sets.length-1) ? 'betweenWeights' : 'betweenExercises';
          startRestTimer(entry, s.kg, kind);
        }
        if (!wasThis && cardIdx < totalCards-1) goToCard(cardIdx+1, 'next');
        else render();
      };
      markRow.appendChild(btn);
    });
    card.appendChild(markRow);

    const stopBtn = el('button', null, '⏹ Terminar ejercicio');
    stopBtn.style.cssText = 'width:100%;margin-top:10px;background:var(--surface-2);border:3px solid var(--red);color:var(--red);font-family:Oswald,sans-serif;font-weight:700;font-size:21px;padding:17px 0;border-radius:12px;cursor:pointer;';
    stopBtn.onclick = ()=>{ stopSpeaking(); dismissRestTimer(); goToCard(totalCards-1, 'next'); };
    card.appendChild(stopBtn);

    const listenBtn = el('button', null, '🔊 Escuchar');

    ta.addEventListener('input', e=>{ draft.text = e.target.value; });

    const skipBtn = el('button','mark-btn','Cerrar sin guardar');
    skipBtn.onclick = ()=>{ stopSpeaking(); state.flashcard=null; render(); };
    const saveBtn = el('button','mark-btn ok selected','Guardar nota');
    saveBtn.onclick = ()=>{
      const text = ta.value.trim();
      if (text || draft.rpe!==null || draft.feeling!==null){
        state.notes[nKey] = { text, rpe: draft.rpe, feeling: draft.feeling };
        recordDayDate(plan, day);
      } else delete state.notes[nKey];
      persistUserData();
      state.flashcard = null;
      render();
    };
    actions.appendChild(skipBtn); actions.appendChild(saveBtn);
    card.appendChild(actions);
    cardArea.appendChild(card);
  } else {
    const card = el('div','fc-card fc-final'+dirClass);
    card.appendChild(el('div','fc-final-title','Ejercicio completo'));
    card.appendChild(el('div','fc-final-sub','¿Subimos de peso o lo dejamos aquí?'));

    if (!state.newWeightDraft){
      const btnRow = el('div','fc-final-actions');
      const addBtn = el('button','mark-btn ok selected','+ Nuevo peso');
      addBtn.onclick = ()=>{
        const last = entry.sets[entry.sets.length-1] || {kg:null,series:null,reps:null};
        state.newWeightDraft = { kg:last.kg, series:last.series, reps:last.reps };
        render();
      };
      const doneBtn = el('button','mark-btn','Finalizar');
      doneBtn.onclick = ()=>{
        state.flashcard.showMemo = true;
        state.flashcard.memoDraft = undefined;
        render();
      };

      card.appendChild(btnRow);

      const form = el('div','fc-newweight-form');
      const mk = (label, field, width)=>{

        wrapF.appendChild(el('div','fc-field-label', label));
        const inp = document.createElement('input');
        inp.type = 'text'; inp.inputMode='numeric';
        inp.value = state.newWeightDraft[field] ?? '';
        inp.style.width = width+'px';
        inp.className = 'fc-field-input';
        inp.addEventListener('change', ()=>{
          const v = inp.value.trim();
          state.newWeightDraft[field] = v==='' ? null : Number(v.replace(',','.'));
        });
        wrapF.appendChild(inp);
        return wrapF;
      };
      form.appendChild(mk('KG','kg',90));
      form.appendChild(mk('Series','series',78));
      form.appendChild(mk('Repes','reps',78));
      card.appendChild(form);

      const confirmRow = el('div','fc-final-actions');
      const cancelBtn = el('button','mark-btn','Cancelar');
      cancelBtn.onclick = ()=>{ state.newWeightDraft=null; render(); };
      const saveBtn = el('button','mark-btn ok selected','Añadir');
      saveBtn.onclick = ()=>{
        const nw = state.newWeightDraft;
        if (nw.kg===null || nw.kg===undefined || isNaN(nw.kg)){ return; }
        entry.sets.push({ kg:nw.kg, series:nw.series??null, reps:nw.reps??null, added:true });
        persistUserData();
        state.newWeightDraft = null;
        state.flashcard.cardIdx = entry.sets.length-1; // jump straight to the new set's card
        render();
      };
      confirmRow.appendChild(cancelBtn); confirmRow.appendChild(saveBtn);
      card.appendChild(confirmRow);
    }
    cardArea.appendChild(card);
  }
  wrap.appendChild(cardArea);

  const navRow = el('div','fc-nav');
  const prevBtn = el('button','fc-nav-btn','‹');
  prevBtn.disabled = cardIdx===0;
  prevBtn.onclick = ()=>{ if (cardIdx>0) goToCard(cardIdx-1, 'prev'); };
  const dots = el('div','fc-dots');
  for (let i=0;i<totalCards;i++){
    dots.appendChild(el('div','fc-dot'+(i===cardIdx?' active':'')));
  }
  const nextBtn = el('button','fc-nav-btn','›');
  nextBtn.disabled = cardIdx===totalCards-1;
  nextBtn.onclick = ()=>{ if (cardIdx<totalCards-1) goToCard(cardIdx+1, 'next'); };
  navRow.appendChild(prevBtn); navRow.appendChild(dots); navRow.appendChild(nextBtn);
  wrap.appendChild(navRow);

  overlay.appendChild(wrap);
  return overlay;
}

/* ---- Analytics ---- */
function buildAnalytics(){
  const byCode = {};
  const plansSorted = [...state.plans].filter(p=>!p.needsReview).sort((a,b)=>{
    const wa = typeof a.meta.week === 'number' ? a.meta.week : null;
    const wb = typeof b.meta.week === 'number' ? b.meta.week : null;
    if (wa!==null && wb!==null && wa!==wb) return wa-wb;
    return a.uploadedAt - b.uploadedAt;
  });
  plansSorted.forEach(plan=>{
    const perCodeThisPlan = {};
    DAY_ORDER.forEach(day=>{
      const entries = plan.days[day]; if (!entries) return;
      entries.forEach((entry,exIdx)=>{
        if (entry.type!=='exercise') return;
        if (!perCodeThisPlan[entry.code]) perCodeThisPlan[entry.code] = { name: entry.name, kgs:[], ratings:[] };
        entry.sets.forEach((s,si)=>{
          if (s.kg!==null && s.kg!==undefined) perCodeThisPlan[entry.code].kgs.push(s.kg);
          const r = normalizeCheck(state.checks[checkKey(plan,day,exIdx,si)]);
          if (r!==null) perCodeThisPlan[entry.code].ratings.push(r);
        });
      });
    });
    Object.keys(perCodeThisPlan).forEach(code=>{
      if (!byCode[code]) byCode[code] = { name: perCodeThisPlan[code].name, points: [] };
      const c = perCodeThisPlan[code];
      if (c.kgs.length === 0) return;
      byCode[code].points.push({
        label: (plan.meta.week!==null && plan.meta.week!==undefined) ? ('S'+plan.meta.week) : new Date(plan.uploadedAt).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}),
        maxKg: Math.max(...c.kgs),
        ratings: c.ratings
      });
    });
  });
  return byCode;
}

// Movimientos fijos para la sección "Máximos acumulados" del informe
// semanal: arrancada, dos tiempos, cargada, jerk, sentadilla delante y
// sentadilla detrás — se entrenen o no esa semana en concreto.
const WEEK_CHART_CODES = [1, 10, 11, 18, 51, 50];
function weekMovementCharts(){
  const byCode = buildAnalytics();
  return WEEK_CHART_CODES
    .filter(code=>byCode[code] && byCode[code].points.length)
    .map(code=>({ code, name: byCode[code].name, points: byCode[code].points }));
}

function sparklineSVG(points){
  const width = 280, height = 100, padX = 16, padY = 16;
  const kgs = points.map(p=>p.maxKg);
  const min = Math.min(...kgs), max = Math.max(...kgs);
  const range = (max-min) || 1;
  const stepX = points.length>1 ? (width-2*padX)/(points.length-1) : 0;
  const coords = points.map((p,i)=>{
    const x = padX + i*stepX;
    const y = height-padY - ((p.maxKg-min)/range)*(height-2*padY);
    return { x, y, p };
  });
  const pathD = coords.map((c,i)=> (i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
  const dots = coords.map(c=>{
    let color = '#8892a0';
    if (c.p.ratings && c.p.ratings.length){
      const avg = c.p.ratings.reduce((a,b)=>a+b,0)/c.p.ratings.length;
      const info = ratingInfo(Math.round(avg));
      if (info) color = info.color;
    }
    return '<circle cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="4.5" fill="'+color+'" stroke="#ffffff" stroke-width="1.5"/>';
  }).join('');
  const labels = coords.map(c=>
    '<text x="'+c.x.toFixed(1)+'" y="'+(height-2)+'" font-size="9" fill="#6b7482" text-anchor="middle" font-family="IBM Plex Mono, monospace">'+c.p.label+'</text>'
  ).join('');
  return '<svg width="100%" height="'+height+'" viewBox="0 0 '+width+' '+height+'" preserveAspectRatio="xMidYMid meet">'+
    '<path d="'+pathD+'" fill="none" stroke="#3f6f9f" stroke-width="2.5"/>'+dots+labels+'</svg>';
}

  const min = Math.min(...vals), max = Math.max(...vals);

  });
  const pathD = coords.map((c,i)=> (i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
  const dots = coords.map(c=>
    '<circle cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="4" fill="#c99a2e" stroke="#ffffff" stroke-width="1.5"/>'
  ).join('');
  const labels = coords.map(c=>
    '<text x="'+c.x.toFixed(1)+'" y="'+(height-2)+'" font-size="9" fill="#6b7482" text-anchor="middle" font-family="IBM Plex Mono, monospace">'+new Date(c.e.date).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'})+'</text>'
  ).join('');
  return '<svg width="100%" height="'+height+'" viewBox="0 0 '+width+' '+height+'" preserveAspectRatio="xMidYMid meet">'+
    '<path d="'+pathD+'" fill="none" stroke="#c99a2e" stroke-width="2.5"/>'+dots+labels+'</svg>';
}

/* ---- Evolución de la tensión arterial (sistólica y diastólica) ---- */
function tensionHistorySVG(entries){
  const width = 280, height = 100, padX = 16, padY = 16;
  const allVals = entries.flatMap(e=>[e.sistolica, e.diastolica]);
  const min = Math.min(...allVals), max = Math.max(...allVals);
  const range = (max-min) || 1;
  const stepX = entries.length>1 ? (width-2*padX)/(entries.length-1) : 0;
  const coordsFor = (field)=> entries.map((e,i)=>{
    const x = padX + i*stepX;
    const y = height-padY - ((e[field]-min)/range)*(height-2*padY);
    return { x, y };
  });
  const sysC = coordsFor('sistolica'), diaC = coordsFor('diastolica');
  const pathFor = (coords)=> coords.map((c,i)=> (i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
  const dotsFor = (coords, color)=> coords.map(c=>
    '<circle cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="3.5" fill="'+color+'" stroke="#ffffff" stroke-width="1.3"/>'
  ).join('');
  const labels = sysC.map((c,i)=>
    '<text x="'+c.x.toFixed(1)+'" y="'+(height-2)+'" font-size="9" fill="#6b7482" text-anchor="middle" font-family="IBM Plex Mono, monospace">'+new Date(entries[i].date).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'})+'</text>'
  ).join('');
  return '<svg width="100%" height="'+height+'" viewBox="0 0 '+width+' '+height+'" preserveAspectRatio="xMidYMid meet">'+
    '<path d="'+pathFor(sysC)+'" fill="none" stroke="#c14a3a" stroke-width="2.2"/>'+
    '<path d="'+pathFor(diaC)+'" fill="none" stroke="#3f6f9f" stroke-width="2.2"/>'+
    dotsFor(sysC,'#c14a3a') + dotsFor(diaC,'#3f6f9f') + labels + '</svg>';
}

/* ---- Regresión lineal simple, para proyectar la evolución del RM ---- */
function linearRegression(points){
  const n = points.length;
  if (n < 2) return null;
  const sumX = points.reduce((a,p)=>a+p.x,0);
  const sumY = points.reduce((a,p)=>a+p.y,0);
  const sumXY = points.reduce((a,p)=>a+p.x*p.y,0);
  const sumXX = points.reduce((a,p)=>a+p.x*p.x,0);
  const denom = (n*sumXX - sumX*sumX);
  if (denom === 0) return null;
  const slope = (n*sumXY - sumX*sumY) / denom;
  const intercept = (sumY - slope*sumX) / n;
  return { slope, intercept };
}

/* ---- Predicción de cuándo se alcanzará el objetivo de un ejercicio,
   a partir de la tendencia de los RM registrados ---- */
function goalProjectionText(u, code){
  const goal = u.objetivos && u.objetivos.metas ? u.objetivos.metas[code] : null;
  if (!goal) return null;
  const entries = ((u.rms && u.rms[code]) || []).slice().sort((a,b)=>a.date-b.date);
  if (entries.length < 2){
    return { text: 'Registra al menos 2 RM en fechas distintas para poder predecir cuándo llegarás al objetivo.', tone: 'muted' };
  }
  const latest = entries[entries.length-1];
  if (latest.value >= goal){
    return { text: '🎉 Objetivo ya alcanzado (' + latest.value + 'kg).', tone: 'ok' };
  }
  const t0 = entries[0].date;
  const points = entries.map(e=>({ x: (e.date-t0)/86400000, y: e.value }));
  const reg = linearRegression(points);
  if (!reg || reg.slope <= 0.001){
    return { text: 'Con la tendencia actual entre tus registros, el peso no está subiendo — te costará llegar al objetivo si no cambia el ritmo.', tone: 'warn' };
  }
  const xTargetDays = (goal - reg.intercept) / reg.slope;
  const targetTimestamp = t0 + xTargetDays*86400000;
  const daysFromNow = Math.round((targetTimestamp - Date.now()) / 86400000);
  if (daysFromNow <= 0){
    return { text: 'Según tu progreso, deberías estar muy cerca del objetivo ya.', tone: 'ok' };
  }
  const targetDate = new Date(Date.now() + daysFromNow*86400000);
  const weeks = Math.max(1, Math.round(daysFromNow/7));
  const dateStr = targetDate.toLocaleDateString('es-ES', { day:'2-digit', month:'long', year:'numeric' });
  const kgPerWeek = (reg.slope*7).toFixed(2);
  const confidence = entries.length >= 4 ? '' : ' (estimación con pocos datos — se ajustará con más registros)';
  return { text: 'A este ritmo (~' + kgPerWeek + ' kg/semana), llegarías a ' + goal + 'kg hacia el ' + dateStr + ' (~' + weeks + (weeks===1?' semana':' semanas') + ')' + confidence + '.', tone: 'ok' };
}

/* ---- Pesos ya registrados en los entrenos, para poder usarlos como RM ---- */
function trainingEntriesForCode(code){
  const out = [];
  state.plans.forEach(plan=>{
    DAY_ORDER.forEach(day=>{
      const dayEntries = plan.days[day]; if (!dayEntries) return;
      dayEntries.forEach((entry, exIdx)=>{
        if (entry.type!=='exercise' || entry.code!==code) return;
        entry.sets.forEach((s, si)=>{
          if (s.kg===null || s.kg===undefined) return;
          const status = normalizeCheck(state.checks[checkKey(plan, day, exIdx, si)]);
          out.push({ kg: s.kg, week: plan.meta && plan.meta.week, uploadedAt: plan.uploadedAt, ok: status!==null && status>=4 });
        });
      });
    });
  });
  return out;
}

function trainingMaxEntryForCode(code){
  const entries = trainingEntriesForCode(code);
  if (!entries.length) return null;
  const ok = entries.filter(e=>e.ok);
  const pool = ok.length ? ok : entries;
  let best = pool[0];
  pool.forEach(e=>{ if (e.kg > best.kg) best = e; });
  return best;
}

/* ---- Barras comparando el RM entre distintos ejercicios del mismo deportista ---- */
function exerciseCompareBars(){
  const u = getActiveUser();
  const wrap = el('div');
  const codes = Object.keys(u.rms||{}).filter(c=>u.rms[c] && u.rms[c].length).map(Number);
  if (!codes.length){
    wrap.appendChild(el('div','ex-hint','Registra al menos un RM para ver la comparativa entre ejercicios.'));
    return wrap;
  }
  const rows = codes.map(code=>{
    const entries = u.rms[code];
    return { code, name: DICT[code] || ('Código '+code), value: entries[entries.length-1].value };
  }).sort((a,b)=>b.value-a.value);
  const maxV = Math.max(...rows.map(r=>r.value));
  rows.forEach(r=>{
    const line = el('div'); line.style.cssText = 'margin:10px 0;';
    const isMain = (r.code===1 || r.code===10);
    const label = el('div');
    label.style.cssText = 'display:flex;justify-content:space-between;font-family:IBM Plex Mono,monospace;font-size:12.5px;margin-bottom:4px;' +
      (isMain ? 'color:var(--chalk);font-weight:700;' : 'color:var(--muted);');
    label.innerHTML = '<span>'+r.code+' · '+r.name+'</span><span>'+r.value+' kg</span>';
    const barBg = el('div');
    barBg.style.cssText = 'height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;';
    const bar = el('div');
    const pct = Math.max(4, Math.round(100*r.value/maxV));
    bar.style.cssText = 'height:100%;width:'+pct+'%;background:'+(isMain?'var(--yellow-deep)':'var(--surface-3)')+';border-radius:6px;';
    barBg.appendChild(bar);
    line.appendChild(label); line.appendChild(barBg);
    wrap.appendChild(line);
  });
  return wrap;
}

      u.rms[code].push({ value, date: (new Date(state.rmForm.date)).getTime() || Date.now() });

      state.rmForm = null;
      render();

  }

  const codesWithRm = Object.keys(u.rms||{}).filter(c=>u.rms[c] && u.rms[c].length).map(Number).sort((a,b)=>a-b);
  if (!codesWithRm.length){
    section.appendChild(el('div','empty-day','Todavía no has registrado ningún RM. Usa "+ Registrar RM" para empezar.'));

      entries.pop();
      if (!entries.length) delete u.rms[code];
      saveUsersAsync(users);
      render();

    card.appendChild(top2);
    if (entries.length >= 2){
      const chartWrap = el('div'); chartWrap.style.cssText = 'margin:12px 0 4px 0;';

  /* -- Comparativa entre ejercicios -- */
  const cmpHeading = el('div','day-heading');

  section.appendChild(cmpHeading);

  cmpCard.style.cursor = 'default';
  cmpCard.appendChild(exerciseCompareBars());
  section.appendChild(cmpCard);

  wrap.appendChild(section);
  return wrap;
}

/* ============== COPIA DE SEGURIDAD ============== */
// Aunque ahora los datos se guardan en el almacén persistente de Claude
// (window.storage) en vez de localStorage, sigue sin haber ninguna copia
// fuera de esta app: si algo fallara con ese almacén, la única red de
// seguridad real es exportar de vez en cuando este .json con TODOS los
// usuarios, sus planes, marcas, notas, RM y objetivos.

function anyUserHasData(){
  return users.some(u=>{
    const cached = userDataCache[u.id];
    if (cached && cached.plans && cached.plans.length) return true;
    if (u.rms && Object.keys(u.rms).length) return true;
    if (u.metrics && u.metrics.length) return true;
    return false;
  });
}

async function buildBackupObject(){
  const backup = { version:1, exportedAt: Date.now(), activeUserId: activeUserId, users: users, data: {} };
  for (const u of users){
    backup.data[u.id] = userDataCache[u.id] || await loadUserDataAsync(u.id);
  }
  return backup;
}

async function exportBackup(){
  const backup = await buildBackupObject();
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'mi-plan-halterofilia-backup-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  lastBackupTs = Date.now();
  storageSet(LAST_BACKUP_KEY, String(lastBackupTs));
}

function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const backup = JSON.parse(e.target.result);
      if (!backup || !Array.isArray(backup.users) || !backup.users.length){
        throw new Error('el archivo no tiene el formato esperado');
      }
      for (const u of backup.users){
        const d = (backup.data && backup.data[u.id]) || { plans:[], checks:{}, notes:{} };
        await saveUserDataAsync(u.id, { plans: d.plans||[], checks: d.checks||{}, notes: d.notes||{} });
      }
      users = backup.users;
      await saveUsersAsync(users);
      const restoredActive = (backup.activeUserId && users.find(u=>u.id===backup.activeUserId))
        ? backup.activeUserId : users[0].id;
      activeUserId = restoredActive;
      await saveActiveUserIdAsync(activeUserId);
      const data = await loadUserDataAsync(activeUserId);
      state.plans = data.plans;
      state.checks = data.checks;
      state.notes = data.notes;
      state.seriesProgress = data.seriesProgress || {};
      const sorted = [...state.plans].sort((a,b)=>a.uploadedAt-b.uploadedAt);
      state.activePlanId = sorted.length ? sorted[sorted.length-1].id : null;
      state.activeDay = null;
      state.reviewDismissed = sorted.length ? !sorted[sorted.length-1].needsReview : false;
      state.backupMessage = { text:'Copia restaurada correctamente.', tone:'ok' };
      render();
    }catch(err){
      state.backupMessage = { text:'No he podido leer ese archivo de copia de seguridad (' + (err && err.message ? err.message : 'error desconocido') + ').', tone:'warn' };
      render();
    }
  };
  reader.readAsText(file);
}

    sheet.appendChild(okBox);

    const copyBtn = el('button','tb-btn','📋 Copiar código');

          const ta = document.createElement('textarea');

      copyBtn.textContent = copied ? '✓ Copiado' : 'No se pudo copiar';
      setTimeout(()=>{ copyBtn.textContent = '📋 Copiar código'; }, 2000);

    stopBtn.onclick = ()=>{ stopSync(); };

    const hint = el('div','ex-hint');

    if (syncStatus==='connecting'){
      const l = el('div','ex-hint','Conectando…'); l.style.marginTop='8px';
      sheet.appendChild(l);
    } else if (syncStatus==='error'){
      const err = el('div', null, 'No se ha podido conectar. Comprueba tu conexión e inténtalo de nuevo.');
      err.style.cssText = 'color:var(--red);font-size:12.5px;margin-top:8px;line-height:1.4;';
      sheet.appendChild(err);
    }

    const startBtn = el('button','mark-btn ok selected','Activar sincronización');
    startBtn.style.cssText += 'width:100%;margin-top:12px;';
    startBtn.onclick = ()=>{
      const code = (state.syncCodeDraft||'').trim();

  const closeBtn = el('button','sheet-close','Cerrar');

/* ---- Nota del día (calor, sueño, alimentación…) ---- */
function renderDayNoteOverlay(plan){
  const overlay = el('div','overlay');
  const close = ()=>{ state.showDayNote=false; state.dayNoteDrafts=null; render(); };
  overlay.onclick = (e)=>{ if (e.target===overlay) close(); };
  const sheet = el('div','sheet');
  sheet.appendChild(el('h3','Notas de ' + DAY_NAMES[state.activeDay]));
  const hint = el('div','ex-hint');
  hint.style.cssText = 'margin-bottom:14px;';
  hint.textContent = 'Cada ejercicio guarda su propia nota (la que rellenas al pulsar "Finalizar"). Aquí las ves todas juntas y puedes editarlas o añadir una nota general del día.';
  sheet.appendChild(hint);

  const day = state.activeDay;
  const generalKey = noteKey(plan, day);
  const entries = (plan.days[day] || []).filter(e=>e.type==='exercise');

  if (!state.dayNoteDrafts){
    const drafts = { general: normalizeNote(state.notes[generalKey]) };
    entries.forEach((e, exIdx)=>{
      const k = noteKey(plan, day, exIdx);
      if (state.notes[k]) drafts['ex_'+exIdx] = normalizeNote(state.notes[k]);
    });
    state.dayNoteDrafts = drafts;
  }
  const drafts = state.dayNoteDrafts;

  function noteBlock(title, draftKey, storageKey, deletable){
    const card = el('div','ex-card');
    card.style.cssText += 'margin-bottom:12px;cursor:default;';
    const top = el('div');
    top.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;';
    top.appendChild(el('div','ex-name', title));
    if (deletable){
      const delBtn = el('button', null, '🗑');
      delBtn.style.cssText = 'background:none;border:1px solid var(--surface-3);color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;flex-shrink:0;';
      delBtn.onclick = ()=>{
        delete state.notes[storageKey];
        delete drafts[draftKey];
        persistUserData();
        render();
      };
      top.appendChild(delBtn);
    }
    card.appendChild(top);
    const d = drafts[draftKey];
    card.appendChild(feelingSelector(d.feeling, v=>{ d.feeling = v; render(); }));
    card.appendChild(rpeInput(d.rpe, v=>{ d.rpe = v; }));
    const ta = document.createElement('textarea');
    ta.value = d.text || '';
    ta.rows = 3;
    ta.placeholder = 'Calor, sueño, alimentación…';
    ta.className = 'fc-memo-textarea';
    ta.addEventListener('input', e=>{ d.text = e.target.value; });
    card.appendChild(ta);
    return card;
  }

  sheet.appendChild(noteBlock('📝 Nota general del día', 'general', generalKey, false));

  let anyExerciseNote = false;
  entries.forEach((e, exIdx)=>{
    const draftKey = 'ex_' + exIdx;
    if (drafts[draftKey]){
      anyExerciseNote = true;
      sheet.appendChild(noteBlock(e.name || ('Código ' + e.code), draftKey, noteKey(plan, day, exIdx), true));
    }
  });
  if (!anyExerciseNote){
    const empty = el('div','ex-hint','Todavía no hay ninguna nota de ejercicio este día — se añaden al pulsar "Finalizar" tras completarlo.');
    empty.style.marginBottom = '12px';
    sheet.appendChild(empty);
  }

  const saveBtn = el('button','mark-btn ok selected','Guardar todo');
  saveBtn.style.cssText += 'width:100%;';
  saveBtn.onclick = ()=>{
    let savedAnything = false;
    Object.keys(drafts).forEach(k=>{
      const d = drafts[k];
      const sKey = k==='general' ? generalKey : noteKey(plan, day, parseInt(k.slice(3),10));
      if (d.text || d.rpe!==null || d.feeling!==null){
        state.notes[sKey] = { text: d.text||'', rpe: d.rpe, feeling: d.feeling };
        savedAnything = true;
      } else delete state.notes[sKey];
    });
    if (savedAnything) recordDayDate(plan, day);
    persistUserData();
    close();
  };
  sheet.appendChild(saveBtn);

  const closeBtn = el('button','sheet-close','Cerrar');
  closeBtn.onclick = close;
  sheet.appendChild(closeBtn);
  overlay.appendChild(sheet);
  return overlay;
}

/* ============== INFORMES (día y semana) ==============
   Usan la API de Claude para sintetizar, en un par de frases, cómo las notas
   libres del atleta (calor, sueño, alimentación...) pueden haberse
   relacionado con el entreno. No se guardan: se generan al vuelo cada vez. */
/* ============== VÍDEOS DE EJERCICIO (análisis de técnica) ==============
   Los vídeos viven solo en memoria del navegador (URL.createObjectURL), no
   se guardan en localStorage ni entran en la copia de seguridad: un vídeo
   pesa demasiado para ese almacenamiento. Al analizar, se extraen unos
   fotogramas del vídeo y se envían a la API de Claude para un feedback de
   técnica; el vídeo en sí nunca sale del navegador salvo esos fotogramas. */

function extractVideoFrames(videoUrl, count){
  return new Promise((resolve, reject)=>{
    const video = document.createElement('video');
    video.src = videoUrl;
    video.muted = true;
    video.playsInline = true;
    video.preload = 'auto';

    const timeout = setTimeout(()=>{
      reject(new Error('tiempo de espera agotado leyendo el vídeo'));
    }, 15000);
    const finish = (fn, arg)=>{ clearTimeout(timeout); fn(arg); };

    video.addEventListener('error', ()=> finish(reject, new Error('no se pudo leer el archivo de vídeo')));

    function startCapture(duration){
      if (!isFinite(duration) || duration <= 0){
        finish(reject, new Error('no se pudo determinar la duración del vídeo'));
        return;
      }
      const times = [];
      for (let i=1; i<=count; i++) times.push(Math.max(0, Math.min(duration-0.05, duration*i/(count+1))));
      const canvas = document.createElement('canvas');
      const frames = [];
      let idx = 0;
      function captureNext(){
        if (idx >= times.length){
          if (!frames.length){ finish(reject, new Error('no se pudo generar ningún fotograma del vídeo')); return; }
          finish(resolve, frames);
          return;
        }
        video.currentTime = times[idx];
      }
      video.addEventListener('seeked', function onSeeked(){
        try{
          const w = video.videoWidth, h = video.videoHeight;
          if (w && h){
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            frames.push(dataUrl.split(',')[1]);
          }
        }catch(e){ /* fotograma no legible: se salta y se sigue con el siguiente */ }
        idx++;
        captureNext();
      });
      captureNext();
    }

    video.addEventListener('loadedmetadata', ()=>{
      const d = video.duration;
      if (!isFinite(d) || d <= 0){
        // Algunos vídeos grabados en móvil (sobre todo iPhone) no traen la
        // duración en los metadatos cuando se cargan desde un blob: hay que
        // forzar un seek al final para que el navegador la recalcule.
        video.addEventListener('durationchange', function onDur(){
          if (isFinite(video.duration) && video.duration > 0){
            video.removeEventListener('durationchange', onDur);
            video.currentTime = 0;
            startCapture(video.duration);
          }
        });
        video.currentTime = 1e7;
      } else {
        startCapture(d);
      }
    });
  });
}

async function analyzeVideo(day, exIdx, videoId){
  const key = day + '|' + exIdx;
  const videos = state.exerciseVideos[key] || [];
  const v = videos.find(x=>x.id===videoId);
  if (!v) return;
  v.analysis = { loading:true, text:null, error:null };
  render();
  try{
    const frames = await extractVideoFrames(v.url, 3);
    if (!frames.length) throw new Error('no se pudieron extraer fotogramas');
    const content = [{
      type:'text',
      text: 'Eres un entrenador de halterofilia analizando la técnica de un levantamiento a partir de estos fotogramas ' +
        'extraídos de un vídeo, en orden temporal. Da un feedback técnico breve (máximo 6 frases, en español, en prosa, ' +
        'sin listas ni markdown) sobre postura, trayectoria de la barra, profundidad y cualquier punto de mejora que ' +
        'puedas apreciar. Si los fotogramas no dejan ver bien el levantamiento, dilo con honestidad.'
    }];
    frames.forEach(f=>{
      content.push({ type:'image', source:{ type:'base64', media_type:'image/jpeg', data:f } });
    });
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:600, messages:[{ role:'user', content }] })
    });
    if (!response.ok){
      let detail = '';
      try{ const errBody = await response.json(); detail = errBody && errBody.error && errBody.error.message ? errBody.error.message : ''; }catch(e){}
      throw new Error('respuesta ' + response.status + (detail ? (' — ' + detail) : ''));
    }
    const data = await response.json();
    const text = (data.content || []).map(b=>b.text || '').join('\n').trim();
    v.analysis = { loading:false, text: text || 'No he podido analizar el vídeo.', error:null };
  }catch(err){
    const detail = err && err.message ? err.message : 'error desconocido';
    let msg = 'No se ha podido analizar el vídeo (' + detail + ').';
    if (detail.indexOf('leer el archivo de vídeo') !== -1 || detail.indexOf('duración') !== -1){
      msg += ' Es probable que sea un .MOV grabado en HEVC de alta eficiencia (típico de iPhone), que este visor no puede decodificar. Prueba a grabar con Ajustes → Cámara → Formatos → "Más compatible", o convierte el vídeo a .mp4 (H.264) antes de subirlo.';
    } else {
      msg += ' Inténtalo de nuevo.';
    }
    v.analysis = { loading:false, text:null, error: msg };
  }
  render();
}

/* ============== INFORMES (día y semana) ==============
   Pensados como el parte que un entrenador necesitaría de un atleta que no
   entrena con él: datos concretos (qué se hizo, cuánto, cómo fue marcado,
   RPE, sensación), calculados al momento, más una frase-resumen generada
   localmente (sin depender de ningún servidor de IA, para que funcione
   igual de bien alojado fuera del entorno de Claude). */

const FEELING_ORDER = ['mal','regular','bien','muybien'];
function worstFeeling(list){
  const present = list.filter(Boolean);
  if (!present.length) return null;
  return present.reduce((worst,f)=> FEELING_ORDER.indexOf(f) < FEELING_ORDER.indexOf(worst) ? f : worst, present[0]);
}

// Combina la nota general del día con la de cada ejercicio en un único
// bloque: RPE medio, la sensación más baja de todas (para no esconder
// problemas) y el texto de cada una, indicando de qué ejercicio viene.
function dayCombinedNote(plan, day){
  const entries = (plan.days[day] || []).filter(e=>e.type==='exercise');
  const parts = [];
  const rpes = [], feelings = [];
  const general = normalizeNote(state.notes[noteKey(plan, day)]);
  if (general.text) parts.push(general.text);
  if (general.rpe!==null) rpes.push(general.rpe);
  if (general.feeling) feelings.push(general.feeling);
  entries.forEach((e, exIdx)=>{
    const n = normalizeNote(state.notes[noteKey(plan, day, exIdx)]);
    if (n.text) parts.push('[' + (e.name || ('Código '+e.code)) + '] ' + n.text);
    if (n.rpe!==null) rpes.push(n.rpe);
    if (n.feeling) feelings.push(n.feeling);
  });
  return {
    text: parts.join('\n'),
    rpe: rpes.length ? Math.round(rpes.reduce((a,b)=>a+b,0)/rpes.length) : null,
    feeling: worstFeeling(feelings)
  };
}

// Estado del día de un vistazo, como lo vería un entrenador al abrir el
// parte: si hay algo que vigilar, o si la sesión fue sólida.
function dayStatus(data){
  if (data.totalSets === 0) return { icon:'—', label:'Sin datos' };
  const hasBad = data.watchList.length > 0;
  const alarmingReadiness = (data.rpe!==null && data.rpe>=9) || data.feeling==='mal';
  const lowCompletion = data.completion!==null && data.completion<80;
  if (hasBad || alarmingReadiness || lowCompletion) return { icon:'⚠️', label:'A vigilar' };
  if (data.completion===100 && (data.avgRating===null || data.avgRating>=3.5)) return { icon:'✓', label:'Sesión sólida' };
  return { icon:'•', label:'Normal' };
}

// Series concretas que salieron mal (valoración 1-2), con su ejercicio,
// para que el entrenador vaya directo a lo importante sin leer todo el
// detalle línea a línea.
function dayWatchList(plan, day, entries){
  const list = [];
  entries.forEach((e, exIdx)=>{
    e.sets.forEach((s, si)=>{
      const r = normalizeCheck(state.checks[checkKey(plan, day, exIdx, si)]);
      if (r!==null && r<=2){
        const info = ratingInfo(r);
        list.push({ name: e.name || ('Código '+e.code), text: setDisplayText(s), icon: info?info.icon:'' });
      }
    });
  });
  return list;
}

// Marcas importantes: para cada ejercicio del día, si el peso más alto de
// hoy supera (o iguala, si no había ninguno antes) el peso más alto
// registrado en cualquier otro entreno anterior con ese mismo código.
function dayRecordsForExercises(plan, day, entries){
  const records = [];
  entries.forEach(e=>{
    const numericKgs = e.sets.filter(s=>s.kg!==null && s.kg!==undefined).map(s=>s.kg);
    if (!numericKgs.length) return;
    const todayMax = Math.max(...numericKgs);
    let priorMax = null;
    state.plans.forEach(p=>{
      DAY_ORDER.forEach(d=>{
        if (p.id===plan.id && d===day) return; // se excluye el propio día del informe
        const dEntries = p.days[d]; if (!dEntries) return;
        dEntries.forEach(ex=>{
          if (ex.type!=='exercise' || ex.code!==e.code) return;
          ex.sets.forEach(s=>{
            if (s.kg!==null && s.kg!==undefined && (priorMax===null || s.kg>priorMax)) priorMax = s.kg;
          });
        });
      });
    });
    if (priorMax===null || todayMax > priorMax){
      records.push({ name: e.name || ('Código '+e.code), kg: todayMax, priorMax });
    }
  });
  return records;
}

function daysToCompetition(u){
  const dateStr = u.objetivos && u.objetivos.competitionDate;
  if (!dateStr) return null;
  const days = Math.ceil((new Date(dateStr+'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
  return { days, dateStr, name: (u.objetivos && u.objetivos.competitionName) || null };
}

function dayReportData(plan, day){
  const noteObj = dayCombinedNote(plan, day);
  const entries = (plan.days[day] || []).filter(e=>e.type==='exercise');
  const exLines = entries.map((e, exIdx)=>{
    const setsStr = e.sets.map((s,si)=>{
      const st = normalizeCheck(state.checks[checkKey(plan, day, exIdx, si)]);
      const info = ratingInfo(st);
      const mark = info ? info.icon : '·';
      return setDisplayText(s)+mark;
    }).join('  ');
    return { name: e.name || ('Código '+e.code), setsStr };
  });
  const watchList = dayWatchList(plan, day, entries);
  const records = dayRecordsForExercises(plan, day, entries);
  const totalSets = entries.reduce((a,e)=>a+e.sets.length,0);
  const allRatings = [];
  entries.forEach((e,exIdx)=>e.sets.forEach((s,si)=>{
    const r = normalizeCheck(state.checks[checkKey(plan,day,exIdx,si)]);
    if (r!==null) allRatings.push(r);
  }));
  const okSets = allRatings.length; // series marcadas (con cualquier valoración), no solo las de nota alta
  const badSets = watchList.length; // a vigilar: valoradas mal o muy mal
  const avgRating = allRatings.length ? allRatings.reduce((a,b)=>a+b,0)/allRatings.length : null;
  const u = getActiveUser();
  const dateMs = plan.dayDates && plan.dayDates[day];
  const dateStr = dateMs ? new Date(dateMs).toLocaleDateString('es-ES', { day:'2-digit', month:'2-digit', year:'numeric' }) : null;
  const data = {
    dayName: DAY_NAMES[day],
    week: plan.meta && plan.meta.week!=null ? plan.meta.week : null,
    athlete: u.name,
    dateStr,
    competition: daysToCompetition(u),
    exLines, watchList, records, totalSets, okSets, badSets, avgRating,
    completion: totalSets ? Math.round(100*okSets/totalSets) : null,
    tonnageKg: Math.round(tonnage(plan.days[day])),
    rpe: noteObj.rpe, feeling: noteObj.feeling, note: noteObj.text
  };
  data.status = dayStatus(data);
  return data;
}

// Resumen de una línea, generado localmente a partir de los datos (sin IA),
// con tono de lectura de entrenador: qué pasó y qué habría que vigilar.
function localDaySummary(data){
  if (data.totalSets === 0 && data.rpe===null && data.feeling===null && !data.note) return null;
  const bits = [];
  if (data.completion !== null){
    bits.push(data.completion===100 ? 'entreno completado al 100%' : ('completó ' + data.completion + '% de las series (' + data.okSets + '/' + data.totalSets + ')'));
  }
  if (data.avgRating !== null){
    const info = ratingInfo(Math.round(data.avgRating));
    bits.push('valoración media ' + (info?info.icon+' ':'') + data.avgRating.toFixed(1) + '/5');
  }
  if (data.rpe !== null) bits.push('RPE ' + data.rpe + '/10');
  if (data.feeling) bits.push('sensación ' + (feelingLabel(data.feeling)||'').replace(/^[^\s]+\s/,'').toLowerCase());
  let summary = bits.length ? (bits[0].charAt(0).toUpperCase()+bits[0].slice(1) + (bits.length>1 ? ', ' + bits.slice(1).join(', ') : '') + '.') : '';
  if (data.watchList.length){
    const uniqueNames = data.watchList.map(w=>w.name).filter((v,i,a)=>a.indexOf(v)===i);
    summary += (summary?' ':'') + 'Antes de la próxima sesión, revisar: ' + uniqueNames.join(', ') + '.';
  }
  if (data.note) summary += (summary?' ':'') + ' Nota del atleta: "' + data.note.split('\n')[0] + (data.note.includes('\n')?'…':'') + '"';
  return summary || null;
}

function weekStatus(perDay){
  const withData = perDay.filter(d=>d.totalSets>0);
  if (!withData.length) return { icon:'—', label:'Sin datos' };
  const watchDays = withData.filter(d=>d.status.label==='A vigilar');
  if (watchDays.length >= Math.ceil(withData.length/2)) return { icon:'⚠️', label:'Semana a vigilar' };
  if (watchDays.length > 0) return { icon:'•', label:'Algún punto a vigilar' };
  return { icon:'✓', label:'Semana sólida' };
}

// Ejercicios que han aparecido "a vigilar" en 2 o más días distintos de la
// semana — esto es un dato objetivo (viene de las valoraciones marcadas),
// no una interpretación de texto.
function weekWatchPatterns(perDay){
  const byName = {};
  perDay.forEach(d=>{
    const namesThisDay = new Set(d.watchList.map(w=>w.name));
    namesThisDay.forEach(name=>{
      if (!byName[name]) byName[name] = [];
      byName[name].push(d.dayName);
    });
  });
  return Object.keys(byName).filter(n=>byName[n].length>=2).map(n=>({ name:n, days:byName[n] }));
}

// Palabras que se repiten en las notas de 2 o más días distintos. Es una
// coincidencia de texto literal, no un análisis de significado — sirve
// como pista de "esto se repite, lee las notas originales", no como
// diagnóstico. (Un análisis real del lenguaje necesitaría IA, que no está
// disponible fuera del entorno de Claude donde corre esta app.)
const WEEK_PATTERN_STOPWORDS = new Set(['entreno','entrenamiento','hoy','dia','días','bien','mal','regular','mucho','muchas','poco','pocas','para','pero','como','esta','este','estoy','algo','todo','nada','semana','series','repes','kilos','general','sensacion','sensación']);
function weekNoteKeywordPatterns(perDay){
  const wordDays = {};
  perDay.forEach(d=>{
    if (!d.note) return;
    const clean = d.note.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const words = clean.match(/[a-z]{5,}/g) || [];
    new Set(words).forEach(w=>{
      if (WEEK_PATTERN_STOPWORDS.has(w)) return;
      if (!wordDays[w]) wordDays[w] = [];
      wordDays[w].push(d.dayName);
    });
  });
  return Object.keys(wordDays).filter(w=>wordDays[w].length>=2)
    .map(w=>({ word:w, days:wordDays[w] }))
    .sort((a,b)=>b.days.length-a.days.length)
    .slice(0,6);
}

function localWeekSummary(perDay){
  const withData = perDay.filter(d=>d.totalSets>0);
  if (!withData.length) return null;
  const totalOk = withData.reduce((a,d)=>a+d.okSets,0);
  const totalSets = withData.reduce((a,d)=>a+d.totalSets,0);
  const totalTon = withData.reduce((a,d)=>a+d.tonnageKg,0);
  const rpes = withData.map(d=>d.rpe).filter(r=>r!==null);
  const avgRpe = rpes.length ? Math.round(rpes.reduce((a,b)=>a+b,0)/rpes.length) : null;
  const worstDays = withData.filter(d=>d.status.label==='A vigilar');
  let summary = withData.length + ' días entrenados, ' + totalOk + '/' + totalSets + ' series completadas (' + Math.round(100*totalOk/totalSets) + '%), ' + totalTon + 'kg de tonelaje total.';
  if (avgRpe !== null) summary += ' RPE medio de la semana: ' + avgRpe + '/10.';
  if (worstDays.length) summary += ' Días a vigilar: ' + worstDays.map(d=>d.dayName).join(', ') + '.';
  else summary += ' Sin días marcados a vigilar esta semana.';
  return summary;
}

/* ---- Copiar / compartir un informe (para mandarlo por email, etc.) ---- */
async function copyReportText(text, btn){
  let copied = false;
  try{
    if (navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); copied = true; }
  }catch(e){}
  if (!copied){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      copied = true;
    }catch(e){}
  }
  if (btn){
    btn.textContent = copied ? '✓ Copiado' : 'No se pudo copiar';
    setTimeout(()=>{ btn.textContent = '📋 Copiar texto'; }, 2000);
  }
}
async function shareReportText(subject, text){
  if (navigator.share){
    try{ await navigator.share({ title: subject, text }); return; }catch(e){ /* cancelado o no soportado */ }
  }
  window.open('mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(text), '_blank');
}

/* ---- PDF del informe diario, maquetado ---- */
// jsPDF (fuente helvetica) no sabe dibujar emoji: sin limpiarlos salen como
// caracteres corruptos. Se quitan de cualquier texto dinámico antes de
// escribirlo en el PDF.
function stripEmojiForPDF(s){
  if (!s) return s;
  return String(s)
    .replace(/[\u{1F1E6}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\uFE0F]/gu, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

    }
    if (d.watchList.length){
      checkPageBreak(6);
      doc.setTextColor(150,50,38);
      doc.text('A vigilar: ' + [...new Set(d.watchList.map(w=>w.name))].join(', '), marginX, y);
      y += 5.5;
    }
    if (d.note){
      checkPageBreak(10);
      doc.setTextColor(60,60,60);
      const noteLines = doc.splitTextToSize('Nota: ' + stripEmojiForPDF(d.note), contentW-4);
      noteLines.forEach(line=>{ checkPageBreak(6); doc.text(line, marginX+2, y); y += 5.5; });
    }
    y += 5;
  });

  if (movementCharts && movementCharts.length){
    checkPageBreak(14);
    sectionTitle('MÁXIMOS ACUMULADOS POR MOVIMIENTO', [40,40,40]);

    function ratingColorPDF(avg){
      if (avg===null) return [136,146,160];
      const r = Math.round(avg);
      return ({1:[193,74,58],2:[217,121,63],3:[201,154,46],4:[90,143,176],5:[47,125,196]})[r] || [136,146,160];
    }
    function drawMovementChart(mc, x, yTop, w, h){
      doc.setDrawColor(225,225,225);
      doc.roundedRect(x, yTop, w, h, 2, 2, 'S');
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(40,40,40);
      doc.text(mc.name, x+5, yTop+8);

      const pts = mc.points;
      const kgs = pts.map(p=>p.maxKg);
      const minKg = Math.min(...kgs), maxKg = Math.max(...kgs);
      const padTop = 16, padBottom = 10, padX = 8;
      const chartW = w - padX*2, chartH = h - padTop - padBottom;
      const range = (maxKg-minKg) || 1;

      const coords = pts.map((p,i)=>({
        x: x + padX + (chartW * (i/(pts.length-1||1))),
        y: yTop + padTop + chartH - ((p.maxKg-minKg)/range)*chartH,
        p
      }));

      doc.setDrawColor(201,154,46);
      doc.setLineWidth(0.6);
      for (let i=0;i<coords.length-1;i++) doc.line(coords[i].x, coords[i].y, coords[i+1].x, coords[i+1].y);
      coords.forEach(c=>{
        const avg = c.p.ratings && c.p.ratings.length ? c.p.ratings.reduce((a,b)=>a+b,0)/c.p.ratings.length : null;
        const col = ratingColorPDF(avg);
        doc.setFillColor(col[0],col[1],col[2]);
        doc.circle(c.x, c.y, 1.6, 'F');
      });

      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(120,120,120);
      pts.forEach((p,i)=>{ doc.text(p.label, coords[i].x, yTop+h-3, {align:'center'}); });

      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(30,30,30);
      doc.text(maxKg+'kg', x+w-5, yTop+8, {align:'right'});
    }

    const chartH = 40, chartGap = 8;
    movementCharts.forEach(mc=>{
      checkPageBreak(chartH+chartGap);
      drawMovementChart(mc, marginX, y, contentW, chartH);
      y += chartH + chartGap;
    });
    y += 2;
  }

  if (memoText){
    checkPageBreak(14);
    sectionTitle('LECTURA DEL ENTRENADOR', [201,154,46]);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(40,40,40);
    const memoLines = doc.splitTextToSize(stripEmojiForPDF(memoText), contentW);
    memoLines.forEach(line=>{ checkPageBreak(6); doc.text(line, marginX, y); y += 5.5; });
  }

  const pageCount = doc.internal.getNumberOfPages();
  for (let i=1;i<=pageCount;i++){
    doc.setPage(i);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(160,160,160);
    doc.text('Generado el ' + new Date().toLocaleDateString('es-ES'), marginX, pageH-10);
  }

  const fileWeek = (plan.meta && plan.meta.week!=null) ? ('semana'+plan.meta.week) : 'programacion';
  doc.save('informe-semanal-' + fileWeek + '.pdf');
}

  closeBtn.onclick = close;
  sheet.appendChild(closeBtn);
  overlay.appendChild(sheet);
  return overlay;
}


/* ===================== WorkOut 2.0: datos del atleta ===================== */
// La programación (plans) la escribe el entrenador y aquí solo se lee.
// Lo que hace el atleta (marcas, notas, series, fechas reales) va a
// progress/main, y su perfil (objetivos, RM, medidas) a progress/profile.
// Si el atleta cambia, borra o añade pesos, su versión de esa semana se
// guarda aparte en progress/plan_<id>; la del entrenador no se toca.
const WO2 = { uid:null, clubId:null, base:null, progressTimer:null, profileTimer:null, isCoach:false,
              coachView:false, viewedUid:null, coachComments:{},
              coachDays:{}, pushedOverride:{} };
function wo2OverrideDocId(planId){ return 'plan_' + String(planId).replace(/[^A-Za-z0-9_-]/g,'_').slice(0,140); }
// Solo se guardan los ejercicios que el atleta ha cambiado ("L|0": ejercicio);
// el resto sigue saliendo de la programación del entrenador, así que si el
// entrenador corrige otro ejercicio, el atleta ve la corrección.
function wo2DiffChanges(coachDays, athleteDays){
  const changes = {};
  Object.keys(athleteDays || {}).forEach(day=>{
    (athleteDays[day] || []).forEach((entry, idx)=>{
      const coachEntry = (coachDays[day] || [])[idx];
      if (JSON.stringify(entry) !== JSON.stringify(coachEntry)) changes[day + '|' + idx] = entry;
    });
  });
  return changes;
}
function wo2ApplyChanges(days, changes){
  Object.keys(changes || {}).forEach(k=>{
    const sep = k.indexOf('|');
    const day = k.slice(0, sep), idx = parseInt(k.slice(sep+1), 10);
    if (days[day] && idx < days[day].length) days[day][idx] = changes[k];
  });
  return days;
}

function wo2SignOut(){
  try{ dismissRestTimer(); }catch(e){}
  auth.signOut().then(()=> window.location.replace('atleta.html'));
}

function wo2ScheduleProgressPush(){
  if (!WO2.base) return;
  clearTimeout(WO2.progressTimer);
  WO2.progressTimer = setTimeout(wo2PushProgressNow, 700);
}
async function wo2PushProgressNow(){
  if (WO2.coachView) return; // vista del entrenador: solo lectura
  const dayDates = {};
  state.plans.forEach(p=>{ if (p.dayDates) dayDates[p.id] = p.dayDates; });
  try{
    await WO2.base.collection('progress').doc('main').set({
      checks: state.checks || {},
      notes: state.notes || {},
      seriesProgress: state.seriesProgress || {},
      dayDates,
      updatedAt: Date.now()
    });
    for (const p of state.plans){
      if (WO2.coachDays[p.id] === undefined) continue;
      const changes = wo2DiffChanges(JSON.parse(WO2.coachDays[p.id]), p.days || {});
      const cur = Object.keys(changes).length ? JSON.stringify(changes) : null;
      const pushed = WO2.pushedOverride[p.id] || null;
      if (cur === pushed) continue;
      const ref = WO2.base.collection('progress').doc(wo2OverrideDocId(p.id));
      if (cur){ await ref.set({ planId: p.id, changes, updatedAt: Date.now() }); }
      else { await ref.delete(); }
      WO2.pushedOverride[p.id] = cur;
    }
  }catch(e){ wo2SaveError(e); }
}
function wo2ScheduleProfilePush(){
  if (!WO2.base || WO2.coachView) return;
  clearTimeout(WO2.profileTimer);
  WO2.profileTimer = setTimeout(async ()=>{
    const u = getActiveUser();
    if (!u) return;
    try{
      await WO2.base.collection('progress').doc('profile').set({
        objetivos: u.objetivos || null, rms: u.rms || {}, metrics: u.metrics || [], updatedAt: Date.now()
      });
    }catch(e){ wo2SaveError(e); }
  }, 700);
}
// --- Comentarios del entrenador en los informes ---
function wo2MemoWithComments(memo, key){
  const c = (WO2.coachComments[key] || '').trim();
  if (!c) return memo;
  return (memo ? memo + '\n\n' : '') + 'COMENTARIOS DEL ENTRENADOR:\n' + c;
}
function wo2CoachCommentBlock(key){
  const wrap = el('div');
  wrap.style.cssText = 'margin-top:18px;padding:16px;border-radius:12px;background:#fdf6e3;border:2px solid var(--yellow-deep);';
  const title = el('div', null, '💬 COMENTARIOS DEL ENTRENADOR');
  title.style.cssText = 'font-family:Oswald,sans-serif;font-weight:700;font-size:16px;color:var(--chalk);letter-spacing:.03em;margin-bottom:10px;';
  wrap.appendChild(title);
  const current = WO2.coachComments[key] || '';
  if (WO2.coachView){
    const ta = document.createElement('textarea');
    ta.value = current;
    ta.placeholder = 'Escribe aquí tus comentarios para el atleta…';
    ta.style.cssText = 'width:100%;min-height:120px;box-sizing:border-box;border:1.5px solid var(--surface-3);border-radius:10px;padding:12px;font-family:Inter,sans-serif;font-size:17px;line-height:1.5;color:var(--chalk);background:#fff;';
    wrap.appendChild(ta);
    const btn = el('button','mark-btn ok selected','Guardar comentario');
    btn.style.cssText += 'width:100%;margin-top:10px;font-size:17px;';
    const msg = el('div');
    msg.style.cssText = 'font-size:15px;margin-top:8px;text-align:center;';
    btn.onclick = async ()=>{
      const text = ta.value.trim();
      btn.disabled = true;
      try{
        await WO2.base.collection('coachNotes').doc('comments').set({ comments: { [key]: text }, updatedAt: Date.now() }, { merge: true });
        WO2.coachComments[key] = text;
        msg.textContent = 'Comentario guardado. El atleta lo verá en su informe.';
        msg.style.color = 'var(--ok)';
      }catch(e){
        msg.textContent = 'No se ha podido guardar (' + (e.message || e.code) + ').';
        msg.style.color = 'var(--red)';
      }
      btn.disabled = false;
    };
    wrap.appendChild(btn); wrap.appendChild(msg);
  } else {
    const txt = el('div', null, current || 'Tu entrenador todavía no ha escrito comentarios en este informe.');
    txt.style.cssText = 'font-size:17px;line-height:1.6;white-space:pre-wrap;color:' + (current ? 'var(--chalk)' : 'var(--muted)') + ';';
    wrap.appendChild(txt);
  }
  return wrap;
}
function wo2CoachNoteBanner(parent, key, label){
  const text = (WO2.coachComments[key] || '').trim();
  if (!text) return;
  const b = el('div');
  b.style.cssText = 'margin:10px 0 12px;padding:12px 14px;border-radius:12px;background:#fdf6e3;border-left:5px solid var(--yellow-deep);font-family:Inter,sans-serif;';
  b.onclick = (e)=> e.stopPropagation();
  const l = el('div', null, '💬 ' + label);
  l.style.cssText = 'font-size:13.5px;font-weight:700;color:#8a6512;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;';
  const t = el('div'); t.textContent = text;
  t.style.cssText = 'font-size:17px;line-height:1.5;color:var(--chalk);white-space:pre-wrap;';
  b.appendChild(l); b.appendChild(t);
  parent.appendChild(b);
}
function wo2Toast(text){
  let t = document.getElementById('wo2Toast');
  if (!t){
    t = document.createElement('div');
    t.id = 'wo2Toast';
    t.style.cssText = 'position:fixed;left:12px;right:12px;bottom:14px;z-index:900;background:#20242e;color:#fff;padding:14px 16px;border-radius:12px;font-family:Inter,sans-serif;font-size:16px;font-weight:600;text-align:center;';
    document.body.appendChild(t);
  }
  t.textContent = text;
  clearTimeout(t._h); t._h = setTimeout(()=>{ if (t.parentNode) t.parentNode.removeChild(t); }, 3500);
}
function wo2CoachBanner(name){
  const b = document.createElement('div');
  b.style.cssText = 'background:#fdf6e3;border-bottom:2px solid var(--yellow-deep);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:Inter,sans-serif;font-size:15.5px;color:var(--chalk);';
  b.innerHTML = '<span>👁 <b>Vista del entrenador</b> · entreno de <b></b> · solo lectura</span>';
  b.querySelectorAll('b')[1].textContent = name;
  const back = document.createElement('a');
  back.textContent = '← Volver a la ficha';
  back.href = 'ficha-atleta.html?athlete=' + encodeURIComponent(WO2.viewedUid);
  back.style.cssText = 'font-weight:700;color:var(--chalk);';
  b.appendChild(back);
  return b;
}

function wo2SaveError(e){
  console.error('WorkOut 2.0: no se pudo guardar', e);
  let bar = document.getElementById('wo2SaveError');
  if (!bar){
    bar = document.createElement('div');
    bar.id = 'wo2SaveError';
    bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:900;background:#c14a3a;color:#fff;padding:14px 16px;border-radius:12px;font-family:Inter,sans-serif;font-size:15px;font-weight:600;text-align:center;';
    document.body.appendChild(bar);
  }
  bar.textContent = 'No se ha podido guardar el último cambio. Revisa la conexión; si sigue pasando, avisa a tu entrenador.';
  setTimeout(()=>{ if (bar.parentNode) bar.parentNode.removeChild(bar); }, 7000);
}
