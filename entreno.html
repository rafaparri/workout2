<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#f5f5f2;
  --surface:#ffffff;
  --surface-2:#eef0f4;
  --surface-3:#c9d3de;
  --chalk:#20242e;
  --muted:#57616e;
  --muted-2:#7d8794;
  --red:#c14a3a;
  --blue:#3f6f9f;
  --yellow:#f4dd8a;
  --yellow-deep:#c99a2e;
  --ok:#2f7dc4;
  --purple:#7d6bb0;
  --rest:#ab9c86;
  --border:#dfe3e8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--chalk);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:640px;margin:0 auto;padding:0 0 60px;}

/* ---------- Upload screen ---------- */
.upload-screen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:32px 20px;
  text-align:center;
}
.upload-mark{
  width:72px;height:72px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #eef1f6, var(--surface) 70%);
  border:3px solid var(--surface-3);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:22px;
  position:relative;
}
.upload-mark::before{
  content:"";
  width:26px;height:26px;
  border:3px solid var(--yellow);
  border-radius:50%;
  border-right-color:transparent;
  border-bottom-color:transparent;
  transform:rotate(45deg);
}
h1.brand{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:28px;
  letter-spacing:0.02em;
  text-transform:uppercase;
  margin:0 0 6px;
}
p.tagline{
  color:var(--muted);
  font-size:14px;
  margin:0 0 34px;
  max-width:320px;
  line-height:1.5;
}
.dropzone{
  width:100%;
  max-width:340px;
  border:2px dashed var(--surface-3);
  border-radius:16px;
  padding:30px 20px;
  cursor:pointer;
  transition:border-color .15s ease, background .15s ease;
  background:var(--surface);
}
.dropzone:hover, .dropzone.drag{
  border-color:var(--yellow);
  background:var(--surface-2);
}
.dropzone .dz-title{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:16px;
  text-transform:uppercase;
  letter-spacing:.03em;
  margin-bottom:6px;
}
.dropzone .dz-sub{color:var(--muted-2);font-size:12.5px;}
input[type=file]{display:none;}
.upload-error{
  margin-top:18px;
  color:var(--red);
  font-size:13px;
  max-width:340px;
  line-height:1.5;
}
.history-pick{
  margin-top:28px;
  font-size:13px;
  color:var(--muted);
}
.history-pick button{
  background:none;border:none;color:var(--yellow-deep);
  font-size:13px;font-family:'Inter',sans-serif;font-weight:600;
  cursor:pointer;text-decoration:underline;padding:0;
}

/* ---------- Header ---------- */
.topbar{
  padding:22px 20px 16px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;
  background:rgba(246,249,239,0.94);
  backdrop-filter:blur(6px);
  z-index:20;
}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.athlete-name{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:22px;
  text-transform:uppercase;
  letter-spacing:.01em;
  line-height:1.1;
}
.meta-line{
  color:var(--muted);
  font-size:12.5px;
  margin-top:4px;
  font-family:'IBM Plex Mono',monospace;
}
.week-chip{
  background:var(--yellow);
  color:#26330f;
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:12.5px;
  padding:5px 10px;
  border-radius:20px;
  white-space:nowrap;
  text-transform:uppercase;
}
.topbar-actions{
  display:flex;gap:10px;margin-top:12px;
}
.tb-btn{
  background:none;border:1px solid var(--surface-3);color:var(--muted);
  font-size:11.5px;font-family:'Inter',sans-serif;font-weight:600;
  padding:6px 11px;border-radius:8px;cursor:pointer;
  text-transform:uppercase;letter-spacing:.03em;
}
.tb-btn:hover{border-color:var(--muted);color:var(--chalk);}

/* ---------- Day plate selector ---------- */
.plate-row{
  display:flex;
  gap:14px;
  padding:20px 20px 6px;
  overflow-x:auto;
  scrollbar-width:none;
}
.plate-row::-webkit-scrollbar{display:none;}
.plate-wrap{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  flex-shrink:0;cursor:pointer;
  background:none;border:none;color:inherit;
  font-family:inherit;
}
.plate{
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;
  font-weight:700;
  position:relative;
  transition:transform .1s ease;
}
.plate-wrap:active .plate{transform:translateY(3px) scale(0.95);}
.plate-wrap.active .plate{
  outline:3px solid var(--chalk);
  outline-offset:2px;
}
.plate-empty{
  background:var(--surface-2) !important;
  border:2px dashed var(--surface-3);
  color:var(--muted-2) !important;
  box-shadow:none !important;
}
.plate-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.plate-wrap.active .plate-label{color:var(--chalk);font-weight:700;}
.plate-progress{
  position:absolute;inset:-4px;
  border-radius:50%;
}

/* ---------- Day content ---------- */
.day-section{padding:8px 20px 0;}
.day-heading{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:20px 0 14px;
}
.day-heading h2{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:19px;
  text-transform:uppercase;
  margin:0;
  letter-spacing:.01em;
}
.day-count{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;color:var(--muted-2);
}

.note-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-left:4px solid var(--rest);
  border-radius:12px;
  padding:18px 16px;
  margin-bottom:12px;
  font-family:'Oswald',sans-serif;
  text-transform:uppercase;
  letter-spacing:.03em;
  font-size:14px;
  color:var(--muted);
  text-align:center;
}
.note-card.competition{
  border-left-color:var(--red);
  color:var(--chalk);
  background:linear-gradient(135deg, rgba(193,74,58,0.12), var(--surface));
  font-weight:600;
}

.empty-day{
  color:var(--muted-2);
  font-size:13px;
  text-align:center;
  padding:30px 0 10px;
  font-style:italic;
}

.ex-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 14px 12px;
  margin-bottom:12px;
}
.ex-top{
  display:flex;align-items:flex-start;gap:10px;
}
.ex-code{
  flex-shrink:0;
  width:34px;height:34px;border-radius:50%;
  background:var(--surface-2);
  border:1.5px solid var(--surface-3);
  display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;font-size:12.5px;color:var(--muted);
}
.ex-info{flex:1;min-width:0;}
.ex-name{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:15.5px;
  text-transform:uppercase;
  letter-spacing:.01em;
  line-height:1.25;
}
.ex-name.unknown{color:var(--yellow-deep);}
.ex-sub{font-size:11px;color:var(--muted-2);margin-top:2px;text-transform:uppercase;letter-spacing:.03em;}

.set-chips{
  display:flex;flex-wrap:wrap;gap:7px;
  margin:12px 0 12px 44px;
}
.chip{
  background:var(--surface-2);
  border:1px solid var(--surface-3);
  border-radius:8px;
  padding:6px 9px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  color:var(--chalk);
  white-space:nowrap;
  cursor:pointer;
  transition:background .12s ease, border-color .12s ease, color .12s ease;
}
.chip b{color:var(--yellow-deep);font-weight:600;}

.ex-hint{
  margin:2px 0 0 44px;
  font-size:10.5px;
  color:var(--muted-2);
  text-transform:uppercase;
  letter-spacing:.03em;
}
.ex-card{cursor:pointer;}

.ex-actions{
  display:flex;gap:8px;margin-left:44px;
}
.mark-btn{
  flex:1;
  border-radius:9px;
  border:1.5px solid var(--surface-3);
  background:var(--surface-2);
  color:var(--muted);
  padding:9px 0;
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:13px;
  cursor:pointer;
  letter-spacing:.02em;
  transition:all .12s ease;
}
.mark-btn.ok.selected{background:var(--ok);border-color:var(--ok);color:#0e1a0e;}
.mark-btn.bad.selected{background:var(--red);border-color:var(--red);color:#2a0e07;}

/* ---------- Flashcard overlay ---------- */
.fc-overlay{ padding:0; }
.fc-wrap{
  width:100%;max-width:440px;
  display:flex;flex-direction:column;
  height:min(680px, 94vh);
  background:var(--surface);
  border-radius:20px;
  overflow:hidden;
  border:1px solid var(--surface-3);
}
.fc-top{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:18px 18px 10px;
  border-bottom:1px solid var(--border);
}
.fc-name{
  font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;
  text-transform:uppercase;letter-spacing:.01em;
}
.fc-progress{
  font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--muted-2);margin-top:3px;
}
.fc-close{
  background:none;border:1px solid var(--surface-3);color:var(--muted);
  width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;flex-shrink:0;
}
.fc-card-area{
  flex:1;display:flex;align-items:center;justify-content:center;padding:20px;
  touch-action:pan-y;
  position:relative;
  overflow:hidden;
  perspective:900px;
}
@keyframes fcPopIn{
  from{ opacity:0; transform:scale(.93); }
  to{ opacity:1; transform:scale(1); }
}
@keyframes fcSlideInNext{
  0%{ opacity:0; transform:translateX(120px) translateY(20px) rotate(13deg) scale(.9); }
  55%{ opacity:1; transform:translateX(-9px) translateY(-5px) rotate(-2deg) scale(1.02); }
  80%{ transform:translateX(3px) translateY(1px) rotate(.6deg) scale(.995); }
  100%{ opacity:1; transform:translateX(0) translateY(0) rotate(0deg) scale(1); }
}
@keyframes fcSlideInPrev{
  0%{ opacity:0; transform:translateX(-120px) translateY(20px) rotate(-13deg) scale(.9); }
  55%{ opacity:1; transform:translateX(9px) translateY(-5px) rotate(2deg) scale(1.02); }
  80%{ transform:translateX(-3px) translateY(1px) rotate(-.6deg) scale(.995); }
  100%{ opacity:1; transform:translateX(0) translateY(0) rotate(0deg) scale(1); }
}
.fc-card{
  width:100%;
  max-height:100%;
  overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;gap:22px;
  padding:30px 20px;
  animation:fcPopIn .3s cubic-bezier(.22,.85,.32,1) both;
  will-change:transform,opacity;
  position:relative;
}

.fc-card.dir-next{ animation:fcSlideInNext .4s cubic-bezier(.25,.8,.3,1) both; }
.fc-card.dir-prev{ animation:fcSlideInPrev .4s cubic-bezier(.25,.8,.3,1) both; }
.fc-mark:active, .mark-btn:active{ transform:scale(.96); }
.fc-nav-btn:active{ transform:scale(.88); }
.fc-memo-textarea{
  width:100%; margin-top:14px;
  background:var(--surface-2); border:1.5px solid var(--surface-3); border-radius:12px;
  color:var(--chalk); font-family:'Inter',sans-serif; font-size:16px; line-height:1.45;
  padding:14px; resize:vertical;
}
.fc-kg{
  font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(64px,17vw,88px);color:var(--yellow-deep);
  line-height:1;
}
.fc-setrep{
  font-family:'IBM Plex Mono',monospace;font-size:clamp(30px,8.5vw,42px);color:var(--chalk);
  font-weight:700;
  text-transform:uppercase;letter-spacing:.02em;
}
.fc-mark-row{ display:flex; gap:7px; width:100%; margin-top:12px; }
.fc-mark{
  flex:1;padding:16px 0;border-radius:12px;
  border:2px solid var(--surface-3);background:var(--surface-2);
  font-size:29px;line-height:1;
  cursor:pointer;transition:all .12s ease;
}
.fc-mark.selected{ transform:scale(1.06); }

.fc-final{ text-align:center; }
.fc-final-title{
  font-family:'Oswald',sans-serif;font-weight:700;font-size:34px;text-transform:uppercase;
}
.fc-final-sub{ color:var(--muted); font-size:24px; margin-top:10px; font-weight:600; line-height:1.35; }
.fc-final-actions{ display:flex; gap:12px; width:100%; margin-top:24px; }
.fc-final-actions .mark-btn{
  font-size:22px; padding:22px 0; border-radius:14px; border-width:2px;
}

.fc-newweight-form{ display:flex; gap:12px; margin-top:20px; justify-content:center; }
.fc-field{ display:flex; flex-direction:column; align-items:center; gap:8px; }
.fc-field-label{ font-size:16px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.03em; font-weight:700; }
.fc-field-input{
  background:var(--surface-2);border:2px solid var(--surface-3);border-radius:12px;
  color:var(--chalk);font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:700;
  padding:16px 8px;text-align:center;
}

.fc-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 20px;border-top:1px solid var(--border);
}
.fc-nav-btn{
  background:var(--surface-2);border:1px solid var(--surface-3);color:var(--chalk);
  width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;
}
.fc-nav-btn:disabled{ opacity:.3; }
.fc-dots{ display:flex; gap:6px; }
.fc-dot{ width:6px;height:6px;border-radius:50%;background:var(--surface-3); }
.fc-dot.active{ background:var(--yellow); width:16px;border-radius:3px; }

/* ---------- Debug ---------- */
.debug-toggle{
  text-align:center;margin:26px 0 0;
}
.debug-toggle button{
  background:none;border:none;color:var(--muted-2);
  font-size:11.5px;text-decoration:underline;cursor:pointer;font-family:'Inter',sans-serif;
}
.debug-panel{
  margin:12px 20px 0;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  color:var(--muted);
  max-height:300px;
  overflow:auto;
  white-space:pre-wrap;
}

/* ---------- History panel ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(10,10,12,0.7);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:50;
}
.sheet{
  background:var(--surface);
  width:100%;max-width:640px;
  border-radius:20px 20px 0 0;

function norm(v){ if (v === null || v === undefined) return ''; return String(v).trim(); }

// Reconoce celdas de código de ejercicio en dos formatos:
// 1) Empieza por un número, admite combos con "+" y aclaraciones libres:
//    "51", "51 con parada +51", "3+21"...
// 2) El nombre del ejercicio seguido del código entre paréntesis al final:
//    "SENTADILLA DELANTE (51)", "JERK TÉCNICO (18)" — común en algunas
//    plantillas. Cualquier texto de la celda que no forme parte del nombre
//    oficial del código se guarda como aclaración (p. ej. "TÉCNICO").
// Devuelve un array de partes [{code, modifier}] o null si la celda no
// tiene pinta de código.
function parseCodeCell(codeCell){
  const raw = String(codeCell).trim();
  if (!raw) return null;

  if (/^\d/.test(raw)){
    // Formato "51 - SENTADILLA DELANTE" o "29 (aclaración) + 18 - PUSH JERK + JERK":
    // lo que va tras el primer " - " es solo el nombre, se descarta (el
    // nombre se saca del diccionario a partir del código).
    const dashIdx = raw.search(/\s-\s/);
    const codePart = dashIdx >= 0 ? raw.slice(0, dashIdx).trim() : raw;
    const segments = codePart.split('+').map(s=>s.trim()).filter(Boolean);
    if (!segments.length) return null;
    const parts = [];
    for (const seg of segments){
      const m = seg.match(/^(\d+)\s*(.*)$/);
      if (!m) return null; // algún trozo no empieza por un número -> no es un código
      parts.push({ code: parseInt(m[1],10), modifier: m[2].trim() || null });
    }
    return parts;
  }

  const trailing = raw.match(/^(.+?)\s*\((\d+)\)\s*$/);
  if (trailing){
    const label = trailing[1].trim();
    const code = parseInt(trailing[2], 10);
    const officialName = DICT[code];
    let modifier = null;
    if (officialName){
      const upperLabel = label.toUpperCase();
      const upperOfficial = officialName.toUpperCase();
      if (upperLabel === upperOfficial){
        modifier = null;
      } else if (upperLabel.startsWith(upperOfficial)){
        modifier = label.slice(officialName.length).trim() || null;
      } else if (upperLabel.endsWith(upperOfficial)){
        modifier = label.slice(0, label.length - officialName.length).trim() || null;
      } else {
        modifier = label; // el nombre de la celda no coincide con el oficial: se guarda como aclaración
      }
    } else {
      modifier = null;
    }
    return [{ code, modifier, rawLabel: label }];
  }

  return null;
}

// Construye el nombre visible de un ejercicio (o combo) a partir de sus partes.
function buildComboName(parts){
  return parts.map(p=>{
    const base = DICT[p.code] || p.rawLabel || ('Código ' + p.code);
    return p.modifier ? (base + ' ' + p.modifier.toUpperCase()) : base;
  }).join(' + ');
}

// Reconoce celdas de repeticiones simples ("5"), repartidas entre las
// partes de un combo ("2+1"), o con una anotación de descanso pegada
// (p.ej. "1 25\"" = 1 repe, 25 segundos de descanso hasta la siguiente).
// Si no encaja en ningún formato limpio, se conserva el texto tal cual
// para poder mostrarlo (no se descarta la información).
function parseRepsCell(v){
  if (v === null || v === undefined) return { total:null, parts:null, raw:null, restSeconds:null };
  const raw = String(v).trim();
  if (!raw) return { total:null, parts:null, raw:null, restSeconds:null };
  if (/^\d+([.,]\d+)?$/.test(raw)){
    return { total: Number(raw.replace(',','.')), parts: null, raw:null, restSeconds:null };
  }
  if (raw.includes('+')){
    const bits = raw.split('+').map(s=>s.trim());
    const nums = bits.map(b=> /^\d+([.,]\d+)?$/.test(b) ? Number(b.replace(',','.')) : null);
    if (!nums.some(n=>n===null)){
      return { total: nums.reduce((a,b)=>a+b,0), parts: nums, raw:null, restSeconds:null };
    }
  }
  const restMatch = raw.match(/^(\d+)\s+(\d+)\s*"\s*$/);
  if (restMatch){
    return { total: parseInt(restMatch[1],10), parts:null, raw, restSeconds: parseInt(restMatch[2],10) };
  }
  const firstNum = raw.match(/\d+/);
  return { total: firstNum ? parseInt(firstNum[0],10) : null, parts:null, raw, restSeconds:null };
}

// Texto a mostrar para el peso de una serie: el número normal, o el texto
// literal si era una anotación no numérica (p.ej. "??" = serie opcional).
function kgDisplayText(s){
  if (s.kg !== null && s.kg !== undefined) return s.kg + 'kg';
  return (s.kgRaw || '?');
}
// Texto a mostrar para las repeticiones: repartidas, la anotación literal
// guardada tal cual, o el número simple.
function repDisplayText(s){
  if (s.repsParts) return s.repsParts.join('+');
  if (s.repsRaw) return s.repsRaw;
  return s.reps ?? '?';
}
// Texto compacto de una serie completa: "85kg×1×3", con el remate de
// clúster (descanso corto + repe extra a menos peso) si lo tiene:
// "85kg×1×3 -25"- 80kg×1×1".
function setDisplayText(s){
  let text = kgDisplayText(s) + '×' + (s.series||'?') + '×' + repDisplayText(s);
  if (s.cluster){
    const c = s.cluster;
    const restLabel = c.restSeconds!=null ? (c.restSeconds+'"') : (c.raw || '');
    text += (restLabel ? ' -'+restLabel+'- ' : ' - ') + kgDisplayText(c) + '×' + (c.series||'?') + '×' + repDisplayText(c);
  }
  return text;
}

function parseRows(rows){
  let headerRowIdx = -1, codeColIdx = -1;
  for (let r=0; r<rows.length; r++){
    const row = rows[r] || [];
    for (let c=0; c<row.length; c++){
      const val = norm(row[c]).toUpperCase();
      if (/^C[OÓ]DIGO\b/.test(val)){ headerRowIdx = r; codeColIdx = c; break; }
    }
    if (headerRowIdx !== -1) break;
  }
  if (headerRowIdx === -1) return { ok:false, error:'no-header', rows };

  const header = rows[headerRowIdx] || [];
  let toColIdx = -1;
  for (let c=codeColIdx+1; c<header.length; c++){
    const up = norm(header[c]).toUpperCase();
    if (up === 'TO' || up.startsWith('TO ') || up.startsWith('TO\t')){ toColIdx = c; break; }
  }
  if (toColIdx === -1) toColIdx = header.length;

  const dayColIdx = 0;
  const refColIdx = codeColIdx + 1;
  const groupStart = refColIdx + 1;
  const numGroups = Math.max(0, Math.floor((toColIdx - groupStart) / 3));

  let athlete = null, week = null, jornada = null;
  const skipWords = ['PLAN','SEMANA','KG','MAXIMOS','MÁXIMOS','OBJETIVOS','COMPETICION','COMPETICIÓN','HISTORICO','HISTÓRICO','MEJORA','CODIGO','CÓDIGO','REF','ENTRENAMIENTO'];
  for (let r=0; r<headerRowIdx; r++){
    const row = rows[r] || [];
    // Algunas plantillas tienen una tabla de "MÁXIMOS" con dos filas,
    // Histórico/Semana, comparando la marca de esta semana con la marca de
    // siempre — esa "Semana" NO es el número de semana del plan, es un peso.
    // Se descarta si la fila de arriba dice "Histórico".
    const prevRow = rows[r-1] || [];
    const prevRowIsHistorico = prevRow.some(v=>{
      const u = norm(v).toUpperCase();
      return u.includes('HISTÓRICO') || u.includes('HISTORICO');
    });
    for (let c=0; c<row.length; c++){
      const val = norm(row[c]);
      const up = val.toUpperCase();
      if (up === 'SEMANA' && !prevRowIsHistorico){
        for (let cc=c+1; cc<row.length; cc++){
          if (row[cc] !== null && norm(row[cc]) !== ''){
            const n = Number(row[cc]);
            // un número de semana real de una temporada es un valor pequeño;
            // si no lo es (p.ej. viene de una celda de peso), se descarta
            if (!isNaN(n) && n>=1 && n<=60) week = n;
            break;
          }
        }
      }
      if (up.includes('JORNADA') || up.includes('ANDALUZ') || up.includes('LIGA') || up.includes('CAMPEONATO')){
        if (!jornada || val.length > jornada.length) jornada = val;
      }
    }
  }
  for (let r=0; r<headerRowIdx; r++){
    const row = rows[r] || [];
    for (let c=0; c<row.length; c++){
      const val = norm(row[c]);
      if (val && val === val.toUpperCase() && /^[A-ZÁÉÍÓÚÑ]{3,}$/.test(val) && !skipWords.includes(val) && !val.includes('JORNADA') && !val.includes('ANDALUZ')){
        athlete = val; break;
      }
    }
    if (athlete) break;
  }

  const days = {};
  let currentDay = null;

  for (let r=headerRowIdx+1; r<rows.length; r++){
    const row = rows[r] || [];
    const dayCell = norm(row[dayColIdx]).toUpperCase();
    if (dayCell && DAY_ORDER.includes(dayCell)){
      currentDay = dayCell;
      if (!days[currentDay]) days[currentDay] = [];
    }
    if (!currentDay) continue;

    const codeCellRaw = row[codeColIdx];
    const codeCell = norm(codeCellRaw);
    if (!codeCell) continue;

    const parts = parseCodeCell(codeCell);
    const entry = { sets: [] };

    if (parts){
      entry.type = 'exercise';
      entry.code = parts[0].code;
      entry.parts = (parts.length > 1 || parts[0].modifier) ? parts : null;
      entry.name = buildComboName(parts);
    } else {
      entry.type = REST_WORDS.includes(codeCell.toUpperCase()) ? 'rest' : 'note';
      entry.label = codeCell;
    }

    if (entry.type === 'exercise'){
      const groupToSetIdx = {};
      for (let g=0; g<numGroups; g++){
        const kgIdx = groupStart + g*3;
        const kg = row[kgIdx], s = row[kgIdx+1], rr = row[kgIdx+2];
        const kgStr = norm(kg);
        if (kgStr === '') continue;
        const repsInfo = parseRepsCell(rr);
        const seriesVal = (s!==null&&s!==undefined&&s!=='' && !isNaN(Number(s)))? Number(s): null;
        const setObj = !isNaN(Number(kg))
          ? { kg: Number(kg), series: seriesVal, reps: repsInfo.total, repsParts: repsInfo.parts, repsRaw: repsInfo.raw, restSeconds: repsInfo.restSeconds }
          : { kg: null, kgRaw: kgStr, optional: true, series: seriesVal, reps: repsInfo.total, repsParts: repsInfo.parts, repsRaw: repsInfo.raw, restSeconds: repsInfo.restSeconds };
        groupToSetIdx[g] = entry.sets.length;
        entry.sets.push(setObj);
      }
      if (entry.sets.length === 0) continue;

      // Fila de continuación: sin día ni código, pero con pesos en alguna
      // de las mismas columnas — es el remate en clúster de esa serie
      // (p.ej. una repe extra a menos peso tras un descanso corto), no un
      // ejercicio suelto sin nombre.
      const nextRow = rows[r+1] || [];
      const nextDayCell = norm(nextRow[dayColIdx]);
      const nextCodeCell = norm(nextRow[codeColIdx]);
      if (!nextDayCell && !nextCodeCell){
        let merged = false;
        for (let g=0; g<numGroups; g++){
          if (groupToSetIdx[g] === undefined) continue;
          const kgIdx = groupStart + g*3;
          const kg = nextRow[kgIdx], s = nextRow[kgIdx+1], rr = nextRow[kgIdx+2];
          const kgStr = norm(kg);
          if (kgStr === '') continue;
          const repsInfo = parseRepsCell(rr);
          const seriesVal = (s!==null&&s!==undefined&&s!=='' && !isNaN(Number(s)))? Number(s): null;
          const clusterObj = !isNaN(Number(kg))
            ? { kg: Number(kg), series: seriesVal, reps: repsInfo.total, repsParts: repsInfo.parts, repsRaw: repsInfo.raw, restSeconds: repsInfo.restSeconds }
            : { kg: null, kgRaw: kgStr, optional: true, series: seriesVal, reps: repsInfo.total, repsParts: repsInfo.parts, repsRaw: repsInfo.raw, restSeconds: repsInfo.restSeconds };
          entry.sets[groupToSetIdx[g]].cluster = clusterObj;
          merged = true;
        }
        if (merged) r++;
      }
    }

    days[currentDay].push(entry);
  }

  const anyData = Object.keys(days).length > 0;
  if (!anyData) return { ok:false, error:'no-days', rows };

  return { ok:true, meta:{ athlete, week, jornada }, days };
}

function parseWorkbook(workbook){
  const sheetName = workbook.SheetNames[0];
  const sheet = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, { header:1, raw:true, defval:null });
  return parseRows(rows);
}

/* ============== PDF PARSER ============== */
/* PDFs have no cells, just positioned text. We rebuild a grid the same shape
   parseRows() expects by anchoring column x-positions from the header row
   ("CODIGO" ... "TO") and bucketing every other text item into the nearest
   column to its left (a "floor" search), which mirrors how a spreadsheet's
   printed/exported PDF actually lays out cell content. */
const PDF_HEADER_WORDS = ['CODIGO','CÓDIGO','REF','KG','S','R','TO','PM','IMR'];

function pdfExpandTokens(item){
  const raw = item.str;
  const str = raw.trim();
  if (!str) return [];
  const words = str.split(/\s+/);
  const isAllNumeric = words.every(w => /^\d+([.,]\d+)?%?$/.test(w));
  const isAllHeaderWords = words.length > 1 && words.every(w => PDF_HEADER_WORDS.includes(w.toUpperCase()));
  if (!(isAllNumeric || isAllHeaderWords) || words.length === 1){
    return [{ str, x: item.x, y: item.y }];
  }
  const out = [];
  const re = /\S+/g;
  let m;
  const len = raw.length || 1;
  while ((m = re.exec(raw)) !== null){
    const estX = item.x + (m.index / len) * item.width;
    out.push({ str: m[0], x: estX, y: item.y });
  }
  return out;
}

function pdfGroupRows(items, yTol){
  const sorted = [...items].sort((a,b)=> b.y - a.y);
  const rows = [];
  sorted.forEach(it=>{
    let row = rows.find(r => Math.abs(r.y - it.y) <= yTol);
    if (!row){ row = { y: it.y, items: [] }; rows.push(row); }
    row.items.push(it);
  });
  rows.forEach(r => r.items.sort((a,b)=> a.x - b.x));
  rows.sort((a,b)=> b.y - a.y);
  return rows;
}

function pdfFindHeaderRow(rows){
  for (const r of rows){
    if (r.items.some(it => norm(it.str).toUpperCase()==='CODIGO' || norm(it.str).toUpperCase()==='CÓDIGO')) return r;
  }
  return null;
}

function pdfBuildBoundaries(headerRow){
  const relevant = headerRow.items.filter(it => PDF_HEADER_WORDS.includes(norm(it.str).toUpperCase()));
  relevant.sort((a,b)=>a.x-b.x);
  const boundaries = [0];
  let seenCodigo = false, seenTo = false;
  for (const it of relevant){
    const up = norm(it.str).toUpperCase();
    if (up === 'CODIGO' || up === 'CÓDIGO'){ boundaries.push(it.x); seenCodigo = true; continue; }
    if (!seenCodigo) continue;
    if (seenTo) break;
    boundaries.push(it.x);
    if (up === 'TO') seenTo = true;
  }
  return boundaries;
}

function pdfAssignRow(row, boundaries, tol){
  const out = new Array(boundaries.length).fill(null);
  row.items.forEach(it=>{
    let idx = 0;
    for (let i=0;i<boundaries.length;i++){ if (boundaries[i] <= it.x + tol) idx = i; else break; }
    if (out[idx] === null) out[idx] = norm(it.str);
    else out[idx] += ' ' + norm(it.str);
  });
  return out;
}

async function extractGridFromPdf(arrayBuffer){
  const data = new Uint8Array(arrayBuffer);
  const doc = await window.pdfjsLib.getDocument({ data }).promise;
  let allRows = [];
  let boundaries = null;

  for (let p=1; p<=doc.numPages; p++){
    const page = await doc.getPage(p);
    const content = await page.getTextContent();
    const items = content.items.map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5], width: it.width }))
                               .filter(it => norm(it.str) !== '');
    const tokens = items.flatMap(pdfExpandTokens);
    const rows = pdfGroupRows(tokens, 3);

    if (!boundaries){
      const headerRow = pdfFindHeaderRow(rows);
      if (headerRow) boundaries = pdfBuildBoundaries(headerRow);
    }
    if (!boundaries) continue;

    rows.forEach(r => allRows.push(pdfAssignRow(r, boundaries, 4)));
  }
  return allRows;
}

async function parsePdf(arrayBuffer){
  const rows = await extractGridFromPdf(arrayBuffer);
  return parseRows(rows);
}

/* ============== IMAGE / SCANNED-PDF OCR PARSER ==============
   For PDFs that are actually a flattened photo/screenshot (no text layer)
   and for direct photo uploads. Detects the printed table's grid LINES
   (not text) from pixel data, OCRs each cell individually, and assigns
   day letters by position (L,M,X,J,V,S always appear in that fixed order
   in this coach's template) rather than trying to OCR the stylised
   rotated letters, which is unreliable. Because OCR can misread a digit,
   the result always goes through a review screen before being saved. */

const OCR_DAY_ORDER = ['L','M','X','J','V','S','D'];

function ocrClusterPositions(sortedIndices, gap){
  if (!sortedIndices.length) return [];
  const groups = [[sortedIndices[0]]];
  for (let i=1;i<sortedIndices.length;i++){
    if (sortedIndices[i]-groups[groups.length-1][groups[groups.length-1].length-1] <= gap){
      groups[groups.length-1].push(sortedIndices[i]);
    } else groups.push([sortedIndices[i]]);
  }
  return groups.map(g => Math.round(g.reduce((a,b)=>a+b,0)/g.length));
}

function ocrClusterGroups(sortedIndices, gap){
  if (!sortedIndices.length) return [];
  const groups = [[sortedIndices[0]]];
  for (let i=1;i<sortedIndices.length;i++){
    if (sortedIndices[i]-groups[groups.length-1][groups[groups.length-1].length-1] <= gap){
      groups[groups.length-1].push(sortedIndices[i]);
    } else groups.push([sortedIndices[i]]);
  }
  return groups;
}

// Build a grayscale "darkness" lookup from canvas pixel data (1 = dark/ink, 0 = light)
function ocrBuildDarkMask(imageData){
  const { data, width, height } = imageData;
  const mask = new Uint8Array(width*height);
  for (let i=0, p=0; i<data.length; i+=4, p++){
    const lum = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
    mask[p] = lum < 180 ? 1 : 0;
  }
  return { mask, width, height };
}

function ocrRowDarkFrac(mask, width, height, x0=0, x1=width){
  const out = new Float32Array(height);
  const span = x1 - x0;
  for (let y=0;y<height;y++){
    let c = 0;
    const base = y*width;
    for (let x=x0;x<x1;x++) c += mask[base+x];
    out[y] = c/span;
  }
  return out;
}

function ocrColDarkFrac(mask, width, height, y0=0, y1=height){
  const out = new Float32Array(width);
  for (let x=0;x<width;x++){
    let c = 0;
    for (let y=y0;y<y1;y++) c += mask[y*width+x];
    out[x] = c/(y1-y0);
  }
  return out;
}

// Find the tight bounding box of non-white content, to trim margins.
function ocrContentBBox(mask, width, height){
  let top=null, bottom=null, left=null, right=null;
  const rowFrac = ocrRowDarkFrac(mask, width, height);
  for (let y=0;y<height;y++){ if (rowFrac[y] > 0.002){ if (top===null) top=y; bottom=y; } }
  if (top===null) return null;
  const colFrac = ocrColDarkFrac(mask, width, height, top, bottom+1);
  for (let x=0;x<width;x++){ if (colFrac[x] > 0.002){ if (left===null) left=x; right=x; } }
  return { top, bottom, left, right };
}

async function ocrCropCanvas(srcCanvas, x0,y0,x1,y1){
  const w = Math.max(1, x1-x0), h = Math.max(1, y1-y0);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(srcCanvas, x0, y0, w, h, 0, 0, w, h);
  return c;
}

function ocrNorm(v){ return v===null||v===undefined ? '' : String(v).trim(); }
function ocrFuzzyEq(a, b){
  a = ocrNorm(a).toUpperCase(); b = b.toUpperCase();
  if (!a) return false;
  if (a === b) return true;
  if (a.length >= 2 && (a.includes(b) || b.includes(a))) return true;
  return false;
}

async function extractGridFromImageCanvas(sourceCanvas, onProgress){
  // 1. Work at a consistent resolution for reliable thresholds
  const targetW = 3000;
  const scale = Math.min(2.5, targetW / sourceCanvas.width);
  let work = sourceCanvas;
  if (Math.abs(scale-1) > 0.05){
    const c = document.createElement('canvas');
    c.width = Math.round(sourceCanvas.width*scale);
    c.height = Math.round(sourceCanvas.height*scale);
    c.getContext('2d').drawImage(sourceCanvas, 0,0,c.width,c.height);
    work = c;
  }
  const ctx = work.getContext('2d');
  let imageData = ctx.getImageData(0,0,work.width,work.height);
  let { mask, width, height } = ocrBuildDarkMask(imageData);

  // 2. trim to content bbox
  const bbox = ocrContentBBox(mask, width, height);
  if (!bbox) return { ok:false, error:'blank-image' };
  const cropped = await ocrCropCanvas(work, bbox.left, bbox.top, bbox.right+1, bbox.bottom+1);
  imageData = cropped.getContext('2d').getImageData(0,0,cropped.width,cropped.height);
  ({ mask, width, height } = ocrBuildDarkMask(imageData));

  // 3. fine grid lines (this may include a few extra rows/cols from a title
  //    block or logo above the real table -- harmless, we locate the real
  //    header row explicitly in step 4 rather than assuming row 0 is it)
  const rowFrac = ocrRowDarkFrac(mask, width, height);
  const colFrac = ocrColDarkFrac(mask, width, height);
  const rowLineIdx = []; for (let y=0;y<height;y++) if (rowFrac[y] > 0.5) rowLineIdx.push(y);
  const colLineIdx = []; for (let x=0;x<width;x++) if (colFrac[x] > 0.5) colLineIdx.push(x);
  let rowB = ocrClusterPositions(rowLineIdx, 15);
  let colB = ocrClusterPositions(colLineIdx, 15);
  if (!rowB.length || !colB.length) return { ok:false, error:'no-grid' };
  if (colB[0] > 5) colB = [0, ...colB];
  if (rowB.length < 2 || colB.length < 2) return { ok:false, error:'no-grid' };

  const worker = await Tesseract.createWorker('spa');
  await worker.setParameters({ tessedit_pageseg_mode: '7' });

  async function ocrCell(x0,y0,x1,y1,inset){
    const ix0=x0+inset, iy0=y0+inset, ix1=x1-inset, iy1=y1-inset;
    if (ix1<=ix0 || iy1<=iy0) return '';
    let dcount=0, total=0;
    for (let y=iy0;y<iy1;y++) for (let x=ix0;x<ix1;x++){ total++; if (mask[y*width+x]) dcount++; }
    if (total===0 || dcount/total < 0.0015) return '';
    let crop = await ocrCropCanvas(cropped, ix0, iy0, ix1, iy1);
    if (crop.width < 120){
      const factor = Math.max(1, Math.round(150/Math.max(crop.width,1)));
      const c2 = document.createElement('canvas');
      c2.width = crop.width*factor; c2.height = crop.height*factor;
      c2.getContext('2d').drawImage(crop, 0,0,c2.width,c2.height);
      crop = c2;
    }
    const { data: { text } } = await worker.recognize(crop);
    return text.trim();
  }

  // 4. locate the real header row (scan from the top until a cell reads
  //    "CODIGO") -- this skips past any title/logo/summary block above the
  //    actual table, so day-block detection below never gets confused by it.
  let headerRowIdx = -1, codeColIdx = -1;
  const headerScanLimit = Math.min(rowB.length-1, 10);
  for (let ri=0; ri<headerScanLimit && headerRowIdx===-1; ri++){
    const y0=rowB[ri], y1=rowB[ri+1];
    for (let ci=0; ci<colB.length-1; ci++){
      const x0=colB[ci], x1=colB[ci+1];
      const txt = await ocrCell(x0,y0,x1,y1,6);
      if (ocrFuzzyEq(txt,'CODIGO') || ocrFuzzyEq(txt,'CÓDIGO')){
        headerRowIdx = ri; codeColIdx = ci; break;
      }
    }
  }
  if (headerRowIdx === -1){ await worker.terminate(); return { ok:false, error:'no-header-visual' }; }

  // 5. day-letter blocks via ink density in the sidebar, restricted to rows
  //    at/after the header (so a logo or title block above can't shift them)
  const dayX1 = colB[1];
  const dayScanY0 = rowB[headerRowIdx];
  const dayRowFrac = ocrRowDarkFrac(mask, width, height, 0, dayX1);
  const inkyIdx = []; for (let y=dayScanY0;y<height;y++) if (dayRowFrac[y] > 0.03) inkyIdx.push(y);
  const inkyGroups = ocrClusterGroups(inkyIdx, 20).filter(g => (g[g.length-1]-g[0]) > 40).slice(0,7);
  let dayBlocks = [];
  if (inkyGroups.length){
    const centers = inkyGroups.map(g => (g[0]+g[g.length-1])/2);
    const partition = [dayScanY0];
    for (let i=0;i<centers.length-1;i++) partition.push((centers[i]+centers[i+1])/2);
    partition.push(height);
    dayBlocks = centers.map((_,i)=>({ day: OCR_DAY_ORDER[i], y0: partition[i], y1: partition[i+1] }));
  }
  function yToDay(y){
    for (const b of dayBlocks) if (y >= b.y0 && y < b.y1) return b.day;
    return null;
  }

  // 6. OCR the header row + all data rows below it
  const rowsToRead = rowB.length-1-headerRowIdx;
  const totalCells = rowsToRead * (colB.length-1);
  let done = 0;
  function tick(){ done++; if (onProgress) onProgress(Math.min(0.97, done/Math.max(totalCells,1))); }

  const grid = [];
  for (let ri=headerRowIdx; ri<rowB.length-1; ri++){
    const y0=rowB[ri], y1=rowB[ri+1];
    const rowOut = [ ri===headerRowIdx ? null : yToDay((y0+y1)/2) ];
    for (let ci=1; ci<colB.length-1; ci++){
      const x0=colB[ci], x1=colB[ci+1];
      const txt = await ocrCell(x0,y0,x1,y1,6);
      rowOut.push(txt);
      tick();
    }
    grid.push(rowOut);
  }
  await worker.terminate();
  if (onProgress) onProgress(1);

  return { ok:true, rows: grid };
}

function parseOcrGrid(rows){
  let headerRowIdx=-1, codeColIdx=-1;
  for (let r=0;r<rows.length;r++){
    const row = rows[r]||[];
    for (let c=1;c<row.length;c++){
      if (ocrFuzzyEq(row[c],'CODIGO') || ocrFuzzyEq(row[c],'CÓDIGO')){ headerRowIdx=r; codeColIdx=c; break; }
    }
    if (headerRowIdx!==-1) break;
  }
  if (headerRowIdx===-1) return { ok:false, error:'no-header', rows };

  const header = rows[headerRowIdx];
  const groupStart = codeColIdx + 2;
  const kgIdxs = [];
  for (let i=groupStart;i<header.length;i++) if (ocrFuzzyEq(header[i],'KG')) kgIdxs.push(i);
  const numGroups = kgIdxs.length ? Math.floor((Math.max(...kgIdxs)-groupStart)/3)+1 : 0;

  const days = {};
  let currentDay = null;
  for (let r=headerRowIdx+1; r<rows.length; r++){
    const row = rows[r]||[];
    const dayCell = row[0];
    if (dayCell && OCR_DAY_ORDER.includes(dayCell)){
      currentDay = dayCell;
      if (!days[currentDay]) days[currentDay] = [];
    }
    if (!currentDay) continue;
    const codeCell = ocrNorm(row[codeColIdx]);
    if (!codeCell) continue;
    if (codeCell.toUpperCase()==='NOTAS') break; // footer reached, stop
    const parts = parseCodeCell(codeCell);
    const entry = { sets: [] };
    if (parts){
      entry.type = 'exercise';
      entry.code = parts[0].code;
      entry.parts = (parts.length > 1 || parts[0].modifier) ? parts : null;
      entry.name = buildComboName(parts);
      for (let g=0; g<numGroups; g++){
        const kgIdx = groupStart+g*3;
        if (kgIdx+2 >= row.length) break;
        const kg = ocrNorm(row[kgIdx]), s = ocrNorm(row[kgIdx+1]), rr = ocrNorm(row[kgIdx+2]);
        if (/^\d+([.,]\d+)?$/.test(kg)){
          const repsInfo = parseRepsCell(rr);
          entry.sets.push({
            kg: Number(kg.replace(',','.')),
            series: /^\d+$/.test(s) ? Number(s) : null,
            reps: repsInfo.total,
            repsParts: repsInfo.parts
          });
        }
      }
      if (entry.sets.length===0) continue;
    } else {
      entry.type = REST_WORDS.includes(codeCell.toUpperCase()) ? 'rest' : 'note';
      entry.label = codeCell;
    }
    days[currentDay].push(entry);
  }
  if (Object.keys(days).length===0) return { ok:false, error:'no-days', rows };
  return { ok:true, meta:{ athlete:null, week:null, jornada:null }, days, needsReview:true };
}

async function parseImageOrScannedPdf(sourceCanvas, onProgress){

async function loadImageFileToCanvas(file){
  const dataUrl = await new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
  const img = await new Promise((res,rej)=>{
    const im = new Image();
    im.onload = ()=>res(im);
    im.onerror = rej;
    im.src = dataUrl;
  });
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img,0,0);
  return c;
}

async function renderPdfPageToCanvas(arrayBuffer, pageNum, scale){
  const doc = await window.pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;
  const page = await doc.getPage(pageNum);
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  return canvas;
}



/* ============== ALMACENAMIENTO PERSISTENTE ==============
   Usa window.storage (el almacén propio de los artefactos de Claude, que
   persiste de verdad entre sesiones) en vez de localStorage, que en el
   sandbox donde corre este artefacto no sobrevive fiablemente a cerrar la
   app. Si por algún motivo window.storage no estuviera disponible, cae de
   vuelta a localStorage como último recurso (mejor que nada, aunque no
   persista igual de bien). */
function hasArtifactStorage(){
  return typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}
async function storageGet(key){
  if (hasArtifactStorage()){
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }catch(e){ return null; }
  }
  try{ return localStorage.getItem('wl_'+key); }catch(e){ return null; }
}
async function storageSet(key, value){
  if (hasArtifactStorage()){
    try{ await window.storage.set(key, value, false); return; }catch(e){}
  }
  try{ localStorage.setItem('wl_'+key, value); }catch(e){}
}
async function storageDelete(key){
  if (hasArtifactStorage()){
    try{ await window.storage.delete(key, false); return; }catch(e){}
  }
  try{ localStorage.removeItem('wl_'+key); }catch(e){}
}

function applyRemoteUserDoc(uid, data){
  applyingRemoteSync = true;
  const d = { plans: (data&&data.plans)||[], checks: (data&&data.checks)||{}, notes: (data&&data.notes)||{}, seriesProgress: (data&&data.seriesProgress)||{} };
  userDataCache[uid] = d;
  saveUserDataAsync(uid, d);
  if (uid === activeUserId){
    state.plans = d.plans; state.checks = d.checks; state.notes = d.notes; state.seriesProgress = d.seriesProgress;
    const sorted = [...state.plans].sort((a,b)=>a.uploadedAt-b.uploadedAt);
    state.activePlanId = sorted.length ? sorted[sorted.length-1].id : null;
    state.reviewDismissed = sorted.length ? !sorted[sorted.length-1].needsReview : false;
  }
  applyingRemoteSync = false;
}

async function startSync(code){
  syncCode = code.trim();
  if (!syncCode) return;
  syncStatus = 'connecting';
  render();
  const database = ensureFirebase();
  if (!database){ syncStatus='error'; render(); return; }
  try{
    const rosterSnap = await rosterDocRef().get();
    if (rosterSnap.exists){
      const rdata = rosterSnap.data();
      applyingRemoteSync = true;
      users = rdata.users || [];
      saveUsersAsync(users);
      applyingRemoteSync = false;
      if (!activeUserId || !users.find(u=>u.id===activeUserId)){
        activeUserId = users[0] ? users[0].id : activeUserId;
      }
      // migración: si el documento antiguo (versión previa) traía los
      // datos embebidos en "data", los usamos como base la primera vez.
      const legacyData = rdata.data || {};
      for (const u of users){
        const uSnap = await userDocRef(u.id).get();
        if (uSnap.exists){
          applyRemoteUserDoc(u.id, uSnap.data());
        } else if (legacyData[u.id]){
          applyRemoteUserDoc(u.id, legacyData[u.id]);
          await pushUserNow(u.id); // lo subimos ya a su documento propio
        } else {
          applyRemoteUserDoc(u.id, { plans:[], checks:{}, notes:{} });
        }
      }
    } else {
      // primera vez con este código: subimos lo que ya tenemos localmente
      await pushRosterNow();
      for (const u of users){ await pushUserNow(u.id); }
    }

    if (rosterUnsub) rosterUnsub();
    rosterUnsub = rosterDocRef().onSnapshot(snap=>{
      if (!snap.exists || snap.metadata.hasPendingWrites) return;
      const rdata = snap.data();
      applyingRemoteSync = true;
      users = rdata.users || users;
      saveUsersAsync(users);
      applyingRemoteSync = false;
      render();
    });

    if (usersColUnsub) usersColUnsub();
    usersColUnsub = rosterDocRef().collection('users').onSnapshot(snap=>{
      snap.docChanges().forEach(change=>{
        if (change.doc.metadata.hasPendingWrites) return;
        const uid = change.doc.id;
        if (change.type === 'removed'){
          delete userDataCache[uid];
          storageDelete(userDataKey(uid));
        } else {
          applyRemoteUserDoc(uid, change.doc.data());
        }
      });
      render();
    });

    await storageSet(SYNC_CODE_KEY, syncCode);
    syncStatus = 'on';
  }catch(e){
    syncStatus = 'error';
  }
  render();
}

function stopSync(){
  if (rosterUnsub){ rosterUnsub(); rosterUnsub=null; }
  if (usersColUnsub){ usersColUnsub(); usersColUnsub=null; }
  syncCode = null;
  syncStatus = 'off';
  storageDelete(SYNC_CODE_KEY);
  render();
}

let storageBackendUsed = 'unknown'; // 'claude' | 'local' | 'none' — diagnóstico visible del almacén real

async function detectStorageBackend(){
  if (!hasArtifactStorage()){ storageBackendUsed = 'local'; return; }
  try{
    const testKey = '__wl_storage_probe__';
    const stamp = String(Date.now());
    await window.storage.set(testKey, stamp, false);
    const r = await window.storage.get(testKey, false);
    storageBackendUsed = (r && r.value === stamp) ? 'claude' : 'local';
  }catch(e){
    storageBackendUsed = 'local';
  }
}

function renderBootLoading(){
  const wrap = el('div');
  wrap.style.cssText = 'min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:Inter,sans-serif;font-size:14px;background:var(--bg);';
  wrap.textContent = 'Cargando tus datos…';
  return wrap;
}

async function initApp(){
  root.innerHTML = '';
  root.appendChild(renderBootLoading());

  await detectStorageBackend();

  users = await loadUsersAsync();
  activeUserId = await loadActiveUserIdAsync();

  if (!users.length){
    const migrated = await migrateLegacyLocalStorage();
    if (migrated){
      users = migrated.users;
      activeUserId = migrated.activeUserId;
    } else {
      let legacyPlans = null, legacyChecks = null;
      try{ legacyPlans = localStorage.getItem('wl_plans_v1'); }catch(e){}
      try{ legacyChecks = localStorage.getItem('wl_checks_v1'); }catch(e){}
      const first = makeUser('Yo');
      users = [first];
      activeUserId = first.id;
      await saveUsersAsync(users);
      await saveActiveUserIdAsync(activeUserId);
      if (legacyPlans || legacyChecks){
        let plans = [], checks = {};
        try{ plans = JSON.parse(legacyPlans) || []; }catch(e){}
        try{ checks = JSON.parse(legacyChecks) || {}; }catch(e){}
        await saveUserDataAsync(activeUserId, { plans, checks, notes:{} });
      }
    }
  }
  if (!activeUserId || !users.find(u=>u.id===activeUserId)){
    activeUserId = users[0].id;
    await saveActiveUserIdAsync(activeUserId);
  }

  const data = await loadUserDataAsync(activeUserId);
  state.plans = data.plans;
  state.checks = data.checks;
  state.notes = data.notes;
  state.seriesProgress = data.seriesProgress || {};
  const sorted = [...state.plans].sort((a,b)=>a.uploadedAt-b.uploadedAt);
  state.activePlanId = sorted.length ? sorted[sorted.length-1].id : null;
  state.reviewDismissed = sorted.length ? !sorted[sorted.length-1].needsReview : false;

  try{ const raw = await storageGet(LAST_BACKUP_KEY); lastBackupTs = raw ? Number(raw) : null; }catch(e){ lastBackupTs = null; }
  try{ preferredVoiceURI = await storageGet(PREFERRED_VOICE_KEY); }catch(e){ preferredVoiceURI = null; }
  try{ restTimerMuted = (await storageGet(REST_TIMER_MUTED_KEY)) === '1'; }catch(e){ restTimerMuted = false; }

  render();
  prefetchAllUserData();

  try{
    const savedCode = await storageGet(SYNC_CODE_KEY);
    if (savedCode) startSync(savedCode); // no se espera, para no retrasar el primer render
  }catch(e){}
}

function planId(meta){
  // El prefijo (semana/jornada) es solo para que el id sea legible; lo que
  // garantiza que nunca se repita entre subidas distintas es el sufijo
  // (marca de tiempo + aleatorio). Antes el id dependía solo de la semana/
  // jornada detectadas, y si esos datos no se leían bien (o coincidían con
  // los de otra semana), una subida nueva podía sustituir por accidente a
  // otra ya existente — heredando así sus marcas de bien/mal.
  return 'w' + (meta.week ?? 'x') + '_' + (meta.jornada ? meta.jornada.replace(/\s+/g,'').slice(0,20) : 'plan') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function tonnage(dayEntries){
  let t = 0;
  (dayEntries||[]).forEach(e=>{
    if (e.type === 'exercise'){
      e.sets.forEach(s=>{ t += (s.kg||0) * (s.series||1) * (s.reps||1); });
    }
  });
  return t;
}

function checkKey(plan, day, exIdx, setIdx){
  return plan.id + '|' + day + '|' + exIdx + '|' + setIdx;
}

// Reindexa un almacén con claves "planId|día|exIdx|setIdx..." tras borrar el
// ejercicio en la posición idx de ese día: descarta sus claves y desplaza
// hacia atrás el exIdx de los ejercicios posteriores.
function reindexStoreAfterExerciseDelete(store, plan, day, idx){
  const prefix = plan.id + '|' + day + '|';
  const out = {};
  Object.keys(store).forEach(k=>{
    if (k.startsWith(prefix)){
      const rest = k.slice(prefix.length);
      const sep = rest.indexOf('|');
      const exIdx = parseInt(rest.slice(0,sep),10);
      const setPart = rest.slice(sep+1);
      if (exIdx === idx) return; // se descarta lo asociado al ejercicio borrado
      const newExIdx = exIdx > idx ? exIdx-1 : exIdx;
      out[plan.id+'|'+day+'|'+newExIdx+'|'+setPart] = store[k];
    } else {
      out[k] = store[k];
    }
  });
  return out;
}

// Borra un ejercicio del día y reindexa las marcas (bien/mal) y el progreso
// de series del resto de ejercicios de ese día, para que no se desincronicen
// con su nueva posición.
function deleteExerciseEntry(plan, day, idx){
  plan.days[day].splice(idx, 1);
  state.checks = reindexStoreAfterExerciseDelete(state.checks, plan, day, idx);
  state.seriesProgress = reindexStoreAfterExerciseDelete(state.seriesProgress, plan, day, idx);
  persistUserData();
}

function dayStats(plan, day){
  const entries = plan.days[day] || [];
  let totalSets = 0, checkedSets = 0;
  entries.forEach((e,exIdx)=>{
    if (e.type !== 'exercise') return;
    e.sets.forEach((s,setIdx)=>{
      totalSets++;
      if (state.checks[checkKey(plan,day,exIdx,setIdx)]) checkedSets++;
    });
  });
  return { totalSets, checkedSets };
}

/* ---- Review screen (editable, before saving an OCR'd plan) ---- */
function reviewEnsureDraft(plan){
  if (!state.reviewDraft || state.reviewDraftFor !== plan.id){
    state.reviewDraft = JSON.parse(JSON.stringify(plan.days));
    state.reviewDraftFor = plan.id;
  }
}

function renderReviewScreen(plan){
  reviewEnsureDraft(plan);
  const draft = state.reviewDraft;
  const wrap = el('div','app');

  const top = el('div','topbar');
  top.appendChild(el('div','athlete-name', plan.manualEntry ? 'Nuevo plan a mano' : 'Revisar lectura'));
  top.appendChild(el('div','meta-line', plan.manualEntry
    ? 'Añade cada ejercicio con su código, kg, series y repes. Se guarda cuando pulses "Confirmar y guardar".'
    : 'Leído automáticamente de la foto — compara con la imagen y corrige lo que falte antes de guardar.'));
  wrap.appendChild(top);

  const section = el('div','day-section');
  section.style.paddingTop = '16px';

  DAY_ORDER.forEach(d=>{
    if (!draft[d]) return;
    const heading = el('div','day-heading');
    heading.appendChild(el('h2', null, DAY_NAMES[d]));
    section.appendChild(heading);

    draft[d].forEach((entry, idx)=>{
      section.appendChild(renderReviewEntry(plan, d, entry, idx));
    });

    const addRow = el('div');
    addRow.style.cssText = 'display:flex;gap:8px;margin:6px 0 20px;';
    const addExBtn = el('button','tb-btn','+ Ejercicio');
    addExBtn.onclick = ()=>{
      draft[d].push({ type:'exercise', code:null, name:null, sets:[{kg:null,series:null,reps:null}] });
      render();
    };
    const addNoteBtn = el('button','tb-btn','+ Nota / descanso');
    addNoteBtn.onclick = ()=>{
      draft[d].push({ type:'note', label:'' });
      render();
    };
    addRow.appendChild(addExBtn); addRow.appendChild(addNoteBtn);
    section.appendChild(addRow);
  });

  wrap.appendChild(section);

  const actions = el('div');
  actions.style.cssText = 'position:sticky;bottom:0;background:var(--bg);padding:14px 20px 24px;border-top:1px solid var(--border);display:flex;gap:10px;';
  const cancelBtn = el('button','tb-btn','Descartar y subir otra');
  cancelBtn.style.flex = '1';
  cancelBtn.onclick = ()=>{
    state.plans = state.plans.filter(p=>p.id!==plan.id);
    persistUserData();
    state.activePlanId = null;
    state.reviewDraft = null; state.reviewDraftFor = null;
    render();
  };
  const confirmBtn = el('button','mark-btn ok selected','Confirmar y guardar');
  confirmBtn.style.flex = '2';
  confirmBtn.onclick = ()=>{
    plan.days = state.reviewDraft;
    plan.needsReview = false;
    persistUserData();
    state.reviewDraft = null; state.reviewDraftFor = null;
    state.reviewDismissed = true;
    render();
  };
  actions.appendChild(cancelBtn); actions.appendChild(confirmBtn);
  wrap.appendChild(actions);

  return wrap;
}

function reviewMiniInput(value, placeholder, width, onCommit){
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.inputMode = 'numeric';
  inp.value = value===null||value===undefined ? '' : value;
  inp.placeholder = placeholder || '';
  inp.style.cssText = 'width:'+width+'px;background:var(--surface-2);border:1px solid var(--surface-3);border-radius:7px;color:var(--chalk);font-family:IBM Plex Mono,monospace;font-size:13px;padding:7px 6px;text-align:center;';
  inp.addEventListener('change', ()=> onCommit(inp.value.trim()));
  return inp;
}

// Edición manual de un día ya existente en el plan (o de uno vacío): reusa
// las mismas tarjetas editables de la pantalla de revisión, apuntando
// state.reviewDraft[day] al MISMO array que plan.days[day] (por referencia),
// para que añadir/borrar/editar ahí actualice directamente el plan real.
function startManualDayEdit(plan, day){
  if (!plan.days[day]) plan.days[day] = [];
  state.reviewDraft = {};
  state.reviewDraft[day] = plan.days[day];
  state.reviewDraftFor = plan.id + '__manual__' + day;
  state.manualEditDay = day;
  render();
}
function finishManualDayEdit(){
  persistUserData();
  state.reviewDraft = null; state.reviewDraftFor = null;
  state.manualEditDay = null;
  render();
}

function renderReviewEntry(plan, day, entry, idx){
  const card = el('div','ex-card');
  card.style.marginBottom = '10px';

  if (entry.type !== 'exercise'){
    const row = el('div');
    row.style.cssText = 'display:flex;gap:8px;align-items:center;';
    const labelInput = document.createElement('input');
    labelInput.type = 'text';
    labelInput.value = entry.label || '';
    labelInput.placeholder = 'Descanso, competición, nota…';
    labelInput.style.cssText = 'flex:1;background:var(--surface-2);border:1px solid var(--surface-3);border-radius:8px;color:var(--chalk);font-family:Inter,sans-serif;font-size:13.5px;padding:9px 10px;';

    delBtn.style.cssText = 'background:none;border:1px solid var(--surface-3);color:var(--muted);border-radius:8px;width:34px;height:34px;cursor:pointer;';
    delBtn.onclick = ()=>{ state.reviewDraft[day].splice(idx,1); render(); };
    row.appendChild(labelInput); row.appendChild(delBtn);
    card.appendChild(row);
    return card;
  }

  const top = el('div','ex-top');
  const codeInput = reviewMiniInput(entry.code, 'cód.', 50, (v)=>{
    entry.code = /^\d+$/.test(v) ? parseInt(v,10) : null;
    entry.name = entry.code!==null ? (DICT[entry.code]||null) : null;
    nameLabel.textContent = entry.name || (entry.code!==null ? 'Código '+entry.code+' (sin identificar)' : 'Código?');
    nameLabel.className = 'ex-name' + (entry.name ? '' : ' unknown');
  });
  top.appendChild(codeInput);
  const info = el('div','ex-info');
  const nameLabel = el('div','ex-name'+(entry.name?'':' unknown'), entry.name || (entry.code!==null?('Código '+entry.code+' (sin identificar)'):'Código?'));
  info.appendChild(nameLabel);
  top.appendChild(info);
  const delBtn = el('button', null, '✕');
  delBtn.style.cssText = 'background:none;border:1px solid var(--surface-3);color:var(--muted);border-radius:8px;width:34px;height:34px;cursor:pointer;flex-shrink:0;';
  delBtn.onclick = ()=>{ state.reviewDraft[day].splice(idx,1); render(); };
  top.appendChild(delBtn);
  card.appendChild(top);

  const setsWrap = el('div');
  setsWrap.style.cssText = 'margin:12px 0 6px 0;display:flex;flex-direction:column;gap:6px;';
  entry.sets.forEach((s, sidx)=>{
    const row = el('div');
    row.style.cssText = 'display:flex;gap:6px;align-items:center;';
    const kgI = reviewMiniInput(s.kg, 'kg', 55, v=>{ s.kg = v===''?null:Number(v.replace(',','.')); });
    const xLbl = el('span', null, '×');
    xLbl.style.color = 'var(--muted-2)';
    const serI = reviewMiniInput(s.series, 'series', 55, v=>{ s.series = v===''?null:parseInt(v,10); });
    const xLbl2 = el('span', null, '×');
    xLbl2.style.color = 'var(--muted-2)';
    const repDisplayVal = s.repsParts ? s.repsParts.join('+') : (s.reps ?? '');
    const repI = reviewMiniInput(repDisplayVal, 'repes', 55, v=>{
      const info = parseRepsCell(v);
      s.reps = info.total;
      s.repsParts = info.parts;
    });
    repI.inputMode = 'text'; // admite "2+1" para combos con repes repartidas
    const rmBtn = el('button', null, '×');
    rmBtn.style.cssText = 'background:none;border:none;color:var(--muted-2);font-size:16px;cursor:pointer;padding:0 4px;';
    rmBtn.onclick = ()=>{ entry.sets.splice(sidx,1); render(); };
    row.appendChild(kgI); row.appendChild(xLbl); row.appendChild(serI); row.appendChild(xLbl2); row.appendChild(repI); row.appendChild(rmBtn);
    setsWrap.appendChild(row);
  });
  card.appendChild(setsWrap);

  const addSetBtn = el('button','tb-btn','+ peso');
  addSetBtn.style.marginTop = '4px';
  addSetBtn.onclick = ()=>{ entry.sets.push({kg:null,series:null,reps:null}); render(); };
  card.appendChild(addSetBtn);

  return card;
}

function render(){
  root.innerHTML = '';
  const restBanner = renderRestTimerBanner();
  if (restBanner) root.appendChild(restBanner);
  if (state.ocrBusy){
    root.appendChild(renderOcrProgress());
    return;
  }
  if (state.showProfile){
    root.appendChild(renderProfileScreen());
    if (state.showUsers) root.appendChild(renderUsersSheet());
    if (state.showBackupText) root.appendChild(renderBackupTextOverlay());
  if (state.showVoicePicker) root.appendChild(renderVoicePickerOverlay());
    if (state.showSync) root.appendChild(renderSyncOverlay());
    return;
  }
  const activePlan = state.plans.find(p=>p.id===state.activePlanId);
  if (!activePlan){
    root.appendChild(renderUpload());
    if (state.showUsers) root.appendChild(renderUsersSheet());
    if (state.showBackupText) root.appendChild(renderBackupTextOverlay());
  if (state.showVoicePicker) root.appendChild(renderVoicePickerOverlay());
    if (state.showSync) root.appendChild(renderSyncOverlay());
    return;
  }
  if (activePlan.needsReview && !state.reviewDismissed){
    root.appendChild(renderReviewScreen(activePlan));
    return;
  }
  if (state.showAnalytics){
    root.appendChild(renderAnalyticsScreen());
    return;
  }
  if (!state.activeDay || !activePlan.days[state.activeDay]){
    const firstDay = DAY_ORDER.find(d=>activePlan.days[d]);
    state.activeDay = firstDay || 'L';
  }
  root.appendChild(renderApp(activePlan));
  if (state.flashcard) root.appendChild(renderFlashcardOverlay(activePlan));
  if (state.showHistory) root.appendChild(renderHistorySheet());
  if (state.showUsers) root.appendChild(renderUsersSheet());
  if (state.showDayNote) root.appendChild(renderDayNoteOverlay(activePlan));
  if (state.dayReport) root.appendChild(renderDayReportOverlay());
  if (state.weekReport) root.appendChild(renderWeekReportOverlay(activePlan));
  if (state.showMenu) root.appendChild(renderMenuSheet(activePlan));
  if (state.showSync) root.appendChild(renderSyncOverlay());
  if (state.showBackupText) root.appendChild(renderBackupTextOverlay());
  if (state.showVoicePicker) root.appendChild(renderVoicePickerOverlay());
}

    hp.appendChild(document.createTextNode('¿Ya subiste planes antes? '));
    hp.appendChild(btn);
    wrap.appendChild(hp);
  }
  return wrap;

function handleFile(file){
  const name = (file.name || '').toLowerCase();
  const isPdf = name.endsWith('.pdf');
  const isImage = /\.(jpe?g|png|webp|heic)$/i.test(name) || (file.type && file.type.startsWith('image/'));

  async function run(buf){
    try{
      let result;

      if (isImage){
        state.ocrBusy = true; state.ocrProgress = 0; render();
        const canvas = await loadImageFileToCanvas(file);
        result = await parseImageOrScannedPdf(canvas, (p)=>{ state.ocrProgress = p; render(); });
        state.ocrBusy = false;
      } else if (isPdf){
        result = await parsePdf(buf);
        if (!result.ok){
          // no text layer found -- fall back to OCR by rendering the page(s) as images
          state.ocrBusy = true; state.ocrProgress = 0; render();
          try{
            const canvas = await renderPdfPageToCanvas(buf, 1, 3);
            result = await parseImageOrScannedPdf(canvas, (p)=>{ state.ocrProgress = p; render(); });
          } finally {
            state.ocrBusy = false;
          }
        }
      } else {
        const data = new Uint8Array(buf);
        const wb = XLSX.read(data, { type:'array' });
        result = parseWorkbook(wb);
      }

      if (!result.ok){
        state.error = 'No he podido leer ese archivo. Si es una foto o un PDF escaneado, asegúrate de que la tabla se vea entera, recta y con buena luz. Si puedes, pide el Excel original y lo intentamos con ese.';
        state.rawPreview = result.rows ? result.rows.slice(0,20) : null;
        render();
        return;
      }
      const meta = result.meta || {};
      // Si el propio nombre del archivo indica la semana (p.ej.
      // "Plan_Entrenamiento_Semana_10.xlsx"), se usa ese en vez del
      // detectado dentro de la hoja, que en algunas plantillas puede
      // confundirse con otra celda que también dice "Semana" (como la
      // marca de esta semana en la tabla de máximos).
      const weekFromName = (file.name || '').match(/semana[\s_-]*n?[ºo°]?\s*(\d{1,3})/i);
      if (weekFromName){
        const n = parseInt(weekFromName[1], 10);
        if (!isNaN(n)) meta.week = n;
      }
      const id = planId(meta);
      const plan = { id, meta, days: result.days, uploadedAt: Date.now(), needsReview: !!result.needsReview };
      state.plans.push(plan);
      persistUserData();
      state.activePlanId = id;
      state.activeDay = null;
      state.error = null;
      state.reviewDismissed = false;
      render();
    }catch(err){
      state.ocrBusy = false;
      state.error = 'Ha ocurrido un error leyendo el archivo (' + (err && err.message ? err.message : 'error desconocido') + '). Prueba de nuevo o con otro archivo.';
      render();
    }
  }

  if (isImage){
    run(null);
  } else {
    const reader = new FileReader();
    reader.onload = (e)=> run(e.target.result);
    reader.readAsArrayBuffer(file);
  }
}

function renderExerciseCard(plan, day, entry, idx){
  const card = el('div','ex-card');

  if (ratings.length){
    const avg = ratings.reduce((a,b)=>a+b,0)/ratings.length;

      if (analyzing) analyzeBtn.disabled = true;

    openFlashcards(day, idx, firstUnmarked>=0 ? firstUnmarked : 0);
  };

  return card;

// Borra un peso (serie) concreto de un ejercicio y reindexa sus marcas.
function reindexStoreAfterSetDelete(store, plan, day, exIdx, setIdx){
  const prefix = plan.id + '|' + day + '|' + exIdx + '|';
  const out = {};
  Object.keys(store).forEach(k=>{
    if (k.startsWith(prefix)){
      const oldSetIdx = parseInt(k.slice(prefix.length), 10);
      if (oldSetIdx === setIdx) return;
      const newSetIdx = oldSetIdx > setIdx ? oldSetIdx-1 : oldSetIdx;
      out[prefix + newSetIdx] = store[k];
    } else {
      out[k] = store[k];
    }
  });
  return out;
}

function deleteSetFromEntry(plan, day, exIdx, setIdx){
  const entry = plan.days[day][exIdx];
  entry.sets.splice(setIdx, 1);
  state.checks = reindexStoreAfterSetDelete(state.checks, plan, day, exIdx, setIdx);
  state.seriesProgress = reindexStoreAfterSetDelete(state.seriesProgress, plan, day, exIdx, setIdx);
  persistUserData();
}
