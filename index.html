<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WorkOut 2.0</title>
<style>
  :root{
    --bg:#f4f1ea; --surface:#ffffff; --surface-2:#eceae2; --surface-3:#d9d6cb;
    --chalk:#20242e; --muted:#5a5e68; --muted-2:#8892a0;
    --yellow-deep:#c99a2e; --ok:#2f7dc4; --red:#c14a3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--chalk);
    font-family:'Inter',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{ width:100%; max-width:420px; background:var(--surface); border:1px solid var(--surface-3); border-radius:18px; padding:40px 28px; text-align:center; }
  .mark{ width:64px; height:64px; border-radius:50%; background:radial-gradient(circle at 32% 28%, #f6f3ec, var(--surface-2) 70%); border:3px solid var(--surface-3); margin:0 auto 20px; display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:22px; color:var(--yellow-deep); }
  h1{ font-family:'Oswald',sans-serif; font-weight:700; font-size:26px; margin:0 0 6px; text-transform:uppercase; letter-spacing:.02em; }
  p.sub{ color:var(--muted); font-size:15px; margin:0 0 28px; }
  .opt{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:16px 18px; margin-bottom:12px; background:var(--surface-2); border:2px solid var(--surface-3); border-radius:12px; cursor:pointer; text-decoration:none; color:var(--chalk); }
  .opt .ic{ font-size:22px; flex-shrink:0; }
  .opt .t1{ font-family:'Oswald',sans-serif; font-weight:700; font-size:16px; }
  .opt .t2{ font-size:12.5px; color:var(--muted-2); margin-top:2px; }
  .admin{ margin-top:22px; padding-top:18px; border-top:1px solid var(--surface-3); }
  .admin a{ font-size:12.5px; color:var(--muted-2); text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">W2</div>
    <h1>WorkOut 2.0</h1>
    <p class="sub">¿Cómo quieres entrar?</p>

    <a class="opt" href="atleta.html">
      <span class="ic">🏋️</span>
      <span>
        <div class="t1">Soy atleta</div>
        <div class="t2">Entrar con mi enlace o contraseña</div>
      </span>
    </a>

    <a class="opt" href="entrenador.html">
      <span class="ic">📋</span>
      <span>
        <div class="t1">Soy entrenador</div>
        <div class="t2">Gestionar mi club</div>
      </span>
    </a>

    <div class="admin">
      <a href="superadmin.html">🔒 Acceso de administrador</a>
    </div>
  </div>
</body>
</html>
