<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WorkOut 2.0 · Detalle del plan</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@600;700&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ea; --surface:#ffffff; --surface-2:#eceae2; --surface-3:#d9d6cb;
    --chalk:#20242e; --muted:#5a5e68; --muted-2:#8892a0; --yellow-deep:#c99a2e; --ok:#2f7dc4; --red:#c14a3a;
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--chalk); font-family:'Inter',system-ui,sans-serif; }
  .wrap{ max-width:560px; margin:0 auto; padding:24px 18px 80px; }
  .back{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:15px; color:var(--chalk);
    text-decoration:none; display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--surface-3); border-radius:10px;
    padding:12px 16px; margin-bottom:18px;
  }
  h1{ font-family:'Oswald',sans-serif; font-weight:700; font-size:22px; text-transform:uppercase; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:14px; margin:0 0 20px; }
  .dayCard{ background:var(--surface); border:1px solid var(--surface-3); border-radius:14px; padding:16px; margin-bottom:14px; }
  .dayName{ font-family:'Oswald',sans-serif; font-weight:700; font-size:16px; text-transform:uppercase; margin-bottom:10px; color:var(--yellow-deep); }
  .exName{ font-family:'Oswald',sans-serif; font-weight:700; font-size:14.5px; margin:10px 0 6px; }
  .setRow{ display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .setRow input{ background:var(--surface-2); border:1px solid var(--surface-3); border-radius:8px; color:var(--chalk); font-family:'IBM Plex Mono',monospace; font-size:14px; padding:8px; text-align:center; }
  .setRow input.kg{ width:66px; }
  .setRow input.series{ width:46px; }
  .setRow input.reps{ width:60px; }
  .setRow .x{ color:var(--muted-2); font-size:13px; }
  .restCard{ background:var(--surface); border:1px solid var(--surface-3); border-radius:14px; padding:16px; text-align:center; color:var(--muted); font-family:'Oswald',sans-serif; text-transform:uppercase; margin-bottom:14px; }
  .saveBar{ position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--surface-3); padding:14px 18px; display:flex; justify-content:center; }
  .saveBar button{ width:100%; max-width:520px; background:var(--chalk); color:#fff; border:none; border-radius:10px; font-family:'Oswald',sans-serif; font-weight:700; font-size:16px; padding:15px; cursor:pointer; }
  .msg{ font-size:13px; margin-top:8px; text-align:center; }
  .msg.ok{ color:var(--ok); } .msg.err{ color:var(--red); }
  .hidden{ display:none; }
  .athBlock{ margin:4px 0 12px; padding:10px 12px; border-radius:10px; background:var(--surface-2); }
  .athTitle{ font-family:'Oswald',sans-serif; font-weight:700; font-size:14px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .athSet{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 10px; border-radius:9px; margin-bottom:6px; background:var(--surface); border:2px solid var(--surface-3); font-family:'IBM Plex Mono',monospace; font-size:16px; }
  .athSet.edited{ background:#fde9da; border-color:#e07b39; }
  .athSet.added{ background:#dff3e5; border-color:#2e9a52; }
  .athTag{ font-family:Inter,sans-serif; font-size:13.5px; font-weight:700; color:#fff; border-radius:7px; padding:3px 8px; }
  .athSet.edited .athTag{ background:#e07b39; } .athSet.added .athTag{ background:#2e9a52; }
  .athOrig{ font-size:14px; color:var(--muted); width:100%; }
  .legend{ background:var(--surface); border:1px solid var(--surface-3); border-radius:12px; padding:12px 14px; margin-bottom:16px; font-size:15px; line-height:1.5; }
  .mini{ display:inline-flex; align-items:center; justify-content:center; min-width:34px; height:34px; border-radius:8px; color:#fff; font-size:17px; flex-shrink:0; padding:0 4px; }
  .mini.empty{ background:none; color:var(--muted-2); font-size:13px; }
  .athLine{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:-2px 0 8px 10px; padding:6px 10px; border-radius:8px; border-left:4px solid; font-family:'IBM Plex Mono',monospace; font-size:15px; }
  .athLine.edited{ background:#fde9da; border-color:#e07b39; }
  .athLine.added{ background:#dff3e5; border-color:#2e9a52; margin-left:0; }
  .athLine.deleted{ background:var(--surface-2); border-color:#8892a0; color:var(--muted); }
  .athLine .alabel{ font-family:Inter,sans-serif; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
  .athLine.edited .alabel{ color:#b65a1f; } .athLine.added .alabel{ color:#1f6b39; }
  .athLine .aicon{ font-size:17px; }
  .athNote{ background:#eef4fb; border-left:4px solid var(--ok); border-radius:8px; padding:8px 12px; margin:4px 0 10px; font-size:15px; }
  .athNote .nlabel{ font-weight:700; color:#22609c; font-size:13.5px; text-transform:uppercase; letter-spacing:.03em; margin-right:8px; }
  .athNote .nmeta{ color:var(--muted); font-size:14px; }
  .athNote .ntext{ margin-top:4px; line-height:1.45; color:var(--chalk); white-space:pre-wrap; }
  .coachNote{ margin:6px 0 12px; }
  .coachNote .clabel{ font-size:13.5px; font-weight:700; color:#8a6512; text-transform:uppercase; letter-spacing:.03em; margin-bottom:5px; }
  .coachNote textarea{ width:100%; min-height:64px; border:1.5px solid #ecd9a6; background:#fdf9ee; border-radius:10px; padding:10px 12px; font-family:Inter,sans-serif; font-size:16px; line-height:1.45; color:var(--chalk); resize:vertical; }
  .addNoteLink{ background:none; border:none; color:#8a6512; font-size:14.5px; font-weight:700; padding:4px 0; cursor:pointer; }
  .weekCard{ border:2px solid var(--yellow-deep); }
  .saveRow{ display:flex; gap:10px; }
  .saveRow button{ flex:1; }
  .saveBar button.alt{ background:var(--ok); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" id="backLink" href="ficha-atleta.html">← Volver a la ficha del atleta</a>
  <div id="loadingMsg" class="sub">Cargando…</div>
  <div id="content" class="hidden">
    <h1 id="planTitle">Plan</h1>
    <p class="sub">Toca cualquier número para corregirlo.</p>
    <div id="legend" class="legend hidden"></div>
    <div id="daysWrap"></div>
  </div>
</div>

<div class="saveBar">
  <div style="width:100%;max-width:520px;">
    <div class="saveRow">
      <button id="saveBtn">Guardar</button>
      <button id="saveReviewBtn" class="alt">✓ Guardar y marcar revisado</button>
    </div>
    <div id="saveMsg" class="msg"></div>
  </div>
</div>

<script src="firebase-init.js"></script>
<script>
  const DAY_NAMES = { L:'Lunes', M:'Martes', X:'Miércoles', J:'Jueves', V:'Viernes', S:'Sábado', D:'Domingo' };
  const DAY_ORDER = ['L','M','X','J','V','S','D'];
  const SET_RATING_LEVELS = [
    { value:1, icon:'😫', color:'#c14a3a' },
    { value:2, icon:'😞', color:'#d9793f' },
    { value:3, icon:'😐', color:'#c99a2e' },
    { value:4, icon:'🙂', color:'#5a8fb0' },
    { value:5, icon:'💪', color:'#2f7dc4' }
  ];
  function ratingInfo(v){ return SET_RATING_LEVELS.find(l=>l.value===v) || null; }
  function checkKey(planId, day, exIdx, si){ return planId + '|' + day + '|' + exIdx + '|' + si; }
  let athleteChecks = {};
  let athleteNotes = {};   // notas que escribe el atleta (día / ejercicio)
  let coachComments = {};  // comentarios del entrenador: día, ejercicio y semana
  let athleteChanges = {}; // "L|0": ejercicio tal como lo hizo el atleta
  function overrideDocId(planId){ return 'plan_' + String(planId).replace(/[^A-Za-z0-9_-]/g,'_').slice(0,140); }
  function setText(s){
    const kg = (s.kg ?? s.kgRaw ?? '?');
    const reps = s.repsParts ? s.repsParts.join('+') : (s.repsRaw || (s.reps ?? '?'));
    return kg + 'kg · ' + (s.series ?? '?') + '×' + reps;
  }

  const params = new URLSearchParams(window.location.search);
  const athleteUid = params.get('athlete');
  const planIdParam = params.get('plan');
  document.getElementById('backLink').href = 'ficha-atleta.html?athlete=' + athleteUid;

  let currentClubId = null;
  let planData = null;

  auth.onAuthStateChanged(async (user)=>{
    if (!user){ window.location.href = 'entrenador.html'; return; }
    try{
      const grantSnap = await db.collection('users').doc(user.uid).collection('roleGrants').doc('coach').get();
      if (!grantSnap.exists){ window.location.href = 'entrenador.html'; return; }
      currentClubId = grantSnap.data().clubId;

      const planSnap = await db.collection('clubs').doc(currentClubId).collection('athletes').doc(athleteUid)
        .collection('plans').doc(planIdParam).get();
      if (!planSnap.exists){
        document.getElementById('loadingMsg').textContent = 'No se ha encontrado este plan.';
        return;
      }
      planData = planSnap.data();

      const progSnap = await db.collection('clubs').doc(currentClubId).collection('athletes').doc(athleteUid)
        .collection('progress').doc('main').get();
      athleteChecks = (progSnap.exists && progSnap.data().checks) || {};
      athleteNotes = (progSnap.exists && progSnap.data().notes) || {};
      try{
        const cn = await db.collection('clubs').doc(currentClubId).collection('athletes').doc(athleteUid)
          .collection('coachNotes').doc('comments').get();
        coachComments = (cn.exists && cn.data().comments) || {};
      }catch(e){ coachComments = {}; }
      try{
        const ovSnap = await db.collection('clubs').doc(currentClubId).collection('athletes').doc(athleteUid)
          .collection('progress').doc(overrideDocId(planIdParam)).get();
        const ov = ovSnap.exists ? ovSnap.data() : null;
        athleteChanges = (ov && ov.changes) || {};
      }catch(e){ athleteChanges = {}; }

      render();
    }catch(e){
      document.getElementById('loadingMsg').textContent = 'Error: ' + (e.message || e.code);
    }
  });


  // --- Programación + lo que hizo el atleta, en una sola lista intercalada ---
  function sameSet(a, b){
    if (!a || !b) return false;
    const r = x=> x.repsParts ? x.repsParts.join('+') : String(x.repsRaw || (x.reps ?? ''));
    return String(a.kg ?? a.kgRaw ?? '') === String(b.kg ?? b.kgRaw ?? '') && String(a.series ?? '') === String(b.series ?? '') && r(a) === r(b);
  }
  // Empareja cada peso programado con lo que hizo el atleta (que puede haber
  // cambiado, borrado o añadido pesos) y devuelve la lista en orden.
  function planExerciseItems(coachSets, athSets){
    const items = [];
    if (!athSets){ coachSets.forEach((s, ci)=> items.push({ type:'same', ci, ai:ci })); return items; }
    let ptr = 0;
    athSets.forEach((a, ai)=>{
      if (a.added){ items.push({ type:'added', a, ai }); return; }
      const target = (a.edited && a.original) ? a.original : a;
      let j = -1;
      for (let k = ptr; k < coachSets.length; k++){ if (sameSet(coachSets[k], target)){ j = k; break; } }
      if (j === -1 && ptr < coachSets.length) j = ptr; // el entrenador cambió ese peso después: se empareja por orden
      if (j === -1){ items.push({ type:'added', a, ai }); return; }
      for (let k = ptr; k < j; k++) items.push({ type:'deleted', ci:k });
      const changed = a.edited || !sameSet(coachSets[j], a);
      items.push({ type: changed ? 'edited' : 'same', ci:j, a, ai });
      ptr = j + 1;
    });
    for (let k = ptr; k < coachSets.length; k++) items.push({ type:'deleted', ci:k });
    return items;
  }
  function ratingFor(day, exIdx, ai){ return ai == null ? null : ratingInfo(athleteChecks[checkKey(planIdParam, day, exIdx, ai)] || null); }
  function ratingBadge(rinfo){
    return rinfo
      ? '<span class="mini" style="background:' + rinfo.color + ';">' + rinfo.icon + '</span>'
      : '<span class="mini empty">—</span>';
  }
  function coachRow(day, exIdx, si, s, badge){
    const row = document.createElement('div');
    row.className = 'setRow';
    const repsVal = s.repsParts ? s.repsParts.join('+') : (s.repsRaw || (s.reps ?? ''));
    row.innerHTML = `
      <input class="kg" type="text" value="${s.kg ?? (s.kgRaw||'')}" data-day="${day}" data-ex="${exIdx}" data-set="${si}" data-field="kg">
      <span class="x">kg ×</span>
      <input class="series" type="text" value="${s.series ?? ''}" data-day="${day}" data-ex="${exIdx}" data-set="${si}" data-field="series">
      <span class="x">×</span>
      <input class="reps" type="text" value="${repsVal}" data-day="${day}" data-ex="${exIdx}" data-set="${si}" data-field="reps">
      <span class="x">reps</span>
      ${badge}`;
    return row;
  }
  function athLine(kind, label, a, rinfo){
    const d = document.createElement('div');
    d.className = 'athLine ' + kind;
    d.innerHTML = '<span class="alabel">' + label + '</span>' + (a ? '<span class="aval">' + setText(a) + '</span>' : '') + (rinfo ? '<span class="aicon">' + rinfo.icon + '</span>' : '');
    return d;
  }

  const FEELINGS = { mal:'😞 Mal', regular:'😐 Regular', bien:'🙂 Bien', muybien:'💪 Muy bien' };
  function athleteNoteBox(key){
    const raw = athleteNotes[key];
    if (!raw) return null;
    const n = typeof raw === 'string' ? { text: raw } : raw;
    const bits = [];
    if (n.rpe) bits.push('RPE ' + n.rpe);
    if (n.feeling && FEELINGS[n.feeling]) bits.push(FEELINGS[n.feeling]);
    if (!n.text && !bits.length) return null;
    const d = document.createElement('div');
    d.className = 'athNote';
    d.innerHTML = '<span class="nlabel">📝 Nota del atleta</span>' + (bits.length ? '<span class="nmeta">' + bits.join(' · ') + '</span>' : '');
    if (n.text){ const t = document.createElement('div'); t.className = 'ntext'; t.textContent = n.text; d.appendChild(t); }
    return d;
  }
  // Cuadro de comentario del entrenador. Si está vacío y es de ejercicio, se
  // muestra como un enlace pequeño para no ocupar sitio.
  function coachNoteBox(key, label, placeholder, collapsible){
    const wrap = document.createElement('div');
    wrap.className = 'coachNote';
    const current = coachComments[key] || '';
    const ta = document.createElement('textarea');
    ta.dataset.commentKey = key;
    ta.value = current;
    ta.placeholder = placeholder;
    const lab = document.createElement('div');
    lab.className = 'clabel';
    lab.textContent = label;
    if (collapsible && !current){
      const link = document.createElement('button');
      link.className = 'addNoteLink';
      link.textContent = '💬 Añadir nota a este ejercicio';
      wrap.appendChild(link);
      // el textarea existe aunque esté oculto, para guardarlo igual
      ta.style.display = 'none';
      wrap.appendChild(ta);
      link.onclick = ()=>{ link.remove(); wrap.insertBefore(lab, ta); ta.style.display = ''; ta.focus(); };
    } else {
      wrap.appendChild(lab); wrap.appendChild(ta);
    }
    return wrap;
  }

  function render(){
    document.getElementById('loadingMsg').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
    const label = (planData.meta && planData.meta.week!=null) ? ('Semana ' + planData.meta.week) : planIdParam;
    document.getElementById('planTitle').textContent = label;
    const legend = document.getElementById('legend');
    if (Object.keys(athleteChanges).length){
      legend.classList.remove('hidden');
      legend.innerHTML = '<b>El atleta ha apuntado cambios en esta semana.</b><br>' +
        '<span style="color:#e07b39;font-weight:700;">Naranja</span>: peso o repeticiones cambiados. ' +
        '<span style="color:#2e9a52;font-weight:700;">Verde</span>: pesos añadidos. <span style="color:#5a5e68;font-weight:700;">Gris</span>: no lo hizo.<br>' +
        'Los números editables son tu programación; a la derecha, la valoración del atleta. Lo que cambió o añadió aparece intercalado.';
    } else { legend.classList.add('hidden'); }

    const wrap = document.getElementById('daysWrap');
    wrap.innerHTML = '';
    DAY_ORDER.forEach(day=>{
      const entries = (planData.days && planData.days[day]) || [];
      if (!entries.length) return;
      const card = document.createElement('div');
      const hasExercises = entries.some(e=>e.type==='exercise');
      if (!hasExercises){
        card.className = 'restCard';
        card.textContent = DAY_NAMES[day] + ' — Descanso';
        wrap.appendChild(card);
        return;
      }
      card.className = 'dayCard';
      const h = document.createElement('div');
      h.className = 'dayName';
      h.textContent = DAY_NAMES[day];
      card.appendChild(h);
      const dayNote = athleteNoteBox(planIdParam + '|' + day);
      if (dayNote) card.appendChild(dayNote);

      entries.forEach((entry, exIdx)=>{
        if (entry.type !== 'exercise') return;
        const exName = document.createElement('div');
        exName.className = 'exName';
        exName.textContent = entry.name || ('Código ' + entry.code);
        card.appendChild(exName);

        const athEntry = athleteChanges[day + '|' + exIdx];
        planExerciseItems(entry.sets || [], athEntry ? (athEntry.sets || []) : null).forEach(it=>{
          if (it.type === 'added'){
            card.appendChild(athLine('added', '➕ Añadido', it.a, ratingFor(day, exIdx, it.ai)));
            return;
          }
          const s = entry.sets[it.ci];
          let badge;
          if (it.type === 'same') badge = ratingBadge(ratingFor(day, exIdx, it.ai));
          else if (it.type === 'edited') badge = '<span class="mini" style="background:#e07b39;">✏️</span>';
          else if (it.type === 'deleted') badge = '<span class="mini" style="background:#8892a0;" title="No lo hizo">✕</span>';
          else badge = ratingBadge(null);
          card.appendChild(coachRow(day, exIdx, it.ci, s, badge));
          if (it.type === 'edited') card.appendChild(athLine('edited', 'Hizo', it.a, ratingFor(day, exIdx, it.ai)));
          if (it.type === 'deleted') card.appendChild(athLine('deleted', 'No lo hizo', null, null));
        });
        const exNote = athleteNoteBox(planIdParam + '|' + day + '|' + exIdx);
        if (exNote) card.appendChild(exNote);
        card.appendChild(coachNoteBox(planIdParam + '|' + day + '|' + exIdx, '💬 Tu nota para este ejercicio', 'Ej.: baja el ritmo en la segunda serie…', true));
      });
      card.appendChild(coachNoteBox(planIdParam + '|' + day, '💬 Tu comentario del ' + DAY_NAMES[day].toLowerCase(), 'Comentario para el atleta sobre este día…', false));
      wrap.appendChild(card);
    });

    const weekCard = document.createElement('div');
    weekCard.className = 'dayCard weekCard';
    weekCard.innerHTML = '<div class="dayName" style="color:var(--chalk);">Revisión de la semana</div>';
    weekCard.appendChild(coachNoteBox(planIdParam + '|semana', '💬 Comentario general de la semana', 'Tu valoración de la semana completa, para el atleta…', false));
    wrap.appendChild(weekCard);
  }

  document.getElementById('saveBtn').onclick = ()=> saveAll(false);
  document.getElementById('saveReviewBtn').onclick = ()=> saveAll(true);
  async function saveAll(markReviewed){
    const msg = document.getElementById('saveMsg');
    // Aplica cada input directamente sobre planData.days antes de guardar.
    document.querySelectorAll('[data-field]').forEach(inp=>{
      const day = inp.dataset.day, exIdx = parseInt(inp.dataset.ex,10), si = parseInt(inp.dataset.set,10), field = inp.dataset.field;
      const set = planData.days[day][exIdx].sets[si];
      const val = inp.value.trim();
      if (field === 'kg'){
        const n = Number(val.replace(',','.'));
        if (!isNaN(n) && val !== ''){ set.kg = n; delete set.kgRaw; delete set.optional; }
        else { set.kg = null; set.kgRaw = val; set.optional = true; }
      } else if (field === 'series'){
        const n = parseInt(val,10);
        set.series = isNaN(n) ? null : n;
      } else if (field === 'reps'){
        if (val.includes('+')){
          const parts = val.split('+').map(x=>Number(x.trim())).filter(x=>!isNaN(x));
          set.repsParts = parts.length ? parts : null;
          set.reps = parts.length ? parts.reduce((a,b)=>a+b,0) : null;
          set.repsRaw = null;
        } else {
          const n = Number(val.replace(',','.'));
          if (!isNaN(n) && val !== ''){ set.reps = n; set.repsParts = null; set.repsRaw = null; }
          else { set.reps = null; set.repsParts = null; set.repsRaw = val || null; }
        }
      }
    });
    const comments = {};
    document.querySelectorAll('[data-comment-key]').forEach(ta=>{ comments[ta.dataset.commentKey] = ta.value.trim(); });
    const athRef = db.collection('clubs').doc(currentClubId).collection('athletes').doc(athleteUid);
    try{
      await athRef.collection('plans').doc(planIdParam).set(planData);
      await athRef.collection('coachNotes').doc('comments').set({ comments, updatedAt: Date.now() }, { merge: true });
      Object.assign(coachComments, comments);
      if (markReviewed) await athRef.update({ needsReview: false, reviewedAt: Date.now() });
      msg.textContent = markReviewed ? 'Guardado y marcado como revisado.' : 'Guardado. El atleta verá tus comentarios en su app.';
      msg.className = 'msg ok';
    }catch(e){
      msg.textContent = 'Error al guardar: ' + (e.message || e.code);
      msg.className = 'msg err';
    }
  }
</script>
</body>
</html>
