<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta property="og:title" content="WorkOut 2.0 · La app de halterofilia para clubes">
<meta property="og:description" content="Presentación narrada: el entrenador programa, el atleta entrena y todo queda registrado.">
<meta property="og:image" content="https://rafaparri.github.io/workout2/presentacion/img/01_portada.jpg">
<link rel="icon" type="image/png" sizes="32x32" href="../static/favicon-32.png">
<link rel="apple-touch-icon" href="../static/apple-touch-icon.png">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>WorkOut 2.0 narrado</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400..800&display=swap">
<style>
/* Layout: una "historia" vertical a pantalla completa (móvil); en ordenador, móvil a la izquierda y texto a la derecha. */
:root{
  --bg:#0d1117; --bg2:#11171f; --surface:#161d27; --edge:#33435a; --line:#263242;
  --text:#e8eef4; --muted:#b2bfcc; --muted2:#8494a6;
  --accent:#34d1c4; --ink:#06201d;
  --r-off:#e5484d; --r-low:#f28c28; --r-mid:#2f6fe4; --r-top:#5f7f1f;
  --f-display:'Archivo Black', 'Arial Black', Arial, sans-serif;
  --f-body:'Archivo', Arial, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:17px;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 10px;gap:10px;max-width:1100px;margin:0 auto}
.bars{display:flex;gap:4px}
.bars span{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.bars span i{position:absolute;inset:0;width:0;background:var(--accent)}
.bars span.done i{width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-size:16px;letter-spacing:.02em}
.brand b{color:var(--accent);font-weight:400}
.count{font-size:14px;color:var(--muted2);font-variant-numeric:tabular-nums}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;position:relative}
.slide{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;animation:in .45s ease both}
@keyframes in{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.title{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,6.4vw,44px);line-height:1.08;text-wrap:balance;margin:2px 0 0}
.visual{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.phone{height:100%;max-height:640px;aspect-ratio:390/844;max-width:100%;background:#1b2430;border:1.5px solid var(--edge);border-radius:28px;padding:7px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.phone img{width:100%;height:100%;object-fit:cover;border-radius:21px;display:block}
.cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:520px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center}
.card .n{font-family:var(--f-display);font-size:26px;color:var(--accent);min-width:28px;text-align:center}
.card h3{margin:0;font-size:18px;font-weight:800}
.card p{margin:2px 0 0;font-size:15px;color:var(--muted);line-height:1.35}
.arrow{align-self:center;color:var(--accent);font-size:20px;line-height:1}
.big{font-family:var(--f-display);font-size:clamp(34px,10vw,72px);line-height:1.02;text-wrap:balance}
.big b{color:var(--accent);font-weight:400}
.contact{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.pill{border-radius:999px;padding:10px 18px;font-weight:800;font-size:17px;user-select:all}
.pill.solid{background:var(--accent);color:var(--ink)}
.pill.line{border:1.5px solid var(--edge);color:var(--text)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:420px}
.legend span{border-radius:10px;padding:6px 10px;font-size:14px;font-weight:800}
.sub{min-height:5.6em;font-size:17px;line-height:1.45;color:var(--muted2)}
.sub .s{transition:color .2s}
.sub .s.on{color:var(--text)}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{appearance:none;border:1.5px solid var(--edge);background:transparent;color:var(--text);border-radius:999px;min-width:52px;height:52px;font:800 16px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 16px}
.btn:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.play{background:var(--accent);color:var(--ink);border-color:var(--accent);min-width:150px;font-size:18px}
.btn[disabled]{opacity:.35;cursor:default}
.opts{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;font-size:14px;color:var(--muted2);min-width:0}
.opts select{background:var(--surface);color:var(--text);border:1px solid var(--edge);border-radius:10px;height:38px;padding:0 8px;font:600 14px var(--f-body);min-width:0}
.opts #voice{flex:1;max-width:260px}
@media (max-width:520px){ .opts label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} .sub{font-size:16px;min-height:5em} .btn.play{min-width:130px} }
.note{font-size:13px;color:var(--muted2)}
.start{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:18px;background:linear-gradient(180deg,rgba(13,17,23,.2),rgba(13,17,23,.92) 45%);padding:8px}
.start .big{font-size:clamp(38px,11vw,80px)}
.start p{font-size:18px;color:var(--muted);max-width:30em;line-height:1.45;margin:0}
@media (min-width:860px){
  body{font-size:18px}
  .slide{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto 1fr;column-gap:48px;row-gap:12px;align-content:center}
  .slide .visual{grid-column:1;grid-row:1 / span 3;height:100%}
  .slide .eyebrow,.slide .title,.slide .sub{grid-column:2}
  .slide.novis{grid-template-columns:1fr}
  .slide.novis .visual{grid-column:1;grid-row:auto;height:auto;justify-content:flex-start}
  .slide.novis .eyebrow,.slide.novis .title,.slide.novis .sub{grid-column:1}
  .phone{max-height:560px}
  .sub{font-size:20px;max-width:32em}
}
</style>
</head>
<body>


<div class="app">
  <div class="bars" id="bars" aria-hidden="true"></div>
  <div class="top">
    <div class="brand">WORKOUT <b>2.0</b></div>
    <div class="count" id="count"></div>
  </div>
  <div class="stage" id="stage" aria-live="polite"></div>
  <div class="controls">
    <button class="btn" id="prev" aria-label="Diapositiva anterior">‹</button>
    <button class="btn play" id="play">▶ Reproducir</button>
    <button class="btn" id="next" aria-label="Diapositiva siguiente">›</button>
  </div>
  <div class="opts">
    <label for="voice">Voz</label><select id="voice"></select>
    <label for="rate">Velocidad</label>
    <select id="rate"><option value="0.9">Lenta</option><option value="1" selected>Normal</option><option value="1.1">Rápida</option></select>
  </div>
</div>

<script>
const S = [
 { eb:'Halterofilia · Clubes', t:'WorkOut 2.0', img:'01_portada',
   n:'Esto es WorkOut 2.0, la app de halterofilia para clubes. El entrenador programa, el atleta entrena, y todo queda registrado en el móvil.' },
 { eb:'El problema', t:'Hoy la programación viaja en un Excel por WhatsApp',
   html:'<div class="cards"><div class="card"><div class="n">?</div><div><h3>El entrenador no sabe qué se hizo</h3><p>Manda la semana y no vuelve a saber cómo salió.</p></div></div><div class="card"><div class="n">✎</div><div><h3>Las marcas se pierden</h3><p>Libretas, notas y capturas sueltas.</p></div></div><div class="card"><div class="n">↗</div><div><h3>Nadie ve la evolución</h3><p>Sin histórico no hay gráficas ni datos.</p></div></div></div>',
   n:'Hoy, en casi todos los clubes, la programación viaja en un Excel por WhatsApp. El entrenador no sabe qué se hizo. Las marcas se pierden en libretas. Y nadie ve la evolución.' },
 { eb:'La solución', t:'Una app, tres perfiles', img:'13_perfiles',
   n:'WorkOut lo resuelve con una sola app y tres perfiles: administración, entrenador y atleta. Quien tenga varios, cambia de uno a otro con un toque, sin volver a escribir la contraseña.' },
 { eb:'Cómo funciona', t:'Del Excel del entrenador al móvil del atleta',
   html:'<div class="cards"><div class="card"><div class="n">1</div><div><h3>Sube su Excel de siempre</h3><p>Con los códigos de la federación.</p></div></div><div class="card"><div class="n">2</div><div><h3>La app lo lee sola</h3><p>Días, ejercicios, pesos y fechas.</p></div></div><div class="card"><div class="n">3</div><div><h3>El atleta entrena y marca</h3><p>Cada peso, con su sensación.</p></div></div><div class="card"><div class="n">4</div><div><h3>El entrenador revisa</h3><p>Al momento, corrige y comenta.</p></div></div></div>',
   n:'Funciona así. El entrenador sube su Excel de siempre, con los códigos de la federación. La app lo lee sola y lo convierte en días, ejercicios y pesos. El atleta entrena y marca cada peso. Y el entrenador lo revisa al momento.' },
 { eb:'El atleta', t:'Su semana, de un vistazo', img:'05_semana',
   n:'Esta es la semana del atleta. Cada día con su fecha, cada ejercicio con su código, y cada peso pintado según cómo salió: rojo si no se hizo, naranja si costó, azul si fue bien, y verde oliva si salió perfecto. El trofeo marca el día de competición.' },
 { eb:'El atleta', t:'Una tarjeta por peso, con letra grande', img:'06_tarjeta',
   n:'Al tocar un peso se abre su tarjeta, con letra grande para leerla con la tiza en las manos. Se marcan las series y la sensación, del uno al cinco, con un solo toque.' },
 { eb:'El atleta', t:'Lo que no se hizo también cuenta', img:'15_noentrene',
   n:'Si un día no se entrena, se marca con su motivo. También se puede indicar qué peso, qué series o qué repeticiones no se hicieron, o pasar el entreno a otro día. El entrenador lo ve todo.' },
 { eb:'El entrenador', t:'Todo el club en una pantalla', img:'02_entrenador',
   n:'El entrenador tiene todo el club en una pantalla: los atletas activos, los resultados por revisar, y quién necesita semana nueva.' },
 { eb:'El entrenador', t:'Cada atleta, su progreso', img:'02c_entrenador_cards',
   n:'Cada atleta tiene su ficha, con el porcentaje de la semana hecho y el estado de su programación. Invitar, bloquear o dar de baja es cuestión de un botón.' },
 { eb:'El entrenador', t:'Revisar y corregir en segundos', img:'19_revision',
   n:'Revisar es muy rápido. El entrenador ve cada peso con la sensación del atleta, corrige cualquier número tocándolo, deja su comentario, y marca la semana como revisada.' },
 { eb:'Gráficas', t:'La evolución, a la vista', img:'08_analisis',
   n:'Como cada repetición queda guardada, las gráficas salen solas: la evolución del peso de cada ejercicio, semana a semana.' },
 { eb:'Histórico', t:'Récords personales con fecha', img:'09c_rm',
   n:'Y el historial de récords personales, con su fecha, para ver cómo progresa cada atleta en arrancada, en dos tiempos, y en el resto de ejercicios.' },
 { eb:'Informes', t:'Un informe semanal que se escribe solo', img:'12_informe',
   n:'Cada semana, la app prepara un informe con el cumplimiento, el tonelaje, la sensación media y las marcas conseguidas. Y avisa de las semanas a vigilar.' },
 { eb:'Competiciones', t:'El calendario oficial, dentro de la app', img:'17_calendario',
   n:'Para competir, el entrenador tiene el calendario oficial de España, de Europa, del Mundial y del circuito máster, con las categorías oficiales siempre al día.' },
 { eb:'Competiciones', t:'Objetivos e intentos por atleta', img:'18_comp_detalle',
   n:'Elige la competición, apunta a sus atletas con su categoría, y les marca los objetivos y los intentos planificados.' },
 { eb:'Competiciones', t:'Del intento al total', img:'10c_resultados',
   n:'El día de la competición se anotan los intentos, válidos o nulos. La app calcula el total y, si hay récord, actualiza la marca personal.' },
 { eb:'Cómo se conecta', t:'Del móvil a la nube, en tiempo real',
   html:'<div class="cards"><div class="card"><div class="n">▯</div><div><h3>Móvil, tablet u ordenador</h3><p>iPhone y Android, sin tienda de aplicaciones.</p></div></div><div class="arrow">↓</div><div class="card"><div class="n">⚿</div><div><h3>Conexión cifrada</h3><p>Cada uno con su cuenta y contraseña.</p></div></div><div class="arrow">↓</div><div class="card"><div class="n">☁</div><div><h3>Nube de Google</h3><p>Guarda los datos y aplica los permisos.</p></div></div></div>',
   n:'Todo funciona en iPhone y en Android, sin pasar por ninguna tienda: se abre un enlace y se añade a la pantalla de inicio. Los datos viajan cifrados a la nube de Google, y lo que marca el atleta lo ve el entrenador al momento.' },
 { eb:'Privacidad', t:'Cada club, sus datos', img:'14_admin',
   n:'Y cada club tiene sus datos separados. El atleta solo ve lo suyo, el entrenador solo a su club, y la administración gestiona los accesos sin ver programaciones ni resultados.' },
 { eb:'WorkOut 2.0', t:'Probadla en vuestro club',
   html:'<div class="contact"><div class="big">Hecha por un levantador, <b>para el día a día del club.</b></div><span class="pill solid">Rafa Parrilla</span><span class="pill line">rafa.parri@gmail.com</span><a class="pill line" href="https://wa.me/34624633595" target="_blank" rel="noopener" style="text-decoration:none">WhatsApp · 624 633 595</a></div>',
   n:'WorkOut 2.0. Hecha por un levantador, para el día a día del club. Probadla en vuestro club. Escribid a Rafa Parrilla, a rafa.parri arroba gmail punto com, o por WhatsApp al seis dos cuatro, seis tres tres, cinco nueve cinco.' }
];

const $ = (id)=> document.getElementById(id);
const synth = window.speechSynthesis || null;
let cur = 0, playing = false, sent = 0, timer = null, keep = [], voices = [], started = false;

function sentences(t){ return t.match(/[^.!?]+[.!?]+|[^.!?]+$/g).map(s=> s.trim()).filter(Boolean); }
function bars(){
  const b = $('bars'); b.innerHTML = '';
  S.forEach((_, i)=>{ const s = document.createElement('span'); if (i < cur) s.className = 'done'; const f = document.createElement('i'); s.appendChild(f); b.appendChild(s); });
}
function fill(p){ const s = $('bars').children[cur]; if (s) s.firstChild.style.width = Math.round(p*100) + '%'; }
function render(){
  const d = S[cur];
  const st = $('stage');
  const visual = d.img ? '<div class="visual"><div class="phone"><img src="img/' + d.img + '.jpg" alt="Pantalla de WorkOut 2.0: ' + d.t + '"></div></div>' : '<div class="visual">' + d.html + '</div>';
  st.innerHTML = '<div class="slide' + (d.img ? '' : ' novis') + '"><div class="eyebrow">' + d.eb + '</div><h1 class="title">' + d.t + '</h1>' + visual +
    '<div class="sub">' + sentences(d.n).map((s,i)=> '<span class="s" data-i="' + i + '">' + s + ' </span>').join('') + '</div></div>';
  if (!started) st.appendChild(startCard());
  $('count').textContent = (cur+1) + ' / ' + S.length;
  $('prev').disabled = cur === 0; $('next').disabled = cur === S.length-1;
  bars();
  const nx = S[cur+1]; if (nx && nx.img){ const im = new Image(); im.src = 'img/' + nx.img + '.jpg'; }
}
function startCard(){
  const c = document.createElement('div'); c.className = 'start';
  c.innerHTML = '<div class="eyebrow">Presentación narrada</div><div class="big">WorkOut <b>2.0</b></div><p>Pulsa «Reproducir» para escuchar la presentación con la voz de tu dispositivo. Dura unos cuatro minutos. Sube el volumen y quita el modo silencio.</p>';
  return c;
}
function hi(i){ document.querySelectorAll('.sub .s').forEach(s=> s.classList.toggle('on', Number(s.dataset.i) === i)); }

function pickVoices(){
  if (!synth) return;
  voices = synth.getVoices().filter(v=> /^es/i.test(v.lang));
  const pref = ['Mónica','Monica','Jorge','Marisol','Paulina','Elvira','Alvaro','Álvaro','Google español','Lucía','Lucia','Sergio','Enrique','Conchita'];
  const score = (v)=> (/es[-_]ES/i.test(v.lang) ? 10 : 0) + (pref.findIndex(p=> v.name.indexOf(p) >= 0) >= 0 ? 20 - pref.findIndex(p=> v.name.indexOf(p) >= 0) : 0) + (/premium|enhanced|mejorad|natural|neural/i.test(v.name) ? 15 : 0);
  voices.sort((a,b)=> score(b) - score(a));
  const sel = $('voice'); const keepV = sel.value;
  sel.innerHTML = voices.length ? voices.map((v,i)=> '<option value="' + i + '">' + v.name.replace(/\(.*?\)/g,'').trim() + ' · ' + v.lang + '</option>').join('') : '<option value="">Sin voz en español</option>';
  if (keepV && sel.querySelector('option[value="' + keepV + '"]')) sel.value = keepV;
  try{ const saved = localStorage.getItem('wo2n_voice'); const k = voices.findIndex(v=> v.name === saved); if (k >= 0) sel.value = String(k); }catch(e){}
}
if (synth){ pickVoices(); synth.onvoiceschanged = pickVoices; }

function stopAll(){ clearTimeout(timer); if (synth) synth.cancel(); }
function speakFrom(i){
  const list = sentences(S[cur].n);
  if (i >= list.length){ fill(1); if (playing){ timer = setTimeout(()=>{ if (cur < S.length-1){ cur++; sent = 0; render(); speakFrom(0); } else { playing = false; setPlay(); } }, 700); } return; }
  sent = i; hi(i); fill(i / list.length);
  const text = list[i];
  const v = voices[Number($('voice').value)];
  if (synth && v){
    const u = new SpeechSynthesisUtterance(text);
    u.voice = v; u.lang = v.lang; u.rate = Number($('rate').value);
    let doneOnce = false;
    const go = ()=>{ if (doneOnce) return; doneOnce = true; if (playing) speakFrom(i+1); };
    u.onend = go; u.onerror = (e)=>{ if (e.error !== 'interrupted' && e.error !== 'canceled') go(); };
    keep = [u]; synth.speak(u);
  } else {
    // Sin voz disponible: avanza al ritmo de lectura, con subtítulos
    timer = setTimeout(()=>{ if (playing) speakFrom(i+1); }, Math.max(1800, text.split(/\s+/).length * 380 / Number($('rate').value)));
  }
}
function setPlay(){ $('play').textContent = playing ? '❚❚ Pausa' : (started ? '▶ Seguir' : '▶ Reproducir'); }
function go(n){ stopAll(); cur = Math.max(0, Math.min(S.length-1, n)); sent = 0; render(); hi(-1); if (playing) speakFrom(0); }

$('play').onclick = ()=>{
  if (!started){ started = true; const c = document.querySelector('.start'); if (c) c.remove(); }
  playing = !playing; setPlay();
  if (playing){ stopAll(); speakFrom(sent); } else { stopAll(); }
  try{ navigator.wakeLock && navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}
};
$('prev').onclick = ()=> go(cur-1);
$('next').onclick = ()=> go(cur+1);
$('voice').onchange = ()=>{ try{ const v = voices[Number($('voice').value)]; if (v) localStorage.setItem('wo2n_voice', v.name); }catch(e){} if (playing){ stopAll(); speakFrom(sent); } };
$('rate').onchange = ()=>{ if (playing){ stopAll(); speakFrom(sent); } };
document.addEventListener('keydown', (e)=>{ if (e.key === 'ArrowRight') go(cur+1); else if (e.key === 'ArrowLeft') go(cur-1); else if (e.key === ' ' && e.target === document.body){ e.preventDefault(); $('play').click(); } });
let tx = null;
$('stage').addEventListener('touchstart', (e)=>{ tx = e.touches[0].clientX; }, { passive:true });
$('stage').addEventListener('touchend', (e)=>{ if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 50){ if (!started){ started = true; } go(cur + (dx < 0 ? 1 : -1)); } }, { passive:true });
document.addEventListener('visibilitychange', ()=>{ if (document.hidden && playing){ playing = false; stopAll(); setPlay(); } });
render(); setPlay();
</script>

</body>
</html>
