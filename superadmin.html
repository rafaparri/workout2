<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkOut 2.0 · Administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#f4f1ea; --surface:#ffffff; --surface-2:#eceae2; --surface-3:#d9d6cb;
    --chalk:#20242e; --muted:#5a5e68; --muted-2:#8892a0; --gold:#c99a2e;
    --ok:#2f7dc4; --green:#2e9a52; --red:#c14a3a;
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--chalk); font-family:'Inter',system-ui,sans-serif; font-size:16px; }
  .hidden{ display:none !important; }
  header{ background:#20242e; border-bottom:4px solid var(--gold); color:#f4f1ea; }
  .hin{ max-width:1100px; margin:0 auto; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand img{ height:46px; }
  .brand .t1{ font-family:'Oswald',sans-serif; font-weight:700; font-size:22px; letter-spacing:.04em; text-transform:uppercase; }
  .brand .t2{ font-size:14px; color:#c9ccd3; }
  .signout{ background:none; border:1.5px solid #5a6070; color:#f4f1ea; border-radius:10px; padding:9px 16px; font-size:15px; font-weight:600; cursor:pointer; }
  main{ max-width:1100px; margin:0 auto; padding:26px 20px 60px; }
  .loginBox{ max-width:420px; margin:60px auto; background:var(--surface); border:1px solid var(--surface-3); border-radius:18px; padding:32px 26px; }
  h1{ font-family:'Oswald',sans-serif; font-weight:700; font-size:26px; text-transform:uppercase; letter-spacing:.03em; margin:0 0 18px; }
  h2{ font-family:'Oswald',sans-serif; font-weight:700; font-size:20px; text-transform:uppercase; letter-spacing:.03em; margin:0; }
  label{ display:block; font-size:13.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin:0 0 6px; }
  input{ width:100%; background:var(--surface-2); border:1px solid var(--surface-3); border-radius:10px; color:var(--chalk); font-size:16px; padding:12px; margin-bottom:14px; }
  .btn{ background:var(--chalk); color:#fff; border:none; border-radius:10px; font-family:'Oswald',sans-serif; font-weight:700; font-size:16px; letter-spacing:.02em; padding:12px 18px; cursor:pointer; }
  .btn.full{ width:100%; }
  .btn.light{ background:var(--surface-2); color:var(--chalk); border:1px solid var(--surface-3); }
  .btn.red{ background:var(--red); } .btn.green{ background:var(--green); } .btn.blue{ background:var(--ok); }
  .msg{ font-size:15px; margin-top:10px; } .msg.err{ color:var(--red); } .msg.ok{ color:var(--green); }
  .note{ background:#fdf6e3; border:1px solid #ecd9a6; border-radius:12px; padding:12px 16px; font-size:15px; color:#6b5418; margin-bottom:20px; }
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:14px; margin-bottom:24px; }
  .kpi{ background:var(--surface); border:1px solid var(--surface-3); border-radius:14px; padding:16px 18px; }
  .kpi .n{ font-family:'Oswald',sans-serif; font-weight:700; font-size:34px; line-height:1.1; }
  .kpi .t{ font-size:14.5px; color:var(--muted); margin-top:2px; }
  .sectionHead{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:6px 0 14px; flex-wrap:wrap; }
  .clubs{ display:grid; gap:16px; }
  .club{ background:var(--surface); border:1px solid var(--surface-3); border-radius:16px; overflow:hidden; }
  .club.blocked{ border-color:#e6b4ab; }
  .clubTop{ display:flex; gap:16px; align-items:center; padding:18px; flex-wrap:wrap; }
  .logo{ width:76px; height:76px; border-radius:14px; background:#20242e; display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; }
  .logo img{ max-width:88%; max-height:88%; object-fit:contain; }
  .logo .ini{ font-family:'Oswald',sans-serif; font-weight:700; font-size:26px; color:#f4f1ea; }
  .cinfo{ flex:1; min-width:220px; }
  .cname{ font-family:'Oswald',sans-serif; font-weight:700; font-size:23px; text-transform:uppercase; letter-spacing:.02em; }
  .cmeta{ font-size:14.5px; color:var(--muted); margin-top:3px; line-height:1.5; }
  .pills{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .pill{ display:inline-flex; align-items:center; gap:7px; border-radius:999px; padding:6px 13px; font-size:14.5px; }
  .pill b{ font-weight:700; }
  .pdot{ width:9px; height:9px; border-radius:50%; }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; padding:0 18px 16px; }
  .actions .btn{ font-size:14.5px; padding:10px 14px; }
  .athToggle{ width:100%; text-align:left; background:var(--surface-2); border:none; border-top:1px solid var(--surface-3); padding:14px 18px; font-size:16px; font-weight:700; color:var(--chalk); cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .athList{ padding:6px 18px 14px; background:#faf9f5; }
  .athItem{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--surface-3); flex-wrap:wrap; }
  .athItem:last-child{ border-bottom:none; }
  .av{ width:40px; height:40px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; color:var(--muted); flex-shrink:0; }
  .athName{ font-weight:700; font-size:16px; } .athMail{ font-size:14px; color:var(--muted-2); }
  .empty{ color:var(--muted-2); font-size:15px; padding:12px 0; }
  .newClub{ background:var(--surface); border:1px solid var(--surface-3); border-radius:16px; padding:20px; margin-bottom:22px; }
  .row2{ display:flex; gap:12px; flex-wrap:wrap; } .row2 > *{ flex:1; min-width:180px; }
</style>
</head>
<body>
<header>
  <div class="hin">
    <div class="brand"><img id="rptLogo" alt="RPT"><div><div class="t1">WorkOut 2.0</div><div class="t2">Panel de administración</div></div></div>
    <button class="signout hidden" id="signoutBtn">Salir</button>
  </div>
</header>

<main>
  <div class="loginBox hidden" id="loginWrap">
    <h1>Administrador</h1>
    <label>Correo</label>
    <input type="email" id="email" autocomplete="username">
    <label>Contraseña</label>
    <input type="password" id="pass" autocomplete="current-password">
    <button class="btn full" id="loginBtn">Entrar</button>
    <div id="msg" class="msg err"></div>
  </div>

  <div id="dashWrap" class="hidden">
    <div class="note">🔒 Desde este panel se gestionan clubes, suscripciones y accesos. <b>No hay acceso a las programaciones ni a los resultados</b>: son datos de cada entrenador.</div>

    <div class="kpis" id="kpis"></div>

    <div class="sectionHead">
      <h2>Clubes</h2>
      <button class="btn" id="toggleNewClub">+ Nuevo club</button>
    </div>

    <div class="newClub hidden" id="newClubBox">
      <h2 style="margin-bottom:14px;">Dar de alta un club</h2>
      <div class="row2">
        <div><label>Nombre del club</label><input type="text" id="clubName" placeholder="Ej. Halterejido"></div>
        <div><label>Logo del club (opcional)</label><input type="file" id="clubLogoFile" accept="image/*"></div>
      </div>
      <img id="clubLogoPreview" alt="" style="display:none; height:64px; margin:-4px 0 14px; border-radius:8px; background:#20242e; padding:6px;">
      <div class="row2">
        <div><label>Nombre del entrenador</label><input type="text" id="coachName"></div>
        <div><label>Correo del entrenador</label><input type="email" id="coachEmail"></div>
      </div>
      <div class="row2">
        <div><label>Días de prueba (vacío = sin límite)</label><input type="number" id="trialDays" placeholder="Ej. 30"></div>
        <div><label>Máx. atletas (vacío = sin límite)</label><input type="number" id="maxAthletes" placeholder="Ej. 20"></div>
      </div>
      <button class="btn full" id="createClubBtn">Crear club e invitar al entrenador</button>
      <div id="createMsg" class="msg"></div>
    </div>

    <div class="clubs" id="clubsList"><div class="empty">Cargando…</div></div>
  </div>
</main>

<script src="firebase-init.js"></script>
<script src="branding.js"></script>
<script>
  document.getElementById('rptLogo').src = 'data:image/png;base64,' + RPT_LOGO_B64;

  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function pill(label, value, kind){
    const c = { ok:['#dff3e5','#1f6b39','#2e9a52'], bad:['#f8e1dd','#9c3427','#c14a3a'], off:['#eceae2','#5a5e68','#8892a0'], info:['#e2eefa','#22609c','#2f7dc4'] }[kind] || ['#eceae2','#5a5e68','#8892a0'];
    return '<span class="pill" style="background:'+c[0]+';color:'+c[1]+';"><span class="pdot" style="background:'+c[2]+';"></span>'+label+': <b>'+value+'</b></span>';
  }
  // Suscripción: si el club no tiene el dato (clubes antiguos), cuenta como activa.
  function subActive(c){ return c.subscriptionActive !== false; }

  async function showDashIfAdmin(user){
    const g = await db.collection('users').doc(user.uid).collection('roleGrants').doc('superadmin').get();
    if (!g.exists){
      await auth.signOut();
      document.getElementById('msg').textContent = 'La cuenta ' + (user.email||'') + ' no tiene acceso de administrador.';
      showLogin();
      return;
    }
    document.getElementById('loginWrap').classList.add('hidden');
    document.getElementById('dashWrap').classList.remove('hidden');
    document.getElementById('signoutBtn').classList.remove('hidden');
    loadClubs();
  }
  function showLogin(){
    document.getElementById('loginWrap').classList.remove('hidden');
    document.getElementById('dashWrap').classList.add('hidden');
    document.getElementById('signoutBtn').classList.add('hidden');
  }
  let started = false;
  auth.onAuthStateChanged(async user=>{
    if (started) return; started = true;
    if (user) showDashIfAdmin(user); else showLogin();
  });

  document.getElementById('loginBtn').onclick = async ()=>{
    const msg = document.getElementById('msg');
    msg.textContent = '';
    try{
      const cred = await auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(), document.getElementById('pass').value);
      showDashIfAdmin(cred.user);
    }catch(e){ msg.textContent = 'No se ha podido entrar: ' + (e.message || e.code); }
  };
  document.getElementById('signoutBtn').onclick = ()=> auth.signOut().then(()=> window.location.reload());
  document.getElementById('toggleNewClub').onclick = ()=> document.getElementById('newClubBox').classList.toggle('hidden');

  function slugify(name){
    return name.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')
      .slice(0,30) + '-' + Date.now().toString(36).slice(-4);
  }

  // --- Logo del club: se reduce a 256 px y se guarda dentro de la ficha del club ---
  let pendingLogo = null;
  function imageFileToDataUrl(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=> reject(new Error('No se pudo leer la imagen'));
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = ()=> reject(new Error('El archivo no es una imagen válida'));
        img.onload = ()=>{
          const max = 256;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(cv.toDataURL('image/png'));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  function pickImage(onDone){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async ()=>{
      if (!inp.files[0]) return;
      try{ onDone(await imageFileToDataUrl(inp.files[0])); }
      catch(err){ alert(err.message); }
    };
    inp.click();
  }

  document.getElementById('clubLogoFile').onchange = async (e)=>{
    const prev = document.getElementById('clubLogoPreview');
    if (!e.target.files[0]){ pendingLogo = null; prev.style.display='none'; return; }
    try{ pendingLogo = await imageFileToDataUrl(e.target.files[0]); prev.src = pendingLogo; prev.style.display = 'block'; }
    catch(err){ alert(err.message); pendingLogo = null; }
  };

  document.getElementById('createClubBtn').onclick = async ()=>{
    const msg = document.getElementById('createMsg');
    msg.textContent = ''; msg.className = 'msg';
    const name = document.getElementById('clubName').value.trim();
    const coachEmail = document.getElementById('coachEmail').value.trim().toLowerCase();
    const coachName = document.getElementById('coachName').value.trim();
    const trialDaysVal = document.getElementById('trialDays').value.trim();
    const maxAthletesVal = document.getElementById('maxAthletes').value.trim();
    if (!name || !coachEmail || !coachName){ msg.textContent = 'Rellena nombre del club, nombre y correo del entrenador.'; msg.className = 'msg err'; return; }
    try{
      const clubId = slugify(name);
      const trialEndsAt = trialDaysVal ? (Date.now() + parseInt(trialDaysVal,10)*86400000) : null;
      const maxAthletes = maxAthletesVal ? parseInt(maxAthletesVal,10) : null;
      await db.collection('clubs').doc(clubId).set({
        name, blocked:false, subscriptionActive:true, trialEndsAt, maxAthletes, logoUrl: pendingLogo || null,
        coachName, coachEmail, createdAt: Date.now()
      });
      const inviteId = coachEmail.replace(/[^a-z0-9]/g,'_') + '_coach';
      await db.collection('invites').doc(inviteId).set({ email: coachEmail, name: coachName, clubId, role:'coach', createdAt: Date.now() });
      await auth.sendSignInLinkToEmail(coachEmail, {
        url: window.location.origin + window.location.pathname.replace('superadmin.html','entrenador.html') + '?invite=' + inviteId,
        handleCodeInApp: true
      });
      msg.textContent = 'Club creado e invitación enviada a ' + coachEmail + '.'; msg.className = 'msg ok';
      ['clubName','coachEmail','coachName','trialDays','maxAthletes','clubLogoFile'].forEach(id=> document.getElementById(id).value = '');
      pendingLogo = null; document.getElementById('clubLogoPreview').style.display = 'none';
      loadClubs();
    }catch(e){ msg.textContent = 'Error al crear el club: ' + (e.message || e.code); msg.className = 'msg err'; }
  };

  async function loadClubs(){
    const listEl = document.getElementById('clubsList');
    const snap = await db.collection('clubs').get();
    const clubs = snap.docs.map(d=>({ id:d.id, ref:d.ref, ...d.data() })).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const athletesByClub = {};
    await Promise.all(clubs.map(async c=>{
      try{
        const s = await db.collection('clubs').doc(c.id).collection('athletes').get();
        athletesByClub[c.id] = s.docs.map(d=>d.data()).sort((x,y)=>String(x.name||'').localeCompare(String(y.name||''),'es'));
      }catch(e){ athletesByClub[c.id] = null; }
    }));
    const totalAth = Object.values(athletesByClub).reduce((n,l)=>n+(l?l.length:0),0);
    document.getElementById('kpis').innerHTML =
      '<div class="kpi"><div class="n">'+clubs.length+'</div><div class="t">Clubes dados de alta</div></div>' +
      '<div class="kpi"><div class="n" style="color:var(--green);">'+clubs.filter(subActive).length+'</div><div class="t">Suscripciones activas</div></div>' +
      '<div class="kpi"><div class="n" style="color:var(--red);">'+clubs.filter(c=>c.blocked).length+'</div><div class="t">Accesos bloqueados</div></div>' +
      '<div class="kpi"><div class="n">'+totalAth+'</div><div class="t">Atletas en total</div></div>';

    if (!clubs.length){ listEl.innerHTML = '<div class="empty">Todavía no hay ningún club dado de alta.</div>'; return; }
    listEl.innerHTML = '';
    clubs.forEach(c=>{
      const aths = athletesByClub[c.id];
      const card = document.createElement('div');
      card.className = 'club' + (c.blocked ? ' blocked' : '');
      const initials = (c.name||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
      const trial = c.trialEndsAt ? (c.trialEndsAt > Date.now() ? 'Prueba hasta ' + new Date(c.trialEndsAt).toLocaleDateString('es-ES') : 'Prueba caducada') : '';
      const meta = [
        c.coachName || c.coachEmail ? ('Entrenador: ' + esc(c.coachName||'') + (c.coachEmail ? ' (' + esc(c.coachEmail) + ')' : '')) : '',
        c.createdAt ? 'Alta: ' + new Date(c.createdAt).toLocaleDateString('es-ES') : '',
        trial,
        c.maxAthletes!=null ? ('Máx. ' + c.maxAthletes + ' atletas') : ''
      ].filter(Boolean).join(' · ');
      card.innerHTML = `
        <div class="clubTop">
          <div class="logo">${c.logoUrl ? '<img alt="">' : '<span class="ini">'+esc(initials)+'</span>'}</div>
          <div class="cinfo">
            <div class="cname">${esc(c.name)}</div>
            <div class="cmeta">${meta || '&nbsp;'}</div>
            <div class="pills">
              ${pill('Suscripción', subActive(c) ? 'Activa' : 'No activa', subActive(c) ? 'ok' : 'off')}
              ${pill('Acceso', c.blocked ? 'Bloqueado' : 'Habilitado', c.blocked ? 'bad' : 'ok')}
              ${pill('Atletas', aths ? aths.length : '—', 'info')}
            </div>
          </div>
        </div>
        <div class="actions">
          <button class="btn ${subActive(c) ? 'light' : 'green'}" data-a="sub">${subActive(c) ? 'Desactivar suscripción' : 'Activar suscripción'}</button>
          <button class="btn ${c.blocked ? 'green' : 'red'}" data-a="block">${c.blocked ? 'Habilitar acceso' : 'Bloquear acceso'}</button>
          <button class="btn light" data-a="logo">${c.logoUrl ? 'Cambiar logo' : 'Subir logo'}</button>
          ${c.logoUrl ? '<button class="btn light" data-a="nologo">Quitar logo</button>' : ''}
        </div>
        <button class="athToggle"><span>👥 Ver atletas del club (${aths ? aths.length : '—'})</span><span class="arrow">▾</span></button>
        <div class="athList hidden"></div>`;
      if (c.logoUrl) card.querySelector('.logo img').src = c.logoUrl;

      const list = card.querySelector('.athList');
      if (!aths) list.innerHTML = '<div class="empty">No se han podido cargar los atletas.</div>';
      else if (!aths.length) list.innerHTML = '<div class="empty">Este club todavía no tiene atletas.</div>';
      else list.innerHTML = aths.map(a=>{
        const ini = (a.name||a.email||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
        return '<div class="athItem"><div class="av">'+esc(ini)+'</div><div style="flex:1;min-width:160px;"><div class="athName">'+esc(a.name||a.email)+'</div><div class="athMail">'+esc(a.email||'')+'</div></div>' +
               pill('Acceso', a.blocked ? 'Bloqueado' : 'Habilitado', a.blocked ? 'bad' : 'ok') + '</div>';
      }).join('');
      card.querySelector('.athToggle').onclick = ()=>{
        list.classList.toggle('hidden');
        card.querySelector('.arrow').textContent = list.classList.contains('hidden') ? '▾' : '▴';
      };
      card.querySelector('[data-a="sub"]').onclick = async ()=>{
        await c.ref.update({ subscriptionActive: !subActive(c) }); loadClubs();
      };
      card.querySelector('[data-a="block"]').onclick = async ()=>{
        if (!c.blocked && !confirm('¿Bloquear el acceso del club ' + c.name + '? Ni el entrenador ni sus atletas podrán entrar.')) return;
        await c.ref.update({ blocked: !c.blocked }); loadClubs();
      };
      card.querySelector('[data-a="logo"]').onclick = ()=> pickImage(async dataUrl=>{ await c.ref.update({ logoUrl: dataUrl }); loadClubs(); });
      const nl = card.querySelector('[data-a="nologo"]');
      if (nl) nl.onclick = async ()=>{ if (!confirm('¿Quitar el logo de este club?')) return; await c.ref.update({ logoUrl: null }); loadClubs(); };
      listEl.appendChild(card);
    });
  }
</script>
</body>
</html>
